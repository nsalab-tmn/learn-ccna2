    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы R1, R2, R3 и I-Net настроены: на их интерфейсах заданы IP-адреса по таблице адресации, а маршруты между сетями статические. Маршрутизаторы R1 и R3 отправляют пакеты в Интернет через R2, а R2 — через I-Net.
        - Пакеты к локальной сети 192.168.1.0/24 маршрутизатор R2 отправляет через R1. Если соединение маршрутизатора R1 с локальной сетью отключено, R1 передает эти пакеты маршрутизатору R3 по соединению между их интерфейсами G0/2.
        - Маршрутизатор I-Net и веб-сервер Web-Server изображают Интернет.
        - На коммутаторах и компьютерах заданы IP-адреса и шлюзы по умолчанию по таблице адресации: коммутатор S1 и компьютер PC-A используют шлюзом маршрутизатор R1 (192.168.1.1), а коммутатор S3 и компьютер PC-B — маршрутизатор R3 (192.168.1.3).
        - Протокол HSRP на маршрутизаторах не настроен.
    - title: "Проверка путей к веб-серверу"
      body: |
        **Шаг 1.** Откройте окно компьютера PC-A и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выполните трассировку маршрута до веб-сервера командой **tracert 209.165.200.226**. Трассировка завершается («Trace complete.»): до веб-сервера четыре перехода, и по таблице адресации можно определить, каким устройствам принадлежат адреса на пути.

        ```
        C:\>tracert 209.165.200.226

        Tracing route to 209.165.200.226 over a maximum of 30 hops:

          1     1 ms    <1 ms    <1 ms  192.168.1.1
          2     *        1 ms     1 ms  10.1.1.2
          3     *        1 ms     1 ms  10.100.100.2
          4     *        1 ms     1 ms  209.165.200.226

        Trace complete.
        ```

        **Примечание.** Каждый переход трассировка проверяет тремя пакетами. Знак «*» означает, что ответ на пакет не пришел: первые пакеты могут теряться, пока маршрутизаторы на пути определяют MAC-адреса следующих переходов по протоколу ARP.

        **Шаг 2.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 3.** Откройте окно компьютера PC-B и в приложении «Командная строка» выполните такую же трассировку командой **tracert 209.165.200.226**. Первый переход — маршрутизатор R3 (192.168.1.3), шлюз по умолчанию компьютера PC-B.

        ```
        C:\>tracert 209.165.200.226

        Tracing route to 209.165.200.226 over a maximum of 30 hops:

          1     1 ms    <1 ms    <1 ms  192.168.1.3
          2     *        *        1 ms  10.1.1.2
          3     1 ms     1 ms     1 ms  10.100.100.2
          4     2 ms     2 ms     2 ms  209.165.200.226

        Trace complete.
        ```

        **Примечание.** Маршрутизатор отвечает на трассировку с адреса того интерфейса, через который отправляет ответ. Пакеты к сети 192.168.1.0/24 маршрутизатор R2 отправляет через R1, поэтому на втором переходе указан адрес его интерфейса G0/0, 10.1.1.2, а не адрес интерфейса G0/1, 10.1.1.5, на который пакеты пришли от R3.

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 5.** Удалите соединение между маршрутизатором R3 и коммутатором S3: щелкните правой кнопкой мыши кабель между R3 и S3 на схеме и выберите «Удалить соединение».

        **Шаг 6.** В приложении «Командная строка» компьютера PC-B снова выполните трассировку командой **tracert 209.165.200.226**. Ответов нет ни на одном переходе («Request timed out.»): шлюз по умолчанию компьютера PC-B, маршрутизатор R3, больше не подключен к локальной сети, и пакеты PC-B ее не покидают, хотя маршрутизатор R1 по-прежнему доступен через коммутатор S1. Трассировка до недоступного узла продолжается до 30 переходов, поэтому после двух-трех переходов прервите ее клавишами Ctrl+C.

        ```
        C:\>tracert 209.165.200.226

        Tracing route to 209.165.200.226 over a maximum of 30 hops:

          1     *        *        *     Request timed out.
          2     *        *        *     Request timed out.
          3^C
        ```

        **Шаг 7.** Восстановите соединение: наведите указатель на коммутатор S3, нажмите «Соединить» над ним и щелкните маршрутизатор R3. В окне выбора кабеля оставьте тип «Медный прямой», в поле «Порт S3» выберите порт G0/1, убедитесь, что в поле «Порт R3» выбран порт G0/0, и нажмите «Соединить».

        **Шаг 8.** Дождитесь, когда оба конца нового соединения на схеме загорятся зеленым («Соединение активно» в условных обозначениях): около 30 секунд конец у коммутатора S3 остается оранжевым («Порт заблокирован STP»), пока порт проходит состояния протокола STP. Затем в приложении «Командная строка» компьютера PC-B проверьте связь с веб-сервером командой **ping 209.165.200.226**. Веб-сервер снова отвечает.

        ```
        C:\>ping 209.165.200.226

        Pinging 209.165.200.226 with 32 bytes of data:

        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125

        Ping statistics for 209.165.200.226:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```
    - title: "Настройка протокола HSRP"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**, затем в режим глобальной конфигурации командой **configure terminal** и к настройке интерфейса локальной сети командой **interface g0/1**.

        **Шаг 2.** Включите вторую версию протокола HSRP командой **standby version 2**.

        **Примечание.** Версия протокола должна совпадать на маршрутизаторах группы. Версии используют разные виртуальные MAC-адреса: версия 1 — 0000.0C07.ACxx, версия 2 — 0000.0C9F.Fxxx, где в конце записан номер группы в шестнадцатеричном виде. Версия 1, кроме того, поддерживает только IPv4.

        **Шаг 3.** Задайте виртуальный IP-адрес группы HSRP 1 командой **standby 1 ip 192.168.1.254**. Номер группы, здесь 1, должен совпадать на маршрутизаторах группы. Виртуальный адрес станет шлюзом по умолчанию узлов локальной сети вместо адреса интерфейса маршрутизатора.

        ```
        R1>enable
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/1
        R1(config-if)#standby version 2
        R1(config-if)#standby 1 ip 192.168.1.254
        ```

        **Шаг 4.** Задайте маршрутизатору R1 приоритет 150 в группе 1 командой **standby 1 priority 150**.

        **Примечание.** Активным маршрутизатором группы становится маршрутизатор с наибольшим приоритетом, а при равных приоритетах — с наибольшим IP-адресом интерфейса. Приоритет по умолчанию — 100.

        **Шаг 5.** Включите вытеснение командой **standby 1 preempt** и вернитесь в привилегированный режим EXEC командой **end**. Примерно через 10 секунд после команды **standby 1 ip** маршрутизатор R1 становится активным (сообщения «Speak -> Standby» и «Standby -> Active»): в группе он пока один. Сообщения могут появиться в консоли между командами.

        ```
        R1(config-if)#standby 1 priority 150
        R1(config-if)#standby 1 preempt
        R1(config-if)#
        *Mar  1 00:03:19.205: %HSRP-5-STATECHANGE: GigabitEthernet0/1 Grp 1 state Speak -> Standby
        R1(config-if)#
        *Mar  1 00:03:19.205: %HSRP-5-STATECHANGE: GigabitEthernet0/1 Grp 1 state Standby -> Active
        R1(config-if)#end
        *Mar  1 00:03:23.242: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Маршрутизатор, который только что вошел в группу, сначала около 10 секунд (время удержания, hold time) рассылает пакеты приветствия в состоянии Speak и лишь затем становится резервным (Standby) или активным (Active). Вытеснение (preempt) позволяет маршрутизатору с более высоким приоритетом отобрать роль активного у маршрутизатора с более низким приоритетом, пакеты приветствия которого он получает. Без вытеснения активный маршрутизатор сохраняет роль, даже если в группе появился маршрутизатор с более высоким приоритетом.

        **Шаг 6.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 7.** Откройте консоль маршрутизатора R3 и нажмите Enter. Перейдите к настройке интерфейса локальной сети командами **enable**, **configure terminal** и **interface g0/0**.

        **Шаг 8.** Включите вторую версию протокола командой **standby version 2**, задайте виртуальный IP-адрес группы 1 командой **standby 1 ip 192.168.1.254** и вернитесь в привилегированный режим EXEC командой **end**. Приоритет и вытеснение на маршрутизаторе R3 не настраивайте: он остается в группе с приоритетом по умолчанию и без вытеснения. Примерно через 10 секунд маршрутизатор R3 становится резервным (сообщение «Speak -> Standby»), потому что активный маршрутизатор в группе уже есть.

        ```
        R3>enable
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#interface g0/0
        R3(config-if)#standby version 2
        R3(config-if)#standby 1 ip 192.168.1.254
        R3(config-if)#
        *Mar  1 00:04:35.492: %HSRP-5-STATECHANGE: GigabitEthernet0/0 Grp 1 state Speak -> Standby
        R3(config-if)#end
        *Mar  1 00:04:49.565: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 9.** В консоли маршрутизатора R1 выведите сведения о группе HSRP командой **show standby**. Найдите в выводе состояние маршрутизатора (State), виртуальный IP-адрес и виртуальный MAC-адрес группы, интервал приветствия и время удержания (Hello time, hold time), вытеснение (Preemption), приоритет (Priority) и адреса активного и резервного маршрутизаторов (Active router, Standby router).

        ```
        R1#show standby
        GigabitEthernet0/1 - Group 1 (version 2)
          State is Active
            4 state changes, last state change 0:01:44
          Virtual IP address is 192.168.1.254
          Active virtual MAC address is 0000.0C9F.F001
            Local virtual MAC address is 0000.0C9F.F001 (v2 default)
          Hello time 3 sec, hold time 10 sec
            Next hello sent in 0.487 secs
          Preemption enabled
          Active router is local
          Standby router is 192.168.1.3
          Priority 150 (configured 150)
          Group name is "hsrp-Gi0/1-1" (default)
        ```

        **Шаг 10.** Аналогично в консоли маршрутизатора R3 выведите сведения командой **show standby**. Вытеснение на R3 выключено (Preemption disabled), а приоритет — значение по умолчанию (default).

        ```
        R3#show standby
        GigabitEthernet0/0 - Group 1 (version 2)
          State is Standby
            3 state changes, last state change 0:00:30
          Virtual IP address is 192.168.1.254
          Active virtual MAC address is 0000.0C9F.F001
            Local virtual MAC address is 0000.0C9F.F001 (v2 default)
          Hello time 3 sec, hold time 10 sec
            Next hello sent in 2.666 secs
          Preemption disabled
          Active router is 192.168.1.1
            MAC address is 00d0.2662.4501
          Standby router is local
          Priority 100 (default 100)
          Group name is "hsrp-Gi0/0-1" (default)
        ```

        **Шаг 11.** Ответьте на вопросы 4, 5 и 6 в форме ответов.

        **Шаг 12.** В консоли маршрутизатора R1 выведите сводку командой **show standby brief**: одна строка на группу с приоритетом, признаком вытеснения (P), состоянием, адресами активного и резервного маршрутизаторов и виртуальным IP-адресом.

        ```
        R1#show standby brief
                             P indicates configured to preempt.
                             |
        Interface   Grp  Pri P State   Active          Standby         Virtual IP
        Gi0/1       1    150 P Active  local           192.168.1.3     192.168.1.254
        ```

        **Шаг 13.** Аналогично выведите сводку командой **show standby brief** в консоли маршрутизатора R3.

        ```
        R3#show standby brief
                             P indicates configured to preempt.
                             |
        Interface   Grp  Pri P State   Active          Standby         Virtual IP
        Gi0/0       1    100   Standby 192.168.1.1     local           192.168.1.254
        ```
    - title: "Настройка виртуального шлюза по умолчанию"
      body: |
        **Шаг 1.** Компьютеры и коммутаторы по-прежнему используют шлюзом по умолчанию адрес интерфейса одного из маршрутизаторов, и при отказе этого маршрутизатора протокол HSRP им не поможет: шлюзом должен быть адрес, который принадлежит группе, а не одному маршрутизатору. Ответьте на вопрос 7 в форме ответов.

        **Шаг 2.** В приложении «Командная строка» компьютера PC-A задайте шлюзом по умолчанию виртуальный IP-адрес группы HSRP командой **ipconfig 192.168.1.101 255.255.255.0 192.168.1.254**: адрес и маска остаются прежними. Убедитесь с помощью команды **ipconfig**, что шлюз по умолчанию (Default Gateway) — 192.168.1.254.

        ```
        C:\>ipconfig 192.168.1.101 255.255.255.0 192.168.1.254
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.1.101
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.1.254
        ```

        **Примечание.** Те же параметры можно задать в приложении «IP-конфигурация» на вкладке «Рабочий стол».

        **Шаг 3.** Аналогично задайте шлюз по умолчанию компьютера PC-B командой **ipconfig 192.168.1.103 255.255.255.0 192.168.1.254**.

        **Шаг 4.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и в режим глобальной конфигурации командой **configure terminal**. Задайте шлюз по умолчанию командой **ip default-gateway 192.168.1.254** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1>enable
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#ip default-gateway 192.168.1.254
        S1(config)#end
        *Mar  1 00:05:35.343: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Аналогично задайте шлюз по умолчанию 192.168.1.254 на коммутаторе S3.

        **Шаг 6.** В приложении «Командная строка» компьютера PC-A проверьте связь с веб-сервером командой **ping 209.165.200.226**. Веб-сервер отвечает: пакеты, отправленные на виртуальный шлюз, пересылает активный маршрутизатор группы.

        ```
        C:\>ping 209.165.200.226

        Pinging 209.165.200.226 with 32 bytes of data:

        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125

        Ping statistics for 209.165.200.226:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 7.** Аналогично проверьте связь с веб-сервером с компьютера PC-B командой **ping 209.165.200.226**.

        ```
        C:\>ping 209.165.200.226

        Pinging 209.165.200.226 with 32 bytes of data:

        Reply from 209.165.200.226: bytes=32 time=3ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125
        Reply from 209.165.200.226: bytes=32 time=2ms TTL=125

        Ping statistics for 209.165.200.226:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 3ms, Average = 2ms
        ```

        **Шаг 8.** Ответьте на вопрос 8 в форме ответов.
    - title: "Проверка работы протокола HSRP"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC-B выполните трассировку маршрута до веб-сервера командой **tracert 209.165.200.226**. Сравните путь с трассировкой с этого компьютера до настройки протокола HSRP (страница «Проверка путей к веб-серверу», шаг 3).

        ```
        C:\>tracert 209.165.200.226

        Tracing route to 209.165.200.226 over a maximum of 30 hops:

          1     1 ms     1 ms     1 ms  192.168.1.1
          2     1 ms     1 ms     1 ms  10.1.1.2
          3     2 ms     2 ms     2 ms  10.100.100.2
          4     2 ms     2 ms     2 ms  209.165.200.226

        Trace complete.
        ```

        **Шаг 2.** Ответьте на вопрос 9 в форме ответов.

        **Шаг 3.** Удалите соединение между маршрутизатором R1 и коммутатором S1: щелкните правой кнопкой мыши кабель между R1 и S1 на схеме и выберите «Удалить соединение».

        **Шаг 4.** Сразу после этого снова выполните трассировку на компьютере PC-B командой **tracert 209.165.200.226** и наблюдайте за выводом, пока команда не завершится. Первые пакеты первого перехода остаются без ответа, а затем путь проходит через маршрутизатор R3 (192.168.1.3). Если трассировка не завершилась, повторите ее.

        ```
        C:\>tracert 209.165.200.226

        Tracing route to 209.165.200.226 over a maximum of 30 hops:

          1     *        *       <1 ms  192.168.1.3
          2     *        1 ms     1 ms  10.1.1.2
          3     1 ms     1 ms     1 ms  10.100.100.2
          4     2 ms     2 ms     2 ms  209.165.200.226

        Trace complete.
        ```

        **Примечание.** Маршрутизатор R3 не знает, почему пакеты приветствия от R1 перестали приходить: он ждет время удержания, 10 секунд, и только затем становится активным. В это время пакеты, отправленные на виртуальный шлюз, никто не пересылает. Став активным, R3 рассылает объявление ARP (gratuitous ARP) от виртуального IP-адреса, и коммутаторы узнают, за каким портом теперь находится виртуальный MAC-адрес. Компьютер PC-B не перенастраивается: его шлюз по умолчанию прежний.

        **Шаг 5.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 6.** Перейдите в консоль маршрутизатора R3: в ней уже есть сообщение о переходе в состояние Active («Standby -> Active»). Выведите сводку командой **show standby brief**. Маршрутизатор R3 активный, а резервного маршрутизатора в группе нет (unknown).

        ```
        *Mar  1 00:06:26.548: %HSRP-5-STATECHANGE: GigabitEthernet0/0 Grp 1 state Standby -> Active
        R3#show standby brief
                             P indicates configured to preempt.
                             |
        Interface   Grp  Pri P State   Active          Standby         Virtual IP
        Gi0/0       1    100   Active  local           unknown         192.168.1.254
        ```

        **Шаг 7.** Восстановите соединение: наведите указатель на коммутатор S1, нажмите «Соединить» над ним и щелкните маршрутизатор R1. В окне выбора кабеля оставьте тип «Медный прямой», в поле «Порт S1» выберите порт G0/1, убедитесь, что в поле «Порт R1» выбран порт G0/1, и нажмите «Соединить».

        **Шаг 8.** Перейдите в консоль маршрутизатора R1 и следите за сообщениями. Интерфейс G0/1 включается, а примерно через 10 секунд маршрутизатор R1 становится активным (сообщения «Speak -> Standby» и «Standby -> Active»).

        ```
        *Mar  1 00:06:49.628: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        R1#
        *Mar  1 00:06:50.628: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        R1#
        *Mar  1 00:07:00.748: %HSRP-5-STATECHANGE: GigabitEthernet0/1 Grp 1 state Speak -> Standby
        R1#
        *Mar  1 00:07:00.748: %HSRP-5-STATECHANGE: GigabitEthernet0/1 Grp 1 state Standby -> Active
        ```

        **Шаг 9.** Перейдите в консоль маршрутизатора R3. Примерно через 30 секунд после подключения кабеля в ней появляется сообщение «Active -> Speak»: R3 уступает роль активного маршрутизатора, а еще через 10 секунд становится резервным («Speak -> Standby»).

        ```
        *Mar  1 00:07:20.688: %HSRP-5-STATECHANGE: GigabitEthernet0/0 Grp 1 state Active -> Speak
        R3#
        *Mar  1 00:07:30.748: %HSRP-5-STATECHANGE: GigabitEthernet0/0 Grp 1 state Speak -> Standby
        ```

        **Примечание.** Около 30 секунд порт G0/1 коммутатора S1 проходит состояния протокола STP и не передает кадры, поэтому пакеты приветствия маршрутизаторов R1 и R3 друг до друга не доходят. Маршрутизатор R1 не получает пакетов приветствия от активного маршрутизатора и через время удержания сам становится активным, так что около 20 секунд в группе два активных маршрутизатора. Когда порт начинает передавать кадры, маршрутизаторы получают пакеты приветствия друг друга, и роль активного сохраняет маршрутизатор с более высоким приоритетом, R1, а R3 переходит в состояние Speak, а затем Standby.

        **Шаг 10.** Когда маршрутизатор R3 станет резервным, выполните трассировку на компьютере PC-B командой **tracert 209.165.200.226**.

        ```
        C:\>tracert 209.165.200.226

        Tracing route to 209.165.200.226 over a maximum of 30 hops:

          1     1 ms     1 ms     1 ms  192.168.1.1
          2     1 ms     1 ms     1 ms  10.1.1.2
          3     2 ms     2 ms     2 ms  10.100.100.2
          4     2 ms     2 ms     2 ms  209.165.200.226

        Trace complete.
        ```

        **Шаг 11.** Ответьте на вопрос 11 в форме ответов.

        **Шаг 12.** В консоли маршрутизатора R1 выведите сводку командой **show standby brief**. Маршрутизатор R1 снова активный, а R3 — резервный (192.168.1.3).

        ```
        R1#show standby brief
                             P indicates configured to preempt.
                             |
        Interface   Grp  Pri P State   Active          Standby         Virtual IP
        Gi0/1       1    150 P Active  local           192.168.1.3     192.168.1.254
        ```

        **Шаг 13.** Сравните, как маршрутизатор R1 вернул себе роль активного, с тем, в каких случаях действует вытеснение (страница «Настройка протокола HSRP», примечание к шагу 5). Ответьте на вопрос 12 в форме ответов.
