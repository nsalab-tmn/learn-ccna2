    - title: "Начальное состояние"
      body: |
        - Домашний маршрутизатор Home-Wireless-Router работает с заводскими настройками: адрес 192.168.0.1 с маской 255.255.255.0 в локальной сети, DHCP-сервер, веб-интерфейс с именем admin и паролем admin; его сеть 2,4 ГГц «Default» скрыта и не защищена, а порт Internet настроен на адрес, через который выхода нет. Компьютер Home-Admin подключен к нему кабелем и получил адрес по DHCP. Ноутбук Laptop, планшет Tablet-PC и смартфон Smartphone в зоне покрытия маршрутизатора, но ни к одной сети не подключены.
        - Маршрутизатор Internet выдает домашнему маршрутизатору адрес порта Internet по DHCP и соединяет обе сети с серверами DNS-Server (имя www.nsalab.local) и Web-Server (203.0.113.78).
        - В сети предприятия маршрутизатор R1 — шлюз сетей VLAN 2, 5 и 100 с DHCP-пулами для сетей 192.168.2.0/24 и 192.168.5.0/24; коммутатор SW1 настроен; сервер RADIUS-Server знает контроллер (общий ключ RadiusPW) и учетную запись userWLAN5.
        - У контроллера WLC-1 настроен только интерфейс управления, и его собственный адрес — основной DHCP-сервер этого интерфейса; интерфейсов для сетей WLAN, областей DHCP, серверов и сетей WLAN нет. Точка доступа LAP-1 ждет адреса по DHCP и к контроллеру не присоединена. Ноутбуки Wireless-Host-1 и Wireless-Host-2 ни к одной сети не подключены.

        В начальном состоянии компьютер Home-Admin имеет адрес из заводской сети домашнего маршрутизатора (**ipconfig** в приложении «Командная строка»):

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:25FF:FE4C:A801
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.0.100
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.0.1
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды и действия для их выполнения вы выбираете сами.
    - title: "Домашний беспроводной маршрутизатор"
      body: |
        **Требование 1.** Адрес домашнего маршрутизатора в локальной сети — 192.168.6.1 с маской 255.255.255.224.

        **Требование 2.** DHCP-сервер домашнего маршрутизатора раздает адреса начиная с третьего адреса сети (192.168.6.3), не больше 20 адресов, и сообщает узлам DNS-сервер 10.100.100.252.

        **Требование 3.** Порт Internet домашнего маршрутизатора получает адрес, маску и шлюз (198.51.100.1) по DHCP от маршрутизатора Internet.

        **Требование 4.** Беспроводная сеть 2,4 ГГц домашнего маршрутизатора называется HomeSSID, работает на канале 6, и ее имя передается в эфир, так что домашние устройства видят его в списке сетей.

        **Требование 5.** Сеть HomeSSID защищена по WPA2-PSK с ключом Cisco123.

        **Требование 6.** Пароль веб-интерфейса домашнего маршрутизатора изменен с заводского на Cisco123.

        **Примечание.** После смены адреса локальной сети браузер компьютера Home-Admin теряет маршрутизатор: компьютер получает новую аренду по DHCP, и веб-интерфейс открывается по новому адресу.
    - title: "Подключение домашних устройств"
      body: |
        **Требование 7.** Ноутбук Laptop, планшет Tablet-PC и смартфон Smartphone подключены к сети HomeSSID и получают адреса от DHCP-сервера домашнего маршрутизатора.
    - title: "Контроллер WLC-1: интерфейсы, область DHCP и серверы"
      body: |
        **Требование 8.** На контроллере WLC-1 созданы интерфейсы WLAN 2 и WLAN 5 по таблице: интерфейс WLAN 2 — VLAN 2, порт 1, адрес 192.168.2.254 с маской 255.255.255.0, шлюз и основной DHCP-сервер 192.168.2.1; интерфейс WLAN 5 — VLAN 5, порт 1, адрес 192.168.5.254 с маской 255.255.255.0, шлюз и основной DHCP-сервер 192.168.5.1. Оба интерфейса в работе (up).

        **Требование 9.** Создана и включена область DHCP с именем management: адреса с 192.168.100.235 по 192.168.100.245, сеть 192.168.100.0 с маской 255.255.255.0, шлюз 192.168.100.1.

        **Требование 10.** Задан сервер RADIUS с индексом 1: адрес 10.6.0.254, общий ключ RadiusPW.

        **Требование 11.** Задан получатель SNMP-трапов: сообщество WLAN, адрес 10.6.0.254; получатель включен.

        **Примечание.** Область DHCP сети управления нужна точке доступа LAP-1: получив из нее адрес, точка доступа присоединяется к контроллеру сама и появляется в разделе «Access points».
    - title: "Сети WLAN контроллера"
      body: |
        **Требование 12.** На контроллере создана сеть WLAN с идентификатором 2, именем профиля Wireless VLAN 2 и SSID SSID-2: она включена, привязана к интерфейсу WLAN 2, защищена по WPA2 Personal (PSK) с ключом Cisco123, а локальная коммутация и локальная аутентификация FlexConnect включены.

        **Требование 13.** Создана сеть WLAN с идентификатором 5, именем профиля Wireless VLAN 5 и SSID SSID-5: она включена, привязана к интерфейсу WLAN 5, защищена по WPA2 Enterprise (802.1X) с сервером RADIUS 10.6.0.254 (индекс 1), а локальная коммутация и локальная аутентификация FlexConnect включены.
    - title: "Беспроводные узлы предприятия"
      body: |
        **Требование 14.** Ноутбук Wireless-Host-1 подключен к сети SSID-2 с ключом Cisco123.

        **Требование 15.** Ноутбук Wireless-Host-2 подключен к сети SSID-5 под учетной записью userWLAN5 с паролем userW5pass.
    - title: "Проверка"
      body: |
        Когда все требования выполнены, проверьте результат. Первые эхо-запросы каждой проверки могут остаться без ответа: в это время устройства определяют MAC-адреса друг друга по протоколу ARP.

        **Шаг 1.** В приложении «Веб-браузер» каждого из пяти беспроводных узлов — Laptop, Tablet-PC, Smartphone, Wireless-Host-1 и Wireless-Host-2 — открываются страницы www.nsalab.local и 203.0.113.78.

        **Шаг 2.** Компьютер Home-Admin получил адрес из новой сети (**ipconfig /all** в приложении «Командная строка»): 192.168.6.3 с маской 255.255.255.224, шлюз и DHCP-сервер 192.168.6.1, DNS-сервер 10.100.100.252.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Physical Address................: 00-D0-25-4C-A8-01
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:25FF:FE4C:A801
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.6.3
           Subnet Mask.....................: 255.255.255.224
           Default Gateway.................: 192.168.6.1
           DHCP Servers....................: 192.168.6.1
           DNS Servers.....................: 10.100.100.252
        ```

        **Шаг 3.** Ноутбук Laptop подключен к сети HomeSSID и получил адрес 192.168.6.4 (**ipconfig**); он получает ответы от веб-сервера по имени (**ping www.nsalab.local**) и от планшета Tablet-PC (**ping 192.168.6.6**).

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:33FF:FE70:1D01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.6.4
           Subnet Mask.....................: 255.255.255.224
           Default Gateway.................: 192.168.6.1
        ```

        ```
