        | Контроллер WLC-1 | https://192.168.200.254 в браузере компьютера Admin-PC (предупреждение о сертификате — так и должно быть), имя admin, пароль Cisco123 |
        | DNS-сервер для узлов обеих сетей | 10.100.100.254 (DNS-Server) |
    - title: "Начальное состояние"
      body: |
        - Домашняя сеть и сеть предприятия выходят к веб-серверу www.nsalab.local (203.0.113.78) через маршрутизатор Router0 поставщика услуг, который выдает домашнему маршрутизатору адрес порта Internet по DHCP; имя сайта разрешает сервер DNS-Server (10.100.100.254). Связь между домашней сетью и сетью предприятия не нужна.
        - Домашний маршрутизатор Home-Wireless-Router раздает сеть HomeSSID (WPA2-Personal, ключ Cisco123) и адреса в сети 192.168.0.0/24. Адаптеры ноутбука Laptop, планшета Tablet-PC и смартфона Smartphone настроены на эту сеть.
        - В сети предприятия маршрутизатор R1 — шлюз сетей VLAN 10, 20 и 200 с DHCP-пулами для сетей 192.168.10.0/24 и 192.168.20.0/24; коммутатор SW1 настроен. Контроллер WLC-1 с присоединенной точкой доступа LAP-1 раздает сети «Wireless VLAN 10» (SSID-10) и «Wireless VLAN 20» (SSID-20); сервер RADIUS-Server знает контроллер и учетную запись user2. Адаптер ноутбука Laptop1 настроен на SSID-10, ноутбука Laptop-2 — на SSID-20.
        - В настройках домашнего маршрутизатора, контроллера и беспроводных узлов есть неполадки. Сколько их и где — вам предстоит выяснить; маршрутизаторы, коммутатор и серверы исправны, и настраивать их не нужно.

        В начальном состоянии ни один беспроводной узел не открывает сайт: в приложении «Веб-браузер» каждого из них страница www.nsalab.local не открывается, а по адресу 203.0.113.78 не открывается у домашних узлов. Узел, который не подключен к своей сети, объясняет причину на вкладке «Состояние» приложения «Беспроводная сеть». Эхо-запросы ноутбука Laptop к веб-серверу (**ping 203.0.113.78** в приложении «Командная строка») остаются без ответа:

        ```
        C:\>ping 203.0.113.78

        Pinging 203.0.113.78 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 203.0.113.78:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а как найти и устранить неполадки, вы решаете сами.
    - title: "Домашняя беспроводная сеть"
      body: |
        **Требование 1.** Порт Internet домашнего маршрутизатора Home-Wireless-Router получает адрес, маску, шлюз и DNS-сервер по DHCP от маршрутизатора Router0.

        **Требование 2.** DHCP-сервер домашнего маршрутизатора сообщает узлам DNS-сервер 10.100.100.254.

        **Требование 3.** Планшет Tablet-PC получает адрес по DHCP от домашнего маршрутизатора.

        **Требование 4.** Ноутбук Laptop, планшет Tablet-PC и смартфон Smartphone подключены к сети HomeSSID и открывают сайт www.nsalab.local по имени и по адресу 203.0.113.78.

        **Примечание.** Узел, который получил аренду до исправления настроек DHCP-сервера, хранит старые параметры до ее обновления: команда ipconfig /renew в приложении «Командная строка» запрашивает их заново.
    - title: "Беспроводная сеть предприятия"
      body: |
        **Требование 5.** Сеть WLAN «Wireless VLAN 10» (SSID-10) контроллера WLC-1 защищена по WPA2-Personal (PSK) с ключом Cisco123.

        **Требование 6.** Сеть WLAN «Wireless VLAN 20» (SSID-20) включена.

        **Требование 7.** Ноутбук Laptop-2 подключен к сети SSID-20 под учетной записью user2 с паролем user2Pass.

        **Требование 8.** Ноутбуки Laptop1 и Laptop-2 открывают сайт www.nsalab.local по имени и по адресу 203.0.113.78.

        **Примечание.** Адаптер, настроенный на сеть, подключается к ней сам, как только сеть снова ему подходит; вкладка «Состояние» обновляется без действий с вашей стороны. Кнопка «Забыть сеть» на этой вкладке снимает настройку адаптера, после чего сеть выбирают заново на вкладке «Сети».
    - title: "Проверка"
      body: |
        Когда все требования выполнены, проверьте результат.

        **Шаг 1.** В приложении «Веб-браузер» каждого из пяти беспроводных узлов — Laptop, Tablet-PC, Smartphone, Laptop1 и Laptop-2 — открываются страницы www.nsalab.local и 203.0.113.78.

        **Шаг 2.** Планшет Tablet-PC получил адрес по DHCP (**ipconfig /all** в приложении «Командная строка»): «DHCP Enabled» — Yes, адрес из сети 192.168.0.0/24, DHCP-сервер 192.168.0.1 и DNS-сервер 10.100.100.254.

        ```
        C:\>ipconfig /all

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Physical Address................: 00-D0-19-DB-41-01
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:19FF:FEDB:4101
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.0.102
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.0.1
           DHCP Servers....................: 192.168.0.1
           DNS Servers.....................: 10.100.100.254
        ```

        **Шаг 3.** Ноутбук Laptop получает ответы от веб-сервера (**ping 203.0.113.78**): первые эхо-запросы могут остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 203.0.113.78

        Pinging 203.0.113.78 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 203.0.113.78: bytes=32 time=1ms TTL=126
        Reply from 203.0.113.78: bytes=32 time=1ms TTL=126

        Ping statistics for 203.0.113.78:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 4.** Ноутбук Laptop1 подключен к сети SSID-10 и получил адрес из сети 192.168.10.0/24 (**ipconfig**).

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:7DFF:FE97:1401
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.10.101
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.10.1
        ```

        **Шаг 5.** Ноутбук Laptop-2 подключен к сети SSID-20 под учетной записью user2, получил адрес из сети 192.168.20.0/24 (**ipconfig**) и получает ответы от веб-сервера по имени (**ping www.nsalab.local**).

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:F7FF:FEDE:B901
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.20.101
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.20.1
        ```

        ```
        C:\>ping www.nsalab.local

        Pinging 203.0.113.78 with 32 bytes of data:

        Reply from 203.0.113.78: bytes=32 time=2ms TTL=126
        Reply from 203.0.113.78: bytes=32 time=2ms TTL=126
        Reply from 203.0.113.78: bytes=32 time=2ms TTL=126
        Reply from 203.0.113.78: bytes=32 time=2ms TTL=126

        Ping statistics for 203.0.113.78:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 6.** На странице «Dashboard» контроллера WLC-1 два клиента, а в разделе «WLANs» обе сети включены.
