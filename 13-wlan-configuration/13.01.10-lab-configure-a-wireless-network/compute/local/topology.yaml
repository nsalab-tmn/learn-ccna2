scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | ISP | G0/0 | WR | Internet |
        | Медный | ISP | G0/1 | WebServer | F0 |
        | Медный прямой (подключаете вы) | Admin | F0 | WR | Ethernet 1 |
        | Медный прямой (подключаете вы) | AP | Port 0 | WR | Ethernet 2 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | ISP | G0/0 | 209.165.200.226 | 255.255.255.252 | — |
        | ISP | G0/1 | 209.165.201.254 | 255.255.255.0 | — |
        | WebServer | NIC | 209.165.201.1 | 255.255.255.0 | 209.165.201.254 |
        | WR | Internet | 209.165.200.225 | 255.255.255.252 | 209.165.200.226 |
        | WR | LAN (порты Ethernet и беспроводная сеть) | 192.168.0.1, затем 192.168.50.1 | 255.255.255.0 | — |
        | AP | — | мост между беспроводной сетью и портом Port 0 | — | — |
        | Admin, Laptop1, Laptop2, Laptop3 | NIC | по DHCP от WR | по DHCP | по DHCP |

        Сервер WebServer — это и веб-сервер, и DNS-сервер: он отвечает на имя www.nsalab.local своим адресом 209.165.201.1.

        | Параметр маршрутизатора WR | Значение |
        |---|---|
        | DHCP-сервер | первый адрес .100, 50 адресов; DNS-сервер для клиентов — 209.165.201.1 (задается на последней странице) |
        | DNS-сервер порта Internet | 209.165.201.1 |
        | Беспроводная сеть 2,4 ГГц | SSID aCompany, канал 6; радио 5 ГГц выключены |
        | Защита беспроводной сети | WPA2-PSK (AES), ключ Cisco123! |
        | Пароль веб-интерфейса | admin, затем cisco |

        | Параметр точки доступа AP | Значение |
        |---|---|
        | Беспроводная сеть 2,4 ГГц | SSID aCompany, канал 1 |
        | Защита | WPA2-PSK (AES), ключ Cisco123! |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор WR работает с заводскими настройками: адрес 192.168.0.1 с маской 255.255.255.0 в локальной сети, DHCP-сервер с диапазоном от .100 на 50 адресов, порт Internet запрашивает адрес по DHCP (у поставщика услуг DHCP-сервера нет, поэтому адреса у порта нет), на каждом из трех радио — открытая сеть «Default». Имя пользователя и пароль веб-интерфейса — admin.
        - Точка доступа AP не настроена (ее радио работает на канале 1) и кабелем не подключена.
        - Компьютер Admin кабелем не подключен и адреса не имеет. Ноутбуки Laptop1, Laptop2 и Laptop3 получают адрес по DHCP, но пока ни к одной беспроводной сети не подключены.
        - Маршрутизатор ISP и сервер WebServer настроены: сервер отвечает на имя www.nsalab.local и отдает веб-страницу.

        У компьютера Admin нет IPv4-адреса (**ipconfig** в приложении «Командная строка»):

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:39FF:FEFC:DA01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```
    - title: "Подключение компьютера Admin и настройка порта Internet"
      body: |
        **Шаг 1.** Соедините компьютер Admin с маршрутизатором WR: на панели устройств выберите «Медный прямой», щелкните Admin → FastEthernet0, затем WR → Ethernet 1. Когда индикаторы на обоих концах кабеля станут зелеными, переходите к следующему шагу.

        **Примечание.** Порты Ethernet маршрутизатора WR работают как коммутатор локальной сети, а порт Internet — как маршрутизатор к сети поставщика услуг.

        **Шаг 2.** Щелкните Admin, на вкладке «Рабочий стол» откройте «IP-конфигурация» и выберите «DHCP». Компьютер получает адрес от DHCP-сервера маршрутизатора WR. Откройте «Командная строка» и выведите полные настройки командой **ipconfig /all**: адрес 192.168.0.100 (первый адрес диапазона) с маской 255.255.255.0, шлюз по умолчанию и DHCP-сервер 192.168.0.1, а DNS-сервера пока нет. Ответьте на вопросы 1, 2 и 3 в форме ответов.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Physical Address................: 00-D0-39-FC-DA-01
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:39FF:FEFC:DA01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.0.100
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.0.1
           DHCP Servers....................: 192.168.0.1
           DNS Servers.....................: 0.0.0.0
        ```

        **Шаг 3.** Откройте «Веб-браузер», введите в поле «Адрес» 192.168.0.1 и нажмите «Перейти». В окне «Authorization Required» введите имя admin и пароль admin и нажмите «Log in». Откройте «Network → Interfaces»: у интерфейса LAN нажмите «Edit» и перейдите на вкладку «DHCP Server». Диапазон DHCP задан полями «Start» (192.168.0.100) и «Limit» (50): адреса от 192.168.0.100 до 192.168.0.149. Ответьте на вопрос 4 в форме ответов.

        **Шаг 4.** В «Network → Interfaces» у интерфейса WAN нажмите «Edit», выберите «Protocol: Static address» и введите «IPv4 address» 209.165.200.225, «IPv4 netmask» 255.255.255.252, «IPv4 gateway» 209.165.200.226 и «Use custom DNS servers» 209.165.201.1 (все поля — на открытой вкладке «General Settings»). Нажмите «Save», затем в шапке страницы «Unsaved changes» → «Save & Apply». Маршрутизатор применяет настройки («Applying configuration changes…»), и страница остается открытой.

        **Шаг 5.** В приложении «Командная строка» обновите аренду командой **ipconfig /renew**. Вместе с адресом компьютер теперь получает DNS-сервер 209.165.201.1: маршрутизатор сообщает клиентам DNS-сервер своего порта Internet.

        ```
        C:\>ipconfig /renew

           IP Address......................: 192.168.0.100
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.0.1
           DNS Server......................: 209.165.201.1
        ```

        **Шаг 6.** В приложении «Веб-браузер» откройте www.nsalab.local. Открывается страница сервера с заголовком «Web server»: имя разрешил DNS-сервер 209.165.201.1, а маршрутизатор WR передал запрос через порт Internet.

        **Шаг 7.** В приложении «Командная строка» проверьте связь с сервером по имени командой **ping www.nsalab.local**. Имя разрешается в 209.165.201.1, и сервер отвечает: пакеты проходят через маршрутизаторы WR и ISP (TTL=126). Первые два эхо-запроса остаются без ответа: устройства на пути определяют MAC-адреса.

        ```
        C:\>ping www.nsalab.local

        Pinging 209.165.201.1 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126
        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126

        Ping statistics for 209.165.201.1:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```
    - title: "Настройка беспроводной сети"
      body: |
        **Шаг 1.** В браузере компьютера Admin откройте «Network → Wireless». У сети 2,4 ГГц (radio0) нажмите «Edit», в поле «ESSID» введите aCompany, в «Device Configuration» выберите канал 6 и нажмите «Save». У двух радио 5 ГГц нажмите «Disable». Затем «Save & Apply».

        **Примечание.** Имя сети (SSID) чувствительно к регистру. В этой работе настраивается только сеть 2,4 ГГц, поэтому радио 5 ГГц выключаются.

        **Шаг 2.** Снова у сети 2,4 ГГц нажмите «Edit» и на вкладке «Wireless Security» выберите «Encryption: WPA2-PSK» (шифрование — «Force CCMP (AES)»), в поле «Key» введите Cisco123!. «Save» → «Save & Apply».

        **Шаг 3.** Щелкните Laptop1, на вкладке «Рабочий стол» откройте «Беспроводная сеть» → вкладка «Сети», при необходимости нажмите «Обновить». В списке две сети: «Default» точки доступа AP (канал 1, без защиты) и aCompany маршрутизатора WR (канал 6, WPA2). Выберите aCompany, введите ключ Cisco123! и нажмите «Подключиться». На вкладке «Состояние» показано подключение к WR на канале 6. В приложении «Командная строка» выведите настройки командой **ipconfig**: адаптер Wireless0 получил по DHCP адрес 192.168.0.101.

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:7DFF:FE97:1401
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.0.101
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.0.1
        ```

        **Шаг 4.** В приложении «Веб-браузер» ноутбука Laptop1 откройте www.nsalab.local: страница открывается.

        **Шаг 5.** Так же подключите к сети aCompany ноутбук Laptop2 и проверьте связь с сервером командой **ping www.nsalab.local**. Первые эхо-запросы могут остаться без ответа: в это время устройства на пути определяют MAC-адреса друг друга по протоколу ARP.

        ```
        C:\>ping www.nsalab.local

        Pinging 209.165.201.1 with 32 bytes of data:

        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126
        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126
        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126
        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126

        Ping statistics for 209.165.201.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```
    - title: "Подключение точки доступа"
      body: |
        Точка доступа расширяет зону покрытия беспроводной сети: она подключается к маршрутизатору кабелем и передает кадры беспроводных клиентов в его локальную сеть.

        **Шаг 1.** Соедините порт Port 0 точки доступа AP со свободным портом Ethernet 2 маршрутизатора WR («Медный прямой»). Щелкните AP, откройте вкладку «Настройка» → «Port 1 · беспроводная сеть»: в поле «SSID» введите aCompany, выберите «WPA2-PSK» и введите ключ Cisco123! (шифрование AES) и нажмите «Применить»: настройки точки доступа применяются сразу, отдельного сохранения нет.

        **Шаг 2.** Щелкните Laptop3, откройте «Беспроводная сеть» → «Сети» → «Обновить». В списке две сети aCompany: маршрутизатора WR на канале 6 и точки доступа AP на канале 1. Выберите ту, что на канале 1, введите ключ Cisco123! и нажмите «Подключиться». На вкладке «Состояние» — «AP · 2,4 ГГц · канал 1». В приложении «Командная строка» выведите настройки командой **ipconfig**: адрес 192.168.0.103 выдал DHCP-сервер маршрутизатора WR — точка доступа передает кадры ноутбука в его локальную сеть.

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:5DFF:FEDC:4701
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.0.103
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.0.1
        ```

        **Шаг 3.** В приложении «Веб-браузер» ноутбука Laptop3 откройте www.nsalab.local: страница открывается.

        **Примечание.** Две сети с одним именем и одним ключом образуют для клиентов одну беспроводную сеть: клиент выбирает ту точку, чей сигнал сильнее. Здесь обе точки слышны одинаково, поэтому сеть точки доступа выбирают по каналу.
    - title: "Изменение настроек маршрутизатора WR"
      body: |
        **Шаг 1.** В браузере компьютера Admin откройте «System → Administration» → вкладка «Router Password», введите cisco дважды и нажмите «Save»: пароль меняется сразу. Текущий сеанс сохраняется; при следующем входе имя пользователя — admin, пароль — cisco.

        **Шаг 2.** Откройте «Network → Interfaces» → LAN → «Edit» и измените «IPv4 address» на 192.168.50.1. На вкладке «DHCP Server» проверьте «Start» (192.168.0.100) и «Limit» (50) и в поле «Announced DNS servers» добавьте 209.165.201.1. Нажмите «Save» → «Save & Apply». Браузер теряет маршрутизатор и сообщает его новый адрес: адрес компьютера Admin остался в старой сети 192.168.0.0/24. Ответьте на вопрос 5 в форме ответов.

        **Шаг 3.** В приложении «Командная строка» компьютера Admin обновите аренду командой **ipconfig /renew**. Компьютер получает адрес 192.168.50.100 из нового диапазона, шлюз 192.168.50.1 и DNS-сервер 209.165.201.1. Ответьте на вопрос 6 в форме ответов.

        ```
        C:\>ipconfig /renew

           IP Address......................: 192.168.50.100
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.50.1
           DNS Server......................: 209.165.201.1
        ```

        **Шаг 4.** Аналогично обновите аренду командой **ipconfig /renew** на ноутбуках Laptop1, Laptop2 и Laptop3: они получают адреса 192.168.50.101, 192.168.50.102 и 192.168.50.103.

        **Шаг 5.** В браузере компьютера Admin откройте 192.168.50.1, войдите (admin, пароль cisco) и в «Network → Interfaces» → LAN → «Edit» → «DHCP Server» убедитесь, что диапазон теперь 192.168.50.100–192.168.50.149: он следует за адресом интерфейса.
    - title: "Проверка"
      body: |
        **Шаг 1.** В приложении «Веб-браузер» компьютера Admin и ноутбуков Laptop1, Laptop2 и Laptop3 откройте www.nsalab.local. На всех четырех устройствах открывается страница сервера.

        **Шаг 2.** В приложении «Командная строка» компьютера Admin проверьте связь с сервером командой **ping www.nsalab.local**. Сервер отвечает.

        ```
        C:\>ping www.nsalab.local

        Pinging 209.165.201.1 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126
        Reply from 209.165.201.1: bytes=32 time=1ms TTL=126

        Ping statistics for 209.165.201.1:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** На ноутбуке Laptop3 выведите путь к серверу командой **tracert www.nsalab.local**: пакеты проходят через маршрутизатор WR (192.168.50.1) и маршрутизатор ISP (209.165.200.226) и достигают сервера за три перехода.

        ```
        C:\>tracert www.nsalab.local

        Tracing route to 209.165.201.1 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  192.168.50.1
          2     1 ms     1 ms     1 ms  209.165.200.226
          3     1 ms     1 ms     1 ms  209.165.201.1

        Trace complete.
        ```
