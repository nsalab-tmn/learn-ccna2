      name: FastEthernet0.DHCP client enable
      description: Адрес получается по DHCP
      skills:
      - Ip
      max_mark: 1
      steps:
      - name: 'ipconfig /all: matches (?m)DHCP Enabled[. ]*: Yes\s*$'
        code: check
        type: check
        device: Admin
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: ipconfig /all
            expr: '(?m)DHCP Enabled[. ]*: Yes\s*$'
            match: true
