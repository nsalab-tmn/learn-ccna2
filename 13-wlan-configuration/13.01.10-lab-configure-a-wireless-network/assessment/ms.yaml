Criterions:
- code: AP
  name: AP
  subCriterions:
  - code: AP.WIRELESS
    name: Wireless
    aspects:
    - code: AP.WIRELESS.SSID
      name: SSID
      description: Имя сети (SSID) — aCompany
      skills:
      - Other
      max_mark: 1
      steps:
      - name: 'AP: config.wifinet0.ssid == ''aCompany'''
        code: check
        type: check
        device: Admin
        action_chain:
        - action: validate_web_response
          action_vars:
            name: http://{lab_ip}:7681/api/devices/AP/config
            assert_code: 200
            assert_jmespath:
              path: config.wifinet0.ssid
              value: aCompany
