scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | R-1 | G0/0/1 | SW-1 | G0/1 |
        | Медный | R-1 | G0/0/0 | Server | F0 |
        | Медный | WLC-1 | G1 | SW-1 | F0/1 |
        | Медный | LAP-1 | G0 | SW-1 | F0/2 |
        | Медный | Admin-PC | F0 | SW-1 | F0/3 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | R-1 | G0/0/0 | 172.31.1.1 | 255.255.255.0 | — |
        | R-1 | G0/0/1.5 | 192.168.5.1 | 255.255.255.0 | — |
        | R-1 | G0/0/1.200 | 192.168.200.1 | 255.255.255.0 | — |
        | SW-1 | VLAN 200 | 192.168.200.100 | 255.255.255.0 | 192.168.200.1 |
        | WLC-1 | management | 192.168.200.254 | 255.255.255.0 | 192.168.200.1 |
        | WLC-1 | WLAN-5 | 192.168.5.254 | 255.255.255.0 | 192.168.5.1 |
        | LAP-1 | G0 | по DHCP от контроллера | по DHCP | по DHCP |
        | Server | NIC | 172.31.1.254 | 255.255.255.0 | 172.31.1.1 |
        | Admin-PC | NIC | 192.168.200.200 | 255.255.255.0 | 192.168.200.1 |
        | Wireless-Host | Wireless0 | по DHCP от R-1 | по DHCP | по DHCP |

        | Параметр | Значение |
        |---|---|
        | Веб-интерфейс контроллера | https://192.168.200.254 из браузера компьютера Admin-PC, имя admin, пароль Cisco123 |
        | Сеть WLAN | ID 5, имя профиля Floor 2 Employees, SSID SSID-5, интерфейс WLAN-5 |
        | Защита сети WLAN | WPA2 Personal (PSK), ключ Cisco123 |
        | FlexConnect | локальная коммутация и локальная аутентификация включены |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор R-1 настроен: подинтерфейсы G0/0/1.5 и G0/0/1.200 — шлюзы сетей VLAN 5 и 200, DHCP-пул для сети 192.168.5.0/24 раздает адреса с 192.168.5.101, интерфейс G0/0/0 подключает сервер.
        - Коммутатор SW-1 настроен: магистральные каналы к маршрутизатору, контроллеру и точке доступа (у двух последних собственная VLAN — 200), компьютер Admin-PC в сети VLAN 200.
        - Контроллер WLC-1 настроен администратором: интерфейс управления management, интерфейс WLAN-5 для сети VLAN 5 и область DHCP «Wired Management» (192.168.200.240–249), из которой точка доступа LAP-1 получила адрес и присоединилась к контроллеру. Сетей WLAN на контроллере нет.
        - Ноутбук Wireless-Host получает адрес по DHCP, но ни к одной беспроводной сети не подключен.

        **Шаг 1.** После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях): порты коммутатора начинают пересылать кадры примерно через 30 секунд.

        **Шаг 2.** Откройте окно ноутбука Wireless-Host и в приложении «Командная строка» выведите его настройки командой **ipconfig**. Без беспроводной сети ноутбук не получил адреса по DHCP и назначил себе адрес автонастройки 169.254.216.1.

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:A9FF:FEA4:D801
           IPv6 Address....................: ::
           Autoconfiguration IPv4 Address..: 169.254.216.1
           Subnet Mask.....................: 255.255.0.0
           Default Gateway.................: 0.0.0.0
        ```
    - title: "Мониторинг контроллера"
      body: |
        **Шаг 1.** Откройте окно компьютера Admin-PC, на вкладке «Рабочий стол» запустите приложение «Веб-браузер», введите в поле «Адрес» https://192.168.200.254 и нажмите «Перейти». В адресной строке появляется «⚠ сертификат не подтверждён» — так и должно быть: контроллер использует собственный сертификат. Введите имя admin и пароль Cisco123 и нажмите «Log in».

        **Шаг 2.** Открывается страница «Dashboard». Она показывает число присоединенных точек доступа, клиентов и сетей WLAN, а также интерфейсы контроллера. Ответьте на вопрос 1 в форме ответов.

        **Шаг 3.** Откройте раздел «Access points». В списке — точка доступа LAP-1 в состоянии Joined: ее адрес 192.168.200.240 из области DHCP контроллера, MAC-адрес, группа default и время работы. Ответьте на вопросы 2 и 3 в форме ответов.

        **Примечание.** Точка доступа присоединяется к контроллеру по протоколу CAPWAP, когда у нее есть адрес и она знает адрес контроллера; здесь она в той же сети управления. Клиентов пока нет, а сетей WLAN — тоже: их вы создадите на следующей странице.
    - title: "Создание сети WLAN"
      body: |
        **Шаг 1.** Откройте «WLANs» и нажмите «Add WLAN». На вкладке «General» введите «ID» 5, «Profile name» Floor 2 Employees и «SSID» SSID-5, отметьте «Enabled» и выберите «Interface» — WLAN-5. На вкладке «Advanced» включите «FlexConnect local switching» и «FlexConnect local auth». Нажмите «Apply».

        **Примечание.** Идентификатор WLAN — произвольная метка; здесь он совпадает с номером VLAN и с SSID, чтобы топологию было легче читать. Клиенты присоединяются к сети по SSID. Интерфейс WLAN-5 задает сеть VLAN, в которой окажутся клиенты, а FlexConnect позволяет точке доступа коммутировать их кадры локально и проверять их саму. Сеть WLAN, которую забыли включить, не раздается — это частая ошибка.

        **Шаг 2.** Откройте созданную сеть WLAN (ID 5) и на вкладке «Security» выберите «Layer 2 security» — «WPA2 Personal (PSK)», в поле «Pre-shared key» введите Cisco123 и нажмите «Apply».

        **Примечание.** Повторно использовать пароли при настройке защиты не рекомендуется; здесь это сделано только для простоты.

        **Шаг 3.** Вернитесь на страницу «WLANs»: в списке появилась строка сети с ID 5, именем профиля Floor 2 Employees, SSID SSID-5, состоянием Enabled, интерфейсом WLAN-5 и защитой WPA2 Personal (PSK). Ответьте на вопрос 4 в форме ответов. Щелчок по идентификатору открывает сеть для проверки и изменения настроек.
    - title: "Подключение узла и проверка связи"
      body: |
        **Шаг 1.** Откройте окно ноутбука Wireless-Host, на вкладке «Рабочий стол» запустите приложение «Беспроводная сеть» и откройте вкладку «Сети»; при необходимости нажмите «Обновить». В списке появилась сеть SSID-5, которую раздает точка доступа LAP-1. Выберите ее, введите ключ Cisco123 и нажмите «Подключиться».

        **Шаг 2.** Откройте вкладку «Состояние» (кнопка «Подробнее»): ноутбук подключен к сети SSID-5 через точку доступа LAP-1. В приложении «Командная строка» выведите настройки командой **ipconfig**: адаптер Wireless0 получил от DHCP-сервера маршрутизатора R-1 адрес 192.168.5.101 в сети VLAN 5 со шлюзом 192.168.5.1.

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:A9FF:FEA4:D801
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.5.101
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.5.1
        ```

        **Шаг 3.** Проверьте связь со шлюзом по умолчанию сети WLAN командой **ping 192.168.5.1**. Маршрутизатор R-1 отвечает.

        ```
        C:\>ping 192.168.5.1

        Pinging 192.168.5.1 with 32 bytes of data:

        Reply from 192.168.5.1: bytes=32 time=2ms TTL=255
        Reply from 192.168.5.1: bytes=32 time=1ms TTL=255
        Reply from 192.168.5.1: bytes=32 time=1ms TTL=255
        Reply from 192.168.5.1: bytes=32 time=1ms TTL=255

        Ping statistics for 192.168.5.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 4.** Проверьте связь с сервером командой **ping 172.31.1.254**. Сервер отвечает: ноутбук полностью подключен к сети. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 172.31.1.254

        Pinging 172.31.1.254 with 32 bytes of data:

        Request timed out.
        Reply from 172.31.1.254: bytes=32 time=1ms TTL=127
        Reply from 172.31.1.254: bytes=32 time=1ms TTL=127
        Reply from 172.31.1.254: bytes=32 time=1ms TTL=127

        Ping statistics for 172.31.1.254:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```
