name: 13.2.7 Configure a Basic WLAN on the WLC
devices:
- name: R-1
  type: router
  model: NR02
  simulated: true
  position:
    x: 300
    y: 60
  hostname: R-1
  canvas_console: false
  config: |-
    hostname R-1
    ip dhcp excluded-address 192.168.5.1 192.168.5.100
    ip dhcp pool WLAN5
     network 192.168.5.0 255.255.255.0
     default-router 192.168.5.1
    interface GigabitEthernet0/0/1
     no shutdown
    interface GigabitEthernet0/0/1.5
     encapsulation dot1Q 5
     ip address 192.168.5.1 255.255.255.0
    interface GigabitEthernet0/0/1.200
     encapsulation dot1Q 200
     ip address 192.168.200.1 255.255.255.0
    interface GigabitEthernet0/0/0
     ip address 172.31.1.1 255.255.255.0
     no shutdown
- name: Server
  type: server
  model: NSV
  simulated: true
  position:
    x: 80
    y: 60
  config: ipconfig 172.31.1.254 255.255.255.0 172.31.1.1
- name: SW-1
  type: switch
  model: NS01
  simulated: true
  position:
    x: 300
    y: 240
  hostname: SW-1
  canvas_console: false
  config: |-
    hostname SW-1
    vlan 5
    vlan 200
    interface GigabitEthernet0/1
     switchport mode trunk
    interface FastEthernet0/1
     switchport mode trunk
     switchport trunk native vlan 200
    interface FastEthernet0/2
     switchport mode trunk
     switchport trunk native vlan 200
    interface FastEthernet0/3
     switchport mode access
     switchport access vlan 200
    interface Vlan200
     ip address 192.168.200.100 255.255.255.0
     no shutdown
    ip default-gateway 192.168.200.1
