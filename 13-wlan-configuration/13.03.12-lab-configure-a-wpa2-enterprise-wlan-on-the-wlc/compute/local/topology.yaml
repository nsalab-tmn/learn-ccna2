    - title: "Начальное состояние"
      body: |
        - Маршрутизатор R-1 настроен: подинтерфейсы G0/0/0.5 и G0/0/0.200 — шлюзы сетей VLAN 5 и 200, DHCP-пул для сети 192.168.5.0/24 раздает адреса с 192.168.5.101, интерфейс G0/0/1 подключает сервер RADIUS-Server.
        - Коммутатор SW-1 настроен: магистральные каналы к маршрутизатору, контроллеру и точке доступа (у двух последних собственная VLAN — 200), компьютер Admin-PC в сети VLAN 200.
        - У контроллера WLC-1 настроен только интерфейс управления management, без основного DHCP-сервера; областей DHCP, сетей WLAN и серверов RADIUS нет. Точка доступа LAP-1 ждет адреса по DHCP и к контроллеру не присоединена.
        - Сервер RADIUS-Server знает контроллер (общий ключ Wlanpa55) и учетную запись user1 с паролем User1Pass.
        - Ноутбук Wireless-Host получает адрес по DHCP, но ни к одной беспроводной сети не подключен.

        **Шаг 1.** После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях).

        **Шаг 2.** Откройте окно ноутбука Wireless-Host и в приложении «Командная строка» выведите его настройки командой **ipconfig**. Без беспроводной сети ноутбук назначил себе адрес автонастройки 169.254.216.1.

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:A9FF:FEA4:D801
           IPv6 Address....................: ::
           Autoconfiguration IPv4 Address..: 169.254.216.1
           Subnet Mask.....................: 255.255.0.0
           Default Gateway.................: 0.0.0.0
        ```

        **Шаг 3.** Откройте окно компьютера Admin-PC, в приложении «Веб-браузер» введите в поле «Адрес» https://192.168.200.254 и нажмите «Перейти» (предупреждение «⚠ сертификат не подтверждён» в адресной строке — так и должно быть). Введите имя admin и пароль Wlanpa55 и нажмите «Log in». На странице «Dashboard» присоединенных точек доступа нет.
    - title: "Создание интерфейса и подключение сервера RADIUS"
      body: |
        Каждой сети WLAN нужен свой динамический интерфейс на контроллере: ему назначают номер VLAN, и кадры клиентов этой сети несут тег этой VLAN — поэтому каналы между точкой доступа, контроллером и маршрутизатором магистральные.

        **Шаг 1.** В браузере компьютера Admin-PC откройте «Controller → Interfaces»: в списке только интерфейс management, к которому вы подключены. Нажмите «Add interface» и введите «Interface name» WLAN-5, «VLAN ID» 5, «Port number» 1, «IP address» 192.168.5.254, «Netmask» 255.255.255.0, «Gateway» 192.168.5.1 и «Primary DHCP server» 192.168.5.1. Нажмите «Apply», затем «Save configuration» вверху страницы.

        **Примечание.** Несколько интерфейсов могут использовать один физический порт: он работает как магистральный. Шлюз — адрес подинтерфейса маршрутизатора R-1 в сети 192.168.5.0/24, а основной DHCP-сервер — адрес, которому контроллер пересылает запросы DHCP клиентов этой сети WLAN: DHCP-пул настроен на маршрутизаторе. Сохранение конфигурации («Save configuration») нужно, чтобы настройки пережили перезапуск контроллера.

        **Шаг 2.** Откройте «Security → RADIUS servers» и нажмите «Add server»: «Server index» 1, «Server IP address» 172.31.1.254, «Shared secret» и «Confirm shared secret» — Wlanpa55. Нажмите «Apply».

        **Примечание.** Сервер RADIUS принимает запросы только от известных ему клиентов: общий ключ подтверждает контроллеру право обращаться к учетным записям на сервере. Повторно использовать пароли не рекомендуется; здесь это сделано для простоты.
    - title: "Создание сети WLAN с защитой WPA2 Enterprise"
      body: |
        **Шаг 1.** Откройте «WLANs» и нажмите «Add WLAN». На вкладке «General» введите «ID» 5, «Profile name» Floor 2 Employees и «SSID» SSID-5, отметьте «Enabled» и выберите «Interface» — WLAN-5, созданный на предыдущей странице. На вкладке «Security» выберите «Layer 2 security» — «WPA2 Enterprise (802.1X)», а в поле «RADIUS server» — 172.31.1.254, сервер с предыдущей страницы. На вкладке «Advanced» включите «FlexConnect local switching» и «FlexConnect local auth». Нажмите «Apply». Теперь контроллер проверяет пользователей, которые подключаются к сети WLAN, через сервер RADIUS.

        **Примечание.** В поле «RADIUS server» по умолчанию выбрано «None»: сеть WLAN с защитой WPA2 Enterprise без сервера RADIUS контроллер отклоняет, поэтому сервер выбирают до нажатия «Apply». Сеть WLAN, которую забыли включить, не раздается — это частая ошибка.
    - title: "Область DHCP и получатель SNMP-трапов"
      body: |
        Контроллер предлагает собственный внутренний DHCP-сервер. Для больших сетей пользователей его не используют, но в небольшой сети он может раздавать адреса облегченным точкам доступа в проводной сети управления. Так точка доступа LAP-1 получит адрес.

        **Шаг 1.** Откройте «Controller → Interfaces». Теперь в списке два интерфейса: management и WLAN-5. Ответьте на вопрос 1 в форме ответов.

        **Шаг 2.** Откройте интерфейс management и запишите его параметры: IP-адрес 192.168.200.254, маска 255.255.255.0, шлюз 192.168.200.1, основной DHCP-сервер не задан. Ответьте на вопросы 2, 3, 4 и 5 в форме ответов. Чтобы контроллер раздавал адреса устройствам сети управления сам, введите в поле «Primary DHCP server» его собственный адрес 192.168.200.254 и нажмите «Apply».

        **Шаг 3.** Откройте «Controller → DHCP scopes» и нажмите «Add DHCP scope»: «Scope name» Wired Management, «Pool start» 192.168.200.240, «Pool end» 192.168.200.249, «Network» 192.168.200.0, «Netmask» 255.255.255.0, «Default router» 192.168.200.1, «Status» Enabled. Нажмите «Apply», затем «Save configuration». Ответьте на вопрос 6 в форме ответов.

        **Шаг 4.** Через несколько секунд точка доступа LAP-1 получает из области адрес 192.168.200.240, присоединяется к контроллеру и появляется в разделе «Access points» в состоянии Joined. Теперь она раздает сеть SSID-5.

        **Шаг 5.** Откройте «Management → SNMP trap receivers» и нажмите «Add trap receiver»: «Community name» WLAN_SNMP, «IP address» 172.31.1.254. Нажмите «Apply».
    - title: "Подключение узла и проверка связи"
      body: |
        **Шаг 1.** Откройте окно ноутбука Wireless-Host, на вкладке «Рабочий стол» запустите приложение «Беспроводная сеть» и откройте вкладку «Профили». Нажмите «Новый профиль»: имя WLC NET, сеть SSID-5, адрес — DHCP, защита WPA2-Enterprise, пользователь user1, пароль User1Pass. Нажмите «Сохранить», выберите профиль WLC NET и нажмите «Подключиться».

        **Шаг 2.** На вкладке «Состояние» показано подключение к сети SSID-5 через точку доступа LAP-1 под учетной записью user1. В приложении «Командная строка» выведите настройки командой **ipconfig**: адаптер Wireless0 получил от DHCP-сервера маршрутизатора R-1 адрес 192.168.5.101 в сети 192.168.5.0/24 со шлюзом 192.168.5.1.

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:A9FF:FEA4:D801
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.5.101
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.5.1
        ```

        **Шаг 3.** Проверьте связь со шлюзом по умолчанию сети WLAN командой **ping 192.168.5.1**. Маршрутизатор R-1 отвечает.

        ```
        C:\>ping 192.168.5.1

        Pinging 192.168.5.1 with 32 bytes of data:

        Reply from 192.168.5.1: bytes=32 time=2ms TTL=255
        Reply from 192.168.5.1: bytes=32 time=1ms TTL=255
        Reply from 192.168.5.1: bytes=32 time=1ms TTL=255
        Reply from 192.168.5.1: bytes=32 time=1ms TTL=255

        Ping statistics for 192.168.5.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 4.** Проверьте связь с коммутатором SW-1 командой **ping 192.168.200.100** и с сервером RADIUS-Server командой **ping 172.31.1.254**. Оба отвечают: ноутбук полностью подключен к сети. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.200.100

        Pinging 192.168.200.100 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=254
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=254
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=254

        Ping statistics for 192.168.200.100:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        ```
        C:\>ping 172.31.1.254

        Pinging 172.31.1.254 with 32 bytes of data:

        Reply from 172.31.1.254: bytes=32 time=1ms TTL=127
        Reply from 172.31.1.254: bytes=32 time=1ms TTL=127
        Reply from 172.31.1.254: bytes=32 time=1ms TTL=127
        Reply from 172.31.1.254: bytes=32 time=1ms TTL=127

        Ping statistics for 172.31.1.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 5.** Ответьте на вопросы 7 и 8 в форме ответов.
