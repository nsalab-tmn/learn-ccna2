scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | DNS-Server | F0 | S2 | F0/1 |
        | Медный | S2 | G0/1 | R2 | G0/0 |
        | Медный | R2 | G0/1 | ISP | G0/0 |
        | Последовательный | R2 | S0/0/0 | R1 | S0/0/0 |
        | Последовательный | R2 | S0/0/1 | R3 | S0/0/1 |
        | Медный | R1 | G0/0 | S1 | G0/1 |
        | Медный | R3 | G0/0 | S3 | G0/1 |
        | Медный | PC1 | F0 | S1 | F0/1 |
        | Медный | PC2 | F0 | S3 | F0/1 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | R1 | G0/0 | 192.168.10.1 | 255.255.255.0 | — |
        | R1 | S0/0/0 | 10.1.1.1 | 255.255.255.252 | — |
        | R2 | G0/0 | 192.168.20.1 | 255.255.255.0 | — |
        | R2 | G0/1 | по DHCP | по DHCP | — |
        | R2 | S0/0/0 | 10.1.1.2 | 255.255.255.252 | — |
        | R2 | S0/0/1 | 10.2.2.2 | 255.255.255.252 | — |
        | R3 | G0/0 | 192.168.30.1 | 255.255.255.0 | — |
        | R3 | S0/0/1 | 10.2.2.1 | 255.255.255.252 | — |
        | ISP | G0/0 | 209.165.200.225 | 255.255.255.224 | — |
        | PC1 | NIC | по DHCP | по DHCP | по DHCP |
        | PC2 | NIC | по DHCP | по DHCP | по DHCP |
        | DNS-Server | NIC | 192.168.20.254 | 255.255.255.0 | 192.168.20.1 |
    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы имена устройств, IP-адреса интерфейсов по таблице адресации и статические маршруты между локальными сетями. Интерфейс G0/1 маршрутизатора R2, подключенный к маршрутизатору ISP, не настроен.
        - DHCP-сервер и ретрансляция DHCP на маршрутизаторах R1, R2 и R3 не настроены.
        - Маршрутизатор ISP изображает сеть интернет-провайдера и уже настроен: он выдает адреса по DHCP из сети 209.165.200.224/27.
        - На сервере DNS-Server заданы IP-адрес, маска подсети и шлюз по умолчанию по таблице адресации.
        - На компьютерах PC1 и PC2 IP-настройки не заданы.
        - На коммутаторах S1, S2 и S3 задано только имя устройства, остальные параметры имеют значения по умолчанию.

        В начальном состоянии у компьютера PC1 нет IPv4-адреса: команда **ipconfig** в приложении «Командная строка» показывает адрес 0.0.0.0.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Настройка DHCP-сервера"
      body: |
        **Требование 1.** На маршрутизаторе R2 из выдачи по DHCP исключены первые десять адресов локальных сетей маршрутизаторов R1 и R3, каждые десять адресов — одним диапазоном: 192.168.10.1–192.168.10.10 и 192.168.30.1–192.168.30.10. Остальные адреса этих сетей доступны для выдачи.

        **Требование 2.** На маршрутизаторе R2 есть пул DHCP с именем R1-LAN для локальной сети маршрутизатора R1: сеть 192.168.10.0 с маской 255.255.255.0, шлюз по умолчанию 192.168.10.1 и DNS-сервер 192.168.20.254. Имя пула чувствительно к регистру, поэтому оно должно совпадать точно.

        **Требование 3.** На маршрутизаторе R2 есть пул DHCP с именем R3-LAN для локальной сети маршрутизатора R3: сеть 192.168.30.0 с маской 255.255.255.0, шлюз по умолчанию 192.168.30.1 и DNS-сервер 192.168.20.254.

        **Примечание.** Исключенные адреса DHCP-сервер никому не выдает: их оставляют для устройств, адреса которых заданы вручную, например для интерфейса маршрутизатора, который служит шлюзом сети. Получив запрос, сервер выбирает пул по сети, из которой пришел запрос, и выдает из него наименьший свободный адрес.
    - title: "Настройка ретрансляции DHCP"
      body: |
        **Требование 4.** Маршрутизатор R1 пересылает DHCP-запросы, которые приходят из его локальной сети на интерфейс G0/0, DHCP-серверу R2 по адресу 10.1.1.2 — адресу интерфейса S0/0/0 маршрутизатора R2.

        **Требование 5.** Маршрутизатор R3 пересылает DHCP-запросы, которые приходят из его локальной сети на интерфейс G0/0, DHCP-серверу R2 по адресу 10.2.2.2 — адресу интерфейса S0/0/1 маршрутизатора R2.

        **Требование 6.** Компьютеры PC1 и PC2 получают IP-настройки по DHCP (в выводе команды ipconfig /all — «DHCP Enabled: Yes»): компьютер PC1 — из пула R1-LAN, компьютер PC2 — из пула R3-LAN.

        **Примечание.** Агент ретрансляции принимает широковещательный запрос клиента на интерфейсе локальной сети и отправляет его серверу одноадресным пакетом, указав в нем адрес этого интерфейса. По этому адресу сервер выбирает пул, а ответ возвращается клиенту через агент ретрансляции.

        **Примечание.** Компьютер, которому не ответил ни один DHCP-сервер, назначает себе адрес из сети 169.254.0.0/16 (APIPA) и сам запрос не повторяет. Если DHCP на компьютере выбран раньше, чем заработали сервер и ретрансляция, адрес нужно запросить заново.
    - title: "Настройка DHCP-клиента"
      body: |
        **Требование 7.** Интерфейс G0/1 маршрутизатора R2, подключенный к маршрутизатору ISP, включен и получает IPv4-адрес по DHCP от маршрутизатора ISP: адрес на этом интерфейсе вручную не задан.
    - title: "Проверка получения адресов и связи"
      body: |
        Когда все требования выполнены, проверьте результат.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 выведите IP-настройки командой **ipconfig /all**. DHCP включен (DHCP Enabled: Yes), и компьютер получил из пула R1-LAN первый адрес после исключенных, 192.168.10.11, маску подсети, шлюз по умолчанию 192.168.10.1 и DNS-сервер 192.168.20.254. Сервер в строке «DHCP Servers» — 10.1.1.2, адрес маршрутизатора R2, которому маршрутизатор R1 переслал запрос.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-84-55-DC-01
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.10.11
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.10.1
           DHCP Servers....................: 10.1.1.2
           DNS Servers.....................: 192.168.20.254
        ```

        **Шаг 2.** Откройте окно компьютера PC2 и аналогично выведите его IP-настройки командой **ipconfig /all**. Компьютер PC2 получил из пула R3-LAN адрес 192.168.30.11, шлюз по умолчанию 192.168.30.1 и тот же DNS-сервер, а сервер в строке «DHCP Servers» — 10.2.2.2.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-22-27-60-01
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:22FF:FE27:6001
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.30.11
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.30.1
           DHCP Servers....................: 10.2.2.2
           DNS Servers.....................: 192.168.20.254
        ```

        **Шаг 3.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC2 командой **ping 192.168.30.11**. Компьютер PC2 отвечает. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.30.11

        Pinging 192.168.30.11 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.11: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.11: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.11: bytes=32 time=2ms TTL=125

        Ping statistics for 192.168.30.11:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC2 проверьте связь с DNS-сервером, адрес которого компьютер получил по DHCP, командой **ping 192.168.20.254**. Сервер DNS-Server отвечает. Как и в шаге 3, первый эхо-запрос может остаться без ответа из-за протокола ARP.

        ```
        C:\>ping 192.168.20.254

        Pinging 192.168.20.254 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.20.254:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 5.** В консоли маршрутизатора R2 выведите выданные адреса командой **show ip dhcp binding**. В таблице две записи аренды, 192.168.10.11 и 192.168.30.11, с типом Automatic. Идентификатор клиента в каждой записи — 01 и MAC-адрес компьютера (строка «Physical Address» в выводе команды ipconfig /all).

        ```
        R2#show ip dhcp binding
        Bindings from all pools not associated with VRF:
        IP address          Client-ID/              Lease expiration        Type
                            Hardware address/
                            User name
        192.168.10.11       0100.d084.55dc.01       Mar 02 1993 12:01 AM    Automatic
        192.168.30.11       0100.d022.2760.01       Mar 02 1993 12:02 AM    Automatic
        ```

        **Шаг 6.** Убедитесь, что интерфейс G0/1 маршрутизатора R2 получил адрес от провайдера, с помощью команды **show ip interface brief**. У интерфейса GigabitEthernet0/1 адрес 209.165.200.226 из сети провайдера, в столбце Method указано DHCP, а интерфейс и протокол находятся в состоянии up.

        ```
        R2#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         192.168.20.1    YES manual up                    up
        GigabitEthernet0/1         209.165.200.226 YES DHCP   up                    up
        Serial0/0/0                10.1.1.2        YES manual up                    up
        Serial0/0/1                10.2.2.2        YES manual up                    up
        ```

        **Шаг 7.** В консоли маршрутизатора R2 проверьте связь с маршрутизатором ISP командой **ping 209.165.200.225**. Маршрутизатор ISP отвечает. Первый эхо-запрос (точка в выводе) может остаться без ответа, пока маршрутизатор R2 определяет MAC-адрес маршрутизатора ISP по протоколу ARP.

        ```
        R2#ping 209.165.200.225
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 209.165.200.225, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```
