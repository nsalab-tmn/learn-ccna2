    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы имена устройств и IP-адреса интерфейсов по таблице адресации. Интерфейс G0/1 маршрутизатора R2 не настроен и выключен.
        - Маршруты между площадками настроены статически: на R1 и R3 задан маршрут по умолчанию через R2, а на R2 — маршруты к сетям 192.168.10.0/24 и 192.168.30.0/24.
        - Маршрутизатор ISP изображает сеть провайдера: его интерфейс G0/0 имеет адрес 209.165.200.225, и он выдает по DHCP адреса из сети 209.165.200.224/27.
        - На сервере DNS-Server заданы IP-адрес, маска подсети и шлюз по умолчанию по таблице адресации.
        - На компьютерах PC1 и PC2 IP-настройки не заданы, а сервера DHCP для их сетей пока нет.
        - На коммутаторах S1, S2 и S3 задано только имя устройства, остальные параметры имеют значения по умолчанию.

        После запуска лабораторной работы дождитесь, когда индикаторы соединений на схеме загорятся зеленым. Индикаторы соединения R2 — ISP остаются красными («Соединение отключено»), потому что интерфейс G0/1 маршрутизатора R2 выключен.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите IP-настройки компьютера командой **ipconfig**. IPv4-адреса у компьютера нет (0.0.0.0): его выдаст сервер DHCP.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        **Шаг 2.** Откройте консоль маршрутизатора R2 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите состояние интерфейсов командой **show ip interface brief**. Интерфейс G0/1 не имеет адреса (unassigned) и выключен (administratively down).

        ```
        R2>enable
        R2#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         192.168.20.1    YES manual up                    up
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                10.1.1.2        YES manual up                    up
        Serial0/0/1                10.2.2.2        YES manual up                    up
        ```
    - title: "Настройка сервера DHCP"
      body: |
        **Шаг 1.** В консоли маршрутизатора R2 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Исключите из выдачи первые десять адресов локальной сети маршрутизатора R1 командой **ip dhcp excluded-address 192.168.10.1 192.168.10.10**. Среди них адрес интерфейса G0/0 маршрутизатора R1, 192.168.10.1, а остальные девять оставлены для устройств со статическими адресами, например серверов и интерфейсов управления.

        **Шаг 3.** Аналогично исключите первые десять адресов локальной сети маршрутизатора R3 командой **ip dhcp excluded-address 192.168.30.1 192.168.30.10**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#ip dhcp excluded-address 192.168.10.1 192.168.10.10
        R2(config)#ip dhcp excluded-address 192.168.30.1 192.168.30.10
        ```

        **Примечание.** Сервер DHCP не выдает исключенные адреса ни одному клиенту. Так адрес, назначенный устройству вручную, не окажется выдан еще и другому узлу: два узла с одним адресом мешают работе друг друга.

        **Шаг 4.** Создайте пул DHCP для локальной сети маршрутизатора R1 командой **ip dhcp pool R1-LAN**. Имя пула чувствительно к регистру, поэтому вводите его точно так, как оно написано. Приглашение меняется на R2(dhcp-config)#.

        **Шаг 5.** Задайте сеть пула командой **network 192.168.10.0 255.255.255.0**, шлюз по умолчанию для клиентов командой **default-router 192.168.10.1** и адрес DNS-сервера командой **dns-server 192.168.20.254**.

        ```
        R2(config)#ip dhcp pool R1-LAN
        R2(dhcp-config)#network 192.168.10.0 255.255.255.0
        R2(dhcp-config)#default-router 192.168.10.1
        R2(dhcp-config)#dns-server 192.168.20.254
        ```

        **Шаг 6.** Аналогично создайте пул R3-LAN для локальной сети маршрутизатора R3: сеть 192.168.30.0 с маской 255.255.255.0, шлюз по умолчанию 192.168.30.1 и DNS-сервер 192.168.20.254. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2(dhcp-config)#ip dhcp pool R3-LAN
        R2(dhcp-config)#network 192.168.30.0 255.255.255.0
        R2(dhcp-config)#default-router 192.168.30.1
        R2(dhcp-config)#dns-server 192.168.20.254
        R2(dhcp-config)#end
        *Mar  1 00:01:22.827: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 7.** Убедитесь, что исключенные адреса и оба пула настроены, с помощью команды **show running-config | section dhcp**.

        ```
        R2#show running-config | section dhcp
        ip dhcp excluded-address 192.168.10.1 192.168.10.10
        ip dhcp excluded-address 192.168.30.1 192.168.30.10
        ip dhcp pool R1-LAN
         network 192.168.10.0 255.255.255.0
         default-router 192.168.10.1 
         dns-server 192.168.20.254 
        ip dhcp pool R3-LAN
         network 192.168.30.0 255.255.255.0
         default-router 192.168.30.1 
         dns-server 192.168.20.254 
        ```

        **Примечание.** Шлюз по умолчанию и DNS-сервер из пула сервер DHCP сообщает клиенту вместе с адресом, поэтому клиенту не нужно задавать их вручную.
    - title: "Настройка агентов ретрансляции DHCP"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Перейдите к настройке интерфейса G0/0, к которому подключена локальная сеть R1, командой **interface g0/0** и задайте адрес сервера DHCP командой **ip helper-address 10.1.1.2**. Это адрес интерфейса S0/0/0 маршрутизатора R2, обращенного к R1. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1>enable
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/0
        R1(config-if)#ip helper-address 10.1.1.2
        R1(config-if)#end
        *Mar  1 00:01:36.886: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Команда ip helper-address делает маршрутизатор агентом ретрансляции DHCP. Широковещательный запрос DHCP, полученный на этом интерфейсе, маршрутизатор пересылает серверу по указанному адресу одноадресным пакетом и добавляет в запрос адрес своего интерфейса, 192.168.10.1. По этому адресу сервер выбирает пул, сеть которого его содержит, — R1-LAN.

        **Шаг 3.** Убедитесь с помощью команды **show running-config interface g0/0**, что в конфигурации интерфейса есть строка ip helper-address 10.1.1.2.

        ```
        R1#show running-config interface g0/0
        Building configuration...

        Current configuration : 127 bytes
        !
        interface GigabitEthernet0/0
         ip address 192.168.10.1 255.255.255.0
         ip helper-address 10.1.1.2
         duplex auto
         speed auto
        end
        ```

        **Шаг 4.** Аналогично откройте консоль маршрутизатора R3, нажмите Enter и на интерфейсе G0/0 задайте адрес сервера DHCP командой **ip helper-address 10.2.2.2**. Это адрес интерфейса S0/0/1 маршрутизатора R2, обращенного к R3.

        ```
        R3>enable
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#interface g0/0
        R3(config-if)#ip helper-address 10.2.2.2
        R3(config-if)#end
        *Mar  1 00:01:50.944: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Настройка клиентов DHCP"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «IP-конфигурация». В разделе IPv4 выберите «DHCP». Через несколько секунд поля «IPv4-адрес», «Маска», «Шлюз по умолчанию» и «DNS-сервер» заполнятся настройками, полученными от сервера DHCP: 192.168.10.11, 255.255.255.0, 192.168.10.1 и 192.168.20.254. Изменить эти поля нельзя: их значения задает сервер DHCP.

        **Шаг 2.** Закройте приложение (✕) и запустите приложение «Командная строка». Убедитесь, что компьютер получил настройки по DHCP, с помощью команды **ipconfig /all**: в строке DHCP Enabled указано Yes, адрес 192.168.10.11 входит в сеть пула R1-LAN, а шлюз по умолчанию и DNS-сервер совпадают с заданными в пуле.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-84-55-DC-01
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.10.11
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.10.1
           DHCP Servers....................: 10.1.1.2
           DNS Servers.....................: 192.168.20.254
        ```

        **Примечание.** Компьютер получил первый свободный адрес пула, 192.168.10.11, потому что адреса с 192.168.10.1 по 192.168.10.10 исключены из выдачи. В строке DHCP Servers указан адрес сервера DHCP, 10.1.1.2: это адрес маршрутизатора R2, которому агент ретрансляции R1 пересылает запросы.

        **Шаг 3.** Аналогично на компьютере PC2 выберите «DHCP» в приложении «IP-конфигурация» и убедитесь с помощью команды **ipconfig /all**, что компьютер получил адрес 192.168.30.11 из пула R3-LAN, шлюз по умолчанию 192.168.30.1 и DNS-сервер 192.168.20.254.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-22-27-60-01
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:22FF:FE27:6001
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.30.11
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.30.1
           DHCP Servers....................: 10.2.2.2
           DNS Servers.....................: 192.168.20.254
        ```
    - title: "Настройка клиента DHCP на маршрутизаторе R2"
      body: |
        **Шаг 1.** В консоли маршрутизатора R2 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/1 командой **interface g0/1**.

        **Шаг 2.** Настройте получение адреса интерфейса по DHCP командой **ip address dhcp** и включите интерфейс командой **no shutdown**. Через несколько секунд после включения интерфейса маршрутизатор сообщает, что получил от сервера DHCP провайдера адрес 209.165.200.226 с маской 255.255.255.224 (%DHCP-6-ADDRESS_ASSIGN). Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#interface g0/1
        R2(config-if)#ip address dhcp
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:02:37.103: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        R2(config-if)#
        *Mar  1 00:02:38.103: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        R2(config-if)#
        *Mar  1 00:02:43.104: %DHCP-6-ADDRESS_ASSIGN: Interface GigabitEthernet0/1 assigned DHCP address 209.165.200.226, mask 255.255.255.224, hostname R2
        R2(config-if)#end
        *Mar  1 00:02:52.167: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Убедитесь, что интерфейс получил адрес, с помощью команды **show ip interface brief**: у интерфейса G0/1 адрес 209.165.200.226, в столбце Method указано DHCP, а состояние — up/up.

        ```
        R2#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         192.168.20.1    YES manual up                    up
        GigabitEthernet0/1         209.165.200.226 YES DHCP   up                    up
        Serial0/0/0                10.1.1.2        YES manual up                    up
        Serial0/0/1                10.2.2.2        YES manual up                    up
        ```

        **Шаг 4.** Выведите маршрут по умолчанию командой **show ip route | include 0.0.0.0/0**. Вместе с адресом сервер DHCP провайдера сообщил шлюз по умолчанию, 209.165.200.225, и маршрутизатор R2 добавил маршрут по умолчанию через него (код S*).

        ```
        R2#show ip route | include 0.0.0.0/0
        S*    0.0.0.0/0 [254/0] via 209.165.200.225
        ```
    - title: "Проверка DHCP и связи"
      body: |
        **Шаг 1.** В консоли маршрутизатора R2 выведите выданные адреса командой **show ip dhcp binding**. Сервер DHCP выдал в аренду два адреса: 192.168.10.11 из пула R1-LAN и 192.168.30.11 из пула R3-LAN. В столбце Client-ID указан идентификатор клиента — 01 (тип сети Ethernet) и MAC-адрес компьютера: 0100.d084.55dc.01 у PC1 с физическим адресом 00-D0-84-55-DC-01. Срок аренды (Lease expiration) — одни сутки.

        ```
        R2#show ip dhcp binding
        Bindings from all pools not associated with VRF:
        IP address          Client-ID/              Lease expiration        Type
                            Hardware address/
                            User name
        192.168.10.11       0100.d084.55dc.01       Mar 02 1993 12:01 AM    Automatic
        192.168.30.11       0100.d022.2760.01       Mar 02 1993 12:02 AM    Automatic
        ```

        **Шаг 2.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC2 командой **ping 192.168.30.11**. PC2 отвечает. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.30.11

        Pinging 192.168.30.11 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.11: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.11: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.11: bytes=32 time=2ms TTL=125

        Ping statistics for 192.168.30.11:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 3.** В приложении «Командная строка» компьютера PC2 проверьте связь с сервером DNS-Server командой **ping 192.168.20.254**. Сервер отвечает: шлюз по умолчанию, полученный по DHCP, ведет компьютер PC2 в другие сети.

        ```
        C:\>ping 192.168.20.254

        Pinging 192.168.20.254 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.20.254:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** В консоли маршрутизатора R2 проверьте связь с маршрутизатором провайдера командой **ping 209.165.200.225**. Маршрутизатор ISP отвечает. Первый из пяти эхо-запросов (точка) может остаться без ответа, пока R2 определяет MAC-адрес ISP по протоколу ARP.

        ```
        R2#ping 209.165.200.225
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 209.165.200.225, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```
