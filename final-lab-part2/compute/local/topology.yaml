    - title: "Начальное состояние"
      body: |
        - Интерфейсы маршрутизатора R-1-A настроены по таблице адресации (IPv4 и IPv6), маршрутов на нем нет.
        - На маршрутизаторе R-B-10 интерфейсы G0/0/0 и G0/0/1 включены, но IPv4-адресов не имеют; у G0/0/1 задан IPv6-адрес по таблице, у S0/1/0 — оба адреса. Из будущего пула DHCP уже исключены адреса 192.168.10.2–192.168.10.9. Маршрутов нет.
        - Маршрутизатор ISP выдает адреса по DHCP в сети 10.1.1.0/24; коммутатор ISP-Switch работает с параметрами по умолчанию. Сервер Server настроен по таблице адресации и принимает запросы RADIUS от контроллера.
        - На коммутаторе Sw-A задано только имя устройства.
        - У компьютера Admin-PC нет IPv4-адреса (он получит его по DHCP) и нет IPv6-адреса.
        - На контроллере WLC-10 настроен только интерфейс управления по таблице адресации; его веб-интерфейс открывается из браузера компьютера Admin-PC по адресу https://192.168.10.254 (предупреждение о сертификате — так и должно быть), имя admin, пароль Cisco123. Точка доступа LAP-10 ждет адреса по DHCP и присоединится к контроллеру, когда появится пул на маршрутизаторе R-B-10. Ноутбук LT-1 получает адрес по DHCP и пока ни к одной сети не подключен.

        В начальном состоянии у компьютера Admin-PC нет адреса (**ipconfig** в приложении «Командная строка»), и эхо-запросы к серверу он отправить не может:

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:D3FF:FEDC:2825
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        ```
        C:\>ping 172.16.1.100

        Pinging 172.16.1.100 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 172.16.1.100:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        У маршрутизатора R-B-10 интерфейсы Ethernet включены, но без адресов (**show ip interface brief** в консоли):

        ```
        R-B-10>enable
        R-B-10#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       unassigned      YES unset  up                    up
        GigabitEthernet0/0/1       unassigned      YES unset  up                    up
        Serial0/1/0                10.2.2.2        YES manual up                    up
        Serial0/1/1                unassigned      YES unset  administratively down down
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Защита коммутатора Sw-A"
      body: |
        **Требование 1.** На коммутаторе Sw-A созданы сети VLAN 10 с именем Users и 999 с именем BlackHole.

        **Требование 2.** Активные порты F0/1–F0/5 — статические порты доступа в сети VLAN 10.

        **Требование 3.** На портах F0/1–F0/5 включена защита портов: не больше 2 MAC-адресов на порт, адреса запоминаются как sticky, при нарушении порт отбрасывает кадры нарушителя, оставаясь в работе (режим restrict), время устаревания адресов — 10 минут.

        **Требование 4.** На порту F0/1 статически задан защищенный MAC-адрес 00D0.D3DC.2825 компьютера Admin-PC.

        **Требование 5.** На портах F0/1–F0/5 включены PortFast и защита BPDU guard.

        **Требование 6.** Неиспользуемые порты F0/6–F0/24 и G0/2 — статические порты доступа в сети VLAN 999, и все они административно выключены.

        **Требование 7.** На коммутаторе включено отслеживание DHCP (DHCP snooping) для сетей VLAN 10 и 999, а порт G0/1, ведущий к маршрутизатору R-B-10, — доверенный для DHCP.

        **Требование 8.** На коммутаторе включена динамическая проверка ARP (DAI) для сетей VLAN 10 и 999, а порт G0/1 — доверенный для ARP.

        **Требование 9.** Порт F0/2, к которому подключен контроллер WLC-10, — доверенный и для DHCP, и для ARP: адрес контроллера статический, записи в таблице привязок DHCP у него нет, и без доверия коммутатор отбрасывал бы его ответы ARP.

        **Требование 10.** Порт G0/1 работает в режиме магистрального канала к маршрутизатору R-B-10.

        **Примечание.** Отслеживание DHCP ведет таблицу привязок адресов, выданных по DHCP, а динамическая проверка ARP сверяет с ней ответы ARP: компьютер Admin-PC сможет обмениваться данными через коммутатор только после того, как получит адрес по DHCP от доверенного порта.
    - title: "Адресация и DHCP на маршрутизаторе R-B-10"
      body: |
        **Требование 11.** На интерфейсе G0/0/0 маршрутизатора R-B-10 создан подинтерфейс G0/0/0.10 с инкапсуляцией 802.1Q (dot1Q) для сети VLAN 10 и адресом 192.168.10.1 с маской 255.255.255.0 по таблице адресации; у подинтерфейса есть IPv6-адрес 2001:db8:10:10::1/64.

        **Требование 12.** Из раздачи по DHCP исключены адрес подинтерфейса 192.168.10.1 и адрес интерфейса управления контроллера 192.168.10.254.

        **Требование 13.** Создан пул DHCP с именем WLAN-hosts для сети 192.168.10.0 с маской 255.255.255.0, шлюзом по умолчанию 192.168.10.1 и DNS-сервером 172.16.1.100.

        **Требование 14.** Интерфейс G0/0/1 маршрутизатора R-B-10, подключенный к сети поставщика услуг, получает IPv4-адрес по DHCP.

        **Требование 15.** Компьютер Admin-PC получает IPv4-адрес по DHCP, а его IPv6-адрес 2001:db8:10:10::10/64 и шлюз IPv6 по умолчанию 2001:db8:10:10::1 заданы вручную.
    - title: "Статические маршруты на маршрутизаторе R-1-A"
      body: |
        **Требование 16.** На маршрутизаторе R-1-A включена маршрутизация IPv6.

        **Требование 17.** Заданы два маршрута IPv4 по умолчанию: основной через выходной интерфейс G0/0/1 и плавающий резервный через выходной интерфейс S0/1/0 с административным расстоянием 5. Маршруты задаются через выходной интерфейс, без адреса следующего перехода.

        **Требование 18.** Заданы два маршрута IPv4 к сети пользователей 192.168.10.0/24 по тому же правилу: основной через G0/0/1 и плавающий через S0/1/0 с расстоянием 5.

        **Требование 19.** Задан маршрут IPv4 к узлу Admin-PC (192.168.10.10 с маской 255.255.255.255) через выходной интерфейс G0/0/1.

        **Требование 20.** Заданы два маршрута IPv6 по умолчанию через адрес следующего перехода: основной через 2001:db8:1:1::3 (интерфейс G0/0/1 маршрутизатора R-B-10) и плавающий резервный через 2001:db8:2:2::2 с административным расстоянием 5.

        **Требование 21.** Задан маршрут IPv6 к узлу Admin-PC (2001:db8:10:10::10/128) через следующий переход 2001:db8:1:1::3.

        **Примечание.** Маршрут через выходной интерфейс Ethernet вызывает предупреждение: без адреса следующего перехода маршрутизатор ищет получателя по протоколу ARP на этом интерфейсе. Здесь канал к поставщику услуг — точка-точка, и предупреждение можно не учитывать. Плавающий маршрут с большим административным расстоянием попадает в таблицу маршрутизации только тогда, когда основной маршрут исчезает из нее вместе с выключенным интерфейсом.
    - title: "Статические маршруты на маршрутизаторе R-B-10"
      body: |
        **Требование 22.** На маршрутизаторе R-B-10 включена маршрутизация IPv6.

        **Требование 23.** Заданы два маршрута IPv4 по умолчанию: основной через выходной интерфейс G0/0/1 и плавающий резервный через выходной интерфейс S0/1/0 с административным расстоянием 5.

        **Требование 24.** Заданы два маршрута IPv6 по умолчанию через адрес следующего перехода: основной через 2001:db8:1:1::2 (интерфейс G0/0/1 маршрутизатора R-1-A) и плавающий резервный через 2001:db8:2:2::1 с административным расстоянием 5.
    - title: "Настройка контроллера беспроводной сети WLC-10"
      body: |
        **Требование 25.** На контроллере WLC-10 создан интерфейс с именем WLAN 10: VLAN 10, физический порт 1, адрес 192.168.10.253 с маской 255.255.255.0, шлюз 192.168.10.1, основной DHCP-сервер 192.168.10.1.

        **Требование 26.** На контроллере задан RADIUS-сервер с индексом 1: адрес 172.16.1.100, общий ключ Cisco123.

        **Требование 27.** Создана беспроводная сеть с идентификатором 10, именем профиля WLAN 10 и SSID WLAN-10: она включена, привязана к интерфейсу WLAN 10, защищена по WPA2 Enterprise (802.1X) с RADIUS-сервером 172.16.1.100, а локальная коммутация и локальная аутентификация FlexConnect включены.

        **Требование 28.** Создана область DHCP с именем Wired_Admin: адреса с 192.168.10.240 по 192.168.10.249, сеть 192.168.10.0 с маской 255.255.255.0, шлюз 192.168.10.1; область включена. Конфигурация контроллера сохранена.

        **Требование 29.** Задан получатель SNMP-трапов: сообщество WLAN_SNMP, адрес 172.16.1.100.

        **Примечание.** Точка доступа LAP-10 получает адрес из пула маршрутизатора R-B-10 и присоединяется к контроллеру сама; после этого она появляется в списке точек доступа контроллера. Интерфейс WLAN 10 находится в той же сети, что и интерфейс управления, поэтому кадры беспроводных клиентов проходят через порт доступа коммутатора без тега.
    - title: "Подключение ноутбука LT-1"
      body: |
        **Требование 30.** На ноутбуке LT-1 создан профиль беспроводной сети с именем WLAN-10 для сети WLAN-10: адрес по DHCP, защита WPA2-Enterprise, пользователь user10 с паролем User10Pass. Ноутбук подключен к сети WLAN-10 через точку доступа LAP-10.
    - title: "Проверка"
      body: |
        Когда все требования выполнены, проверьте результат. Первые эхо-запросы каждой проверки могут остаться без ответа: в это время устройства определяют MAC-адреса друг друга по протоколу ARP.

        **Шаг 1.** Компьютер Admin-PC получает адрес 192.168.10.10 — первый свободный адрес пула — с шлюзом 192.168.10.1 и DNS-сервером 172.16.1.100 (**ipconfig /renew** в приложении «Командная строка»), а **ipconfig /all** показывает и его IPv6-адрес со шлюзом.

        ```
        C:\>ipconfig /renew

           IP Address......................: 192.168.10.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.10.1
           DNS Server......................: 172.16.1.100
        ```

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Physical Address................: 00-D0-D3-DC-28-25
           DHCP Enabled....................: Yes
           Link-local IPv6 Address.........: FE80::2D0:D3FF:FEDC:2825
           IPv6 Address....................: 2001:DB8:10:10::10
           IPv4 Address....................: 192.168.10.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 2001:DB8:10:10::1
                                             192.168.10.1
           DHCP Servers....................: 192.168.10.1
           DNS Servers.....................: 172.16.1.100
        ```

        **Шаг 2.** Путь от компьютера Admin-PC к серверу (**tracert 172.16.1.100**) проходит через подинтерфейс маршрутизатора R-B-10 (192.168.10.1) и интерфейс G0/0/1 маршрутизатора R-1-A (10.1.1.2): работает основной маршрут через канал Ethernet.

        ```
        C:\>tracert 172.16.1.100

        Tracing route to 172.16.1.100 over a maximum of 30 hops:

          1     1 ms    <1 ms    <1 ms  192.168.10.1
          2     *        *        1 ms  10.1.1.2
          3     *        2 ms     2 ms  172.16.1.100

        Trace complete.
        ```

        **Шаг 3.** Компьютер Admin-PC получает ответы от сервера по IPv4 (**ping 172.16.1.100**) и по IPv6 (**ping 2001:db8:16:1::100**).

        ```
        C:\>ping 172.16.1.100

        Pinging 172.16.1.100 with 32 bytes of data:

        Reply from 172.16.1.100: bytes=32 time=2ms TTL=126
        Reply from 172.16.1.100: bytes=32 time=2ms TTL=126
        Reply from 172.16.1.100: bytes=32 time=2ms TTL=126
        Reply from 172.16.1.100: bytes=32 time=2ms TTL=126

        Ping statistics for 172.16.1.100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        ```
        C:\>ping 2001:db8:16:1::100

        Pinging 2001:DB8:16:1::100 with 32 bytes of data:

        Reply from 2001:DB8:16:1::100: bytes=32 time=4ms TTL=126
        Reply from 2001:DB8:16:1::100: bytes=32 time=2ms TTL=126
        Reply from 2001:DB8:16:1::100: bytes=32 time=2ms TTL=126
        Reply from 2001:DB8:16:1::100: bytes=32 time=2ms TTL=126

        Ping statistics for 2001:DB8:16:1::100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 4ms, Average = 2ms
        ```

        **Шаг 4.** На маршрутизаторе R-B-10 команда **show ip dhcp binding** показывает аренду адреса 192.168.10.10 компьютером Admin-PC, а на коммутаторе Sw-A команда **show ip dhcp snooping binding** — ту же привязку на порту F0/1 в сети VLAN 10.

        ```
        R-B-10#show ip dhcp binding
        Bindings from all pools not associated with VRF:
        IP address          Client-ID/              Lease expiration        Type
                            Hardware address/
                            User name
        192.168.10.10       0100.d0d3.dc28.25       Mar 02 1993 12:06 AM    Automatic
        ```

        ```
        Sw-A>enable
        Sw-A#show ip dhcp snooping binding
        MacAddress          IpAddress        Lease(sec)  Type           VLAN  Interface
        ------------------  ---------------  ----------  -------------  ----  --------------------
        00:D0:D3:DC:28:25   192.168.10.10    86400       dhcp-snooping  10    FastEthernet0/1
        Total number of bindings: 1
        ```

        **Шаг 5.** На коммутаторе Sw-A команда **show port-security interface f0/1** показывает включенную защиту порта в режиме Restrict, не больше 2 адресов, время устаревания 10 минут и один настроенный адрес.

        ```
        Sw-A#show port-security interface f0/1
        Port Security              : Enabled
        Port Status                : Secure-up
        Violation Mode             : Restrict
        Aging Time                 : 10 mins
        Aging Type                 : Absolute
        SecureStatic Address Aging : Disabled
        Maximum MAC Addresses      : 2
        Total MAC Addresses        : 1
        Configured MAC Addresses   : 1
        Sticky MAC Addresses       : 0
        Last Source Address:Vlan   : 00d0.d3dc.2825:10
        Security Violation Count   : 0
        ```

        **Шаг 6.** Проверьте резервный маршрут: в консоли коммутатора ISP-Switch выключите порты F0/1 и F0/2, к которым подключены маршрутизаторы (**configure terminal**, **interface range f0/1 - 2**, **shutdown**, **end**). Каналы Ethernet обоих маршрутизаторов опускаются, и их основные маршруты исчезают из таблиц маршрутизации.

        ```
        ISP-Switch>enable
        ISP-Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        ISP-Switch(config)#interface range f0/1 - 2
        ISP-Switch(config-if-range)#shutdown
        *Mar  1 00:08:35.030: %LINK-5-CHANGED: Interface FastEthernet0/1, changed state to administratively down
        *Mar  1 00:08:35.030: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/1, changed state to down
        *Mar  1 00:08:35.030: %LINK-5-CHANGED: Interface FastEthernet0/2, changed state to administratively down
        *Mar  1 00:08:35.030: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/2, changed state to down
        ISP-Switch(config-if-range)#end
        *Mar  1 00:08:38.030: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 7.** Путь от компьютера Admin-PC к серверу теперь проходит через последовательный канал (**tracert 172.16.1.100**: второй переход — 10.2.2.1), и сервер по-прежнему отвечает по IPv6 (**ping 2001:db8:16:1::100**): плавающие маршруты с расстоянием 5 заняли место основных.

        ```
        C:\>tracert 172.16.1.100

        Tracing route to 172.16.1.100 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  192.168.10.1
          2     1 ms     1 ms     1 ms  10.2.2.1
          3     1 ms     1 ms     1 ms  172.16.1.100

        Trace complete.
        ```

        ```
        C:\>ping 2001:db8:16:1::100

        Pinging 2001:DB8:16:1::100 with 32 bytes of data:

        Reply from 2001:DB8:16:1::100: bytes=32 time=1ms TTL=126
        Reply from 2001:DB8:16:1::100: bytes=32 time=1ms TTL=126
        Reply from 2001:DB8:16:1::100: bytes=32 time=1ms TTL=126
        Reply from 2001:DB8:16:1::100: bytes=32 time=1ms TTL=126

        Ping statistics for 2001:DB8:16:1::100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 8.** Снова включите порты F0/1 и F0/2 коммутатора ISP-Switch (**configure terminal**, **interface range f0/1 - 2**, **no shutdown**, **end**) и подождите около 30 секунд: путь к серверу (**tracert 172.16.1.100**) снова проходит через канал Ethernet.

        ```
        ISP-Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        ISP-Switch(config)#interface range f0/1 - 2
        ISP-Switch(config-if-range)#no shutdown
        *Mar  1 00:09:31.047: %LINK-3-UPDOWN: Interface FastEthernet0/1, changed state to up
        *Mar  1 00:09:31.047: %LINK-3-UPDOWN: Interface FastEthernet0/2, changed state to up
        *Mar  1 00:09:32.047: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/1, changed state to up
        *Mar  1 00:09:32.047: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/2, changed state to up
        ISP-Switch(config-if-range)#end
        *Mar  1 00:10:07.047: %SYS-5-CONFIG_I: Configured from console by console
        ```

        ```
        C:\>tracert 172.16.1.100

        Tracing route to 172.16.1.100 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  192.168.10.1
          2     1 ms     1 ms     1 ms  10.1.1.2
          3     1 ms     1 ms     1 ms  172.16.1.100

        Trace complete.
        ```

        **Шаг 9.** В веб-интерфейсе контроллера WLC-10 точка доступа LAP-10 есть в списке точек доступа. На ноутбуке LT-1 вкладка «Состояние» приложения «Беспроводная сеть» показывает подключение к сети WLAN-10 через LAP-10, а **ipconfig** в приложении «Командная строка» — адрес 192.168.10.240: его выдала область Wired_Admin контроллера, которая обслуживает сеть 192.168.10.0/24.

        ```
        C:\>ipconfig

        Wireless0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:C6FF:FEDD:3F01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.10.240
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.10.1
        ```

        **Шаг 10.** Ноутбук LT-1 получает ответы от сервера (**ping 172.16.1.100**): кадры беспроводной сети коммутируются точкой доступа локально (FlexConnect) и уходят через коммутатор Sw-A и маршрутизатор R-B-10.

        ```
        C:\>ping 172.16.1.100

        Pinging 172.16.1.100 with 32 bytes of data:

        Request timed out.
        Reply from 172.16.1.100: bytes=32 time=2ms TTL=126
        Reply from 172.16.1.100: bytes=32 time=2ms TTL=126
        Reply from 172.16.1.100: bytes=32 time=2ms TTL=126

        Ping statistics for 172.16.1.100:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 11.** На маршрутизаторе R-B-10 команда **show ip dhcp binding** показывает аренды компьютера Admin-PC (192.168.10.10) и точки доступа LAP-10 (192.168.10.11).

        ```
        R-B-10#show ip dhcp binding
        Bindings from all pools not associated with VRF:
        IP address          Client-ID/              Lease expiration        Type
                            Hardware address/
                            User name
        192.168.10.10       0100.d0d3.dc28.25       Mar 02 1993 12:06 AM    Automatic
        192.168.10.11       0100.d0d9.b044.01       Mar 02 1993 12:11 AM    Automatic
        ```
