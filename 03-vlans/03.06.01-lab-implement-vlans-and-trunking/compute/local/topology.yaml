    - title: "Начальное состояние"
      body: |
        - На компьютерах заданы IP-адреса и маски подсети по таблице адресации. Шлюз по умолчанию не задан: в сети нет маршрутизатора.
        - На коммутаторах задано только имя устройства, остальные параметры имеют значения по умолчанию: все порты находятся в сети VLAN 1, а порты G0/1 и G0/2 работают в режиме DTP по умолчанию.
        - IP-телефона в топологии нет: компьютер PC7 подключен к порту F0/4 коммутатора SWC напрямую. Голосовая сеть VLAN настраивается на этом порту так же, как на порту с телефоном.

        В начальном состоянии компьютер PC1 получает ответы на эхо-запросы от компьютера PC4 (**ping 192.168.10.11** в приложении «Командная строка»): все порты коммутаторов находятся в одной сети VLAN 1.

        ```
        C:\>ping 192.168.10.11

        Pinging 192.168.10.11 with 32 bytes of data:

        Reply from 192.168.10.11: bytes=32 time=3ms TTL=128
        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.10.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 3ms, Average = 1ms
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Создание сетей VLAN"
      body: |
        **Требование 1.** На каждом из коммутаторов SWA, SWB и SWC созданы сети VLAN из таблицы VLAN с указанными в ней именами: 10 Admin, 20 Accounts, 30 HR, 40 Voice, 99 Management и 100 Native. Имена сетей VLAN чувствительны к регистру, поэтому они должны совпадать с таблицей точно.
    - title: "Назначение портов сетям VLAN"
      body: |
        **Требование 2.** Порты коммутаторов SWB и SWC, к которым подключены компьютеры, — порты доступа сетей VLAN из таблицы адресации. На обоих коммутаторах порт F0/1 находится в сети VLAN 10, порт F0/2 — в сети VLAN 20, порт F0/3 — в сети VLAN 30, а порт F0/4 коммутатора SWC — в сети VLAN 10.

        **Требование 3.** Порт F0/4 коммутатора SWC передает трафик IP-телефона в голосовой сети VLAN 40.

        **Примечание.** IP-телефон обычно подключают к порту коммутатора, а компьютер — к порту на самом телефоне, поэтому через один порт коммутатора проходит трафик обоих устройств. Голосовая сеть VLAN позволяет передавать трафик телефона в отдельной сети VLAN с тегом, а трафик компьютера — в сети VLAN порта доступа без тега.
    - title: "Настройка интерфейсов управления"
      body: |
        **Требование 4.** На каждом коммутаторе включен интерфейс сети VLAN 99 (SVI) с IP-адресом из таблицы адресации и маской 255.255.255.0: на SWA — 192.168.99.252, на SWB — 192.168.99.253, на SWC — 192.168.99.254.

        **Примечание.** Через интерфейс SVI коммутатор сам становится узлом своей сети VLAN, и к нему можно подключиться по сети для управления. Коммутаторы ответят друг другу по этим адресам, когда между ними заработают магистральные каналы: только по ним кадры сети VLAN 99 проходят от одного коммутатора к другому.
    - title: "Настройка статического магистрального канала"
      body: |
        **Требование 5.** Порты G0/1 коммутаторов SWA и SWB статически работают в режиме магистрального канала (trunk) и не согласуют режим с соседом: протокол DTP на этих портах выключен.

        **Требование 6.** Собственная VLAN (native VLAN) на обоих концах магистрального канала между SWA и SWB — VLAN 100.

        **Примечание.** Кадры собственной VLAN передаются по магистральному каналу без тега, поэтому оба конца канала должны относить их к одной и той же сети VLAN. Если собственные VLAN на концах канала различаются, кадры без тега попадают в разные сети VLAN, а коммутаторы выводят в консоль сообщение `%CDP-4-NATIVE_VLAN_MISMATCH` с номерами собственных VLAN обоих концов.
    - title: "Настройка динамического магистрального канала"
      body: |
        **Требование 7.** Порт G0/2 коммутатора SWC остается в режиме DTP по умолчанию. Порт G0/2 коммутатора SWA работает в режиме dynamic desirable протокола DTP, в котором он сам предлагает соседу образовать магистральный канал, и соединение SWA–SWC работает как магистральный канал.

        **Требование 8.** Собственная VLAN на обоих концах магистрального канала между SWA и SWC — VLAN 100.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC4 командой **ping 192.168.10.11**. Эхо-запросы выполняются: оба компьютера находятся в сети VLAN 10, и ее кадры проходят от коммутатора SWB через SWA к SWC по магистральным каналам.

        ```
        C:\>ping 192.168.10.11

        Pinging 192.168.10.11 with 32 bytes of data:

        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.10.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** В приложении «Командная строка» компьютера PC2 проверьте связь с компьютером PC5 командой **ping 192.168.20.21**. Эхо-запросы выполняются: оба компьютера находятся в сети VLAN 20.

        ```
        C:\>ping 192.168.20.21

        Pinging 192.168.20.21 with 32 bytes of data:

        Reply from 192.168.20.21: bytes=32 time=3ms TTL=128
        Reply from 192.168.20.21: bytes=32 time=1ms TTL=128
        Reply from 192.168.20.21: bytes=32 time=1ms TTL=128
        Reply from 192.168.20.21: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.20.21:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 3ms, Average = 1ms
        ```

        **Шаг 3.** В приложении «Командная строка» компьютера PC3 проверьте связь с компьютером PC6 командой **ping 192.168.30.31**. Эхо-запросы выполняются: оба компьютера находятся в сети VLAN 30.

        ```
        C:\>ping 192.168.30.31

        Pinging 192.168.30.31 with 32 bytes of data:

        Reply from 192.168.30.31: bytes=32 time=3ms TTL=128
        Reply from 192.168.30.31: bytes=32 time=1ms TTL=128
        Reply from 192.168.30.31: bytes=32 time=1ms TTL=128
        Reply from 192.168.30.31: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.30.31:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 3ms, Average = 1ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC7 проверьте связь с компьютером PC1 командой **ping 192.168.10.10**. Эхо-запросы выполняются: порт F0/4 коммутатора SWC с голосовой сетью VLAN передает трафик компьютера в сети VLAN 10.

        ```
        C:\>ping 192.168.10.10

        Pinging 192.168.10.10 with 32 bytes of data:

        Reply from 192.168.10.10: bytes=32 time=3ms TTL=128
        Reply from 192.168.10.10: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.10: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.10: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.10.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 3ms, Average = 1ms
        ```

        **Шаг 5.** На коммутаторе SWB проверьте связь с коммутатором SWA командой **ping 192.168.99.252**.

        **Шаг 6.** На коммутаторе SWB проверьте связь с коммутатором SWC командой **ping 192.168.99.254**. Коммутатор SWB получает ответы от обоих коммутаторов: их интерфейсы управления находятся в сети VLAN 99, и ее кадры проходят по магистральным каналам. Первый эхо-запрос остается без ответа (символ «.»): в это время коммутатор определяет MAC-адрес получателя по протоколу ARP.

        ```
        SWB#ping 192.168.99.252
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.99.252, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        SWB#ping 192.168.99.254
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.99.254, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```
