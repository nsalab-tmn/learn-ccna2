    - title: "Начальное состояние"
      body: |
        - На компьютерах заданы IP-адреса и маски подсети по таблице адресации. Шлюз по умолчанию не задан: в сети нет маршрутизатора.
        - На коммутаторах задано только имя устройства, остальные параметры имеют значения по умолчанию.

        **Шаг 1.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Выведите список сетей VLAN командой **show vlan brief**. По умолчанию все порты коммутатора назначены сети VLAN 1 (default). Сети VLAN 1002–1005 зарезервированы для устаревших технологий FDDI и Token Ring.

        ```
        S1>enable
        S1#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/6, Fa0/7, Fa0/8
                                                        Fa0/9, Fa0/10, Fa0/11, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
                                                        Fa0/17, Fa0/18, Fa0/19, Fa0/20
                                                        Fa0/21, Fa0/22, Fa0/23, Fa0/24
                                                        Gi0/1, Gi0/2
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Шаг 3.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC4 командой **ping 172.17.10.24**. Эхо-запросы выполняются успешно, хотя PC1 и PC4 подключены к разным коммутаторам.

        **Шаг 4.** Проверьте связь с компьютером PC2 командой **ping 172.17.20.22**. Эхо-запросы не выполняются: PC2 находится в другой IP-сети, 172.17.20.0/24, а шлюз по умолчанию на PC1 не задан, поэтому PC1 некуда отправить пакет для другой сети.

        ```
        C:\>ping 172.17.10.24

        Pinging 172.17.10.24 with 32 bytes of data:

        Reply from 172.17.10.24: bytes=32 time=3ms TTL=128
        Reply from 172.17.10.24: bytes=32 time=1ms TTL=128
        Reply from 172.17.10.24: bytes=32 time=1ms TTL=128
        Reply from 172.17.10.24: bytes=32 time=1ms TTL=128

        Ping statistics for 172.17.10.24:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 3ms, Average = 1ms

        C:\>ping 172.17.20.22

        Pinging 172.17.20.22 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 172.17.20.22:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 5.** Ответьте на вопрос 1 в форме ответов.
    - title: "Создание сетей VLAN"
      body: |
        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте сеть VLAN 10 командой **vlan 10** и присвойте ей имя Faculty/Staff командой **name Faculty/Staff**. Имена сетей VLAN чувствительны к регистру, поэтому вводите их точно так, как они написаны.

        **Шаг 3.** Аналогично создайте на коммутаторе S1 остальные сети VLAN: VLAN 20 с именем Students, VLAN 30 с именем Guest(Default), VLAN 99 с именем Management&Native и VLAN 150 с именем VOICE. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#vlan 10
        S1(config-vlan)#name Faculty/Staff
        S1(config-vlan)#vlan 20
        S1(config-vlan)#name Students
        S1(config-vlan)#vlan 30
        S1(config-vlan)#name Guest(Default)
        S1(config-vlan)#vlan 99
        S1(config-vlan)#name Management&Native
        S1(config-vlan)#vlan 150
        S1(config-vlan)#name VOICE
        S1(config-vlan)#end
        *Mar  1 00:01:06.682: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Убедитесь, что сети VLAN созданы, с помощью команды **show vlan brief**. Новые сети VLAN активны, но портов в них пока нет.

        ```
        S1#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/6, Fa0/7, Fa0/8
                                                        Fa0/9, Fa0/10, Fa0/11, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
                                                        Fa0/17, Fa0/18, Fa0/19, Fa0/20
                                                        Fa0/21, Fa0/22, Fa0/23, Fa0/24
                                                        Gi0/1, Gi0/2
        10   Faculty/Staff                    active
        20   Students                         active
        30   Guest(Default)                   active
        99   Management&Native                active
        150  VOICE                            active
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Шаг 5.** Ответьте на вопрос 2 в форме ответов.

        **Примечание.** В этой лабораторной работе сети VLAN создаются на каждом коммутаторе вручную: сеть VLAN, созданная на одном коммутаторе, на других коммутаторах не появляется.

        **Шаг 6.** На коммутаторах S2 и S3 откройте консоль, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Затем аналогично создайте те же сети VLAN с теми же именами. Команды на S3 те же, что на S2.

        ```
        S2>enable
        S2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S2(config)#vlan 10
        S2(config-vlan)#name Faculty/Staff
        S2(config-vlan)#vlan 20
        S2(config-vlan)#name Students
        S2(config-vlan)#vlan 30
        S2(config-vlan)#name Guest(Default)
        S2(config-vlan)#vlan 99
        S2(config-vlan)#name Management&Native
        S2(config-vlan)#vlan 150
        S2(config-vlan)#name VOICE
        S2(config-vlan)#end
        *Mar  1 00:01:17.951: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Назначение портов сетям VLAN"
      body: |
        **Шаг 1.** На коммутаторе S2 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса F0/11 командой **interface f0/11**.

        **Шаг 2.** Переведите интерфейс в режим порта доступа командой **switchport mode access** и назначьте его сети VLAN 10 командой **switchport access vlan 10**.

        **Шаг 3.** Аналогично назначьте интерфейс F0/18 сети VLAN 20, а интерфейс F0/6 — сети VLAN 30. Вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 4.** Убедитесь с помощью команды **show vlan brief**, что порты F0/11, F0/18 и F0/6 перешли в свои сети VLAN.

        ```
        S2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S2(config)#interface f0/11
        S2(config-if)#switchport mode access
        S2(config-if)#switchport access vlan 10
        S2(config-if)#interface f0/18
        S2(config-if)#switchport mode access
        S2(config-if)#switchport access vlan 20
        S2(config-if)#interface f0/6
        S2(config-if)#switchport mode access
        S2(config-if)#switchport access vlan 30
        S2(config-if)#end
        *Mar  1 00:01:36.256: %SYS-5-CONFIG_I: Configured from console by console
        S2#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/7, Fa0/8, Fa0/9
                                                        Fa0/10, Fa0/12, Fa0/13, Fa0/14
                                                        Fa0/15, Fa0/16, Fa0/17, Fa0/19
                                                        Fa0/20, Fa0/21, Fa0/22, Fa0/23
                                                        Fa0/24, Gi0/1, Gi0/2
        10   Faculty/Staff                    active    Fa0/11
        20   Students                         active    Fa0/18
        30   Guest(Default)                   active    Fa0/6
        99   Management&Native                active
        150  VOICE                            active
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Примечание.** Порт доступа принадлежит одной сети VLAN и передает кадры без тега, поэтому подключенный к нему компьютер не знает, в какой сети VLAN он находится. Сеть VLAN узла определяется настройкой порта коммутатора.

        **Шаг 5.** На коммутаторе S3 назначьте порты тем же сетям VLAN: F0/11 — VLAN 10, F0/18 — VLAN 20, F0/6 — VLAN 30.

        ```
        S3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S3(config)#interface f0/11
        S3(config-if)#switchport mode access
        S3(config-if)#switchport access vlan 10
        S3(config-if)#interface f0/18
        S3(config-if)#switchport mode access
        S3(config-if)#switchport access vlan 20
        S3(config-if)#interface f0/6
        S3(config-if)#switchport mode access
        S3(config-if)#switchport access vlan 30
        S3(config-if)#end
        *Mar  1 00:01:44.701: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Настройка голосовой сети VLAN"
      body: |
        **Примечание.** IP-телефон обычно подключают к порту коммутатора, а компьютер — к порту на самом телефоне, поэтому через один порт коммутатора проходит трафик обоих устройств. Голосовая сеть VLAN позволяет передавать трафик телефона в отдельной сети VLAN с тегом, а трафик компьютера — в сети VLAN порта доступа без тега.

        **Шаг 1.** Сотрудник за компьютером PC4 скоро получит IP-телефон. На коммутаторе S3 перейдите в режим глобальной конфигурации командой **configure terminal** и к настройке интерфейса F0/11, к которому подключен PC4, командой **interface f0/11**.

        **Шаг 2.** Назначьте интерфейсу голосовую сеть VLAN 150 командой **switchport voice vlan 150** и вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 3.** Убедитесь с помощью команды **show interfaces f0/11 switchport**, что порт F0/11 остался портом доступа сети VLAN 10 (строка «Access Mode VLAN») и получил голосовую сеть VLAN 150 (строка «Voice VLAN»).

        ```
        S3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S3(config)#interface f0/11
        S3(config-if)#switchport voice vlan 150
        S3(config-if)#end
        *Mar  1 00:01:47.517: %SYS-5-CONFIG_I: Configured from console by console
        S3#show interfaces f0/11 switchport
        Name: Fa0/11
        Switchport: Enabled
        Administrative Mode: static access
        Operational Mode: static access
        Administrative Trunking Encapsulation: dot1q
        Operational Trunking Encapsulation: native
        Negotiation of Trunking: Off
        Access Mode VLAN: 10 (Faculty/Staff)
        Trunking Native Mode VLAN: 1 (default)
        Voice VLAN: 150 (VOICE)
        …
        ```
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC4 командой **ping 172.17.10.24**. Теперь эхо-запросы не выполняются, хотя PC1 и PC4 находятся в одной сети VLAN 10.

        ```
        C:\>ping 172.17.10.24

        Pinging 172.17.10.24 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 172.17.10.24:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 2.** На коммутаторе S2 снова выведите список сетей VLAN командой **show vlan brief** и найдите в нем порт, которым коммутатор S2 подключен к коммутатору S1 (G0/1). Он остался в сети VLAN 1: ни одна из ваших сетей VLAN не настроена на соединении между коммутаторами.

        ```
        S2#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/7, Fa0/8, Fa0/9
                                                        Fa0/10, Fa0/12, Fa0/13, Fa0/14
                                                        Fa0/15, Fa0/16, Fa0/17, Fa0/19
                                                        Fa0/20, Fa0/21, Fa0/22, Fa0/23
                                                        Fa0/24, Gi0/1, Gi0/2
        10   Faculty/Staff                    active    Fa0/11
        20   Students                         active    Fa0/18
        30   Guest(Default)                   active    Fa0/6
        …
        ```

        **Шаг 3.** На коммутаторе S2 выведите список магистральных каналов (trunk) командой **show interfaces trunk**. Вывод пуст: между коммутаторами нет ни одного магистрального канала.

        ```
        S2#show interfaces trunk
        ```

        **Шаг 4.** Ответьте на вопросы 3 и 4 в форме ответов.
