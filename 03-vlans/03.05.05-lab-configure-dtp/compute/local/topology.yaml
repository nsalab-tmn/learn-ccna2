        **Шаг 4.** Откройте окно компьютера PC3 и в приложении «Командная строка» проверьте связь с компьютером PC4 командой **ping 192.168.30.2**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 192.168.30.2

        Pinging 192.168.30.2 with 32 bytes of data:

        Reply from 192.168.30.2: bytes=32 time=3ms TTL=128
        Reply from 192.168.30.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.30.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.30.2: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.30.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
