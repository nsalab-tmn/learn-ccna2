        **Шаг 5.** Откройте окно компьютера PC2 и в приложении «Командная строка» проверьте связь с компьютером PC5 сети VLAN 20 командой **ping 172.17.20.25**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 172.17.20.25

        Pinging 172.17.20.25 with 32 bytes of data:

        Reply from 172.17.20.25: bytes=32 time=3ms TTL=128
