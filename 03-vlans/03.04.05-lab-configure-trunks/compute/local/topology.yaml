        **Шаг 6.** Аналогично проверьте связь компьютера PC3 с компьютером PC6 сети VLAN 30 командой **ping 172.17.30.26**. Эхо-запросы выполняются успешно: магистральные каналы передают кадры всех сетей VLAN.

        ```
