    - title: "Начальное состояние"
      body: |
        - На коммутаторе S1 созданы сети VLAN 10, 20 и 30, и все 24 порта настроены как порты доступа: F0/1–F0/8 — в сети VLAN 30, F0/9–F0/16 — в сети VLAN 10, F0/17–F0/24 — в сети VLAN 20.
        - На компьютерах заданы IP-адреса и маски подсети по таблице адресации. Шлюз по умолчанию не задан: в сети нет маршрутизатора.
        - Настраивать в этой лабораторной работе ничего не нужно: вы наблюдаете, как коммутатор пересылает кадры.

        **Шаг 1.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Убедитесь с помощью команды **show vlan brief**, что порты распределены по сетям VLAN так, как описано выше. Имена сетям VLAN не заданы, поэтому в столбце «Name» указаны имена по умолчанию: VLAN0010, VLAN0020 и VLAN0030.

        ```
        S1>enable
        S1#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Gi0/1, Gi0/2
        10   VLAN0010                         active    Fa0/9, Fa0/10, Fa0/11, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
        20   VLAN0020                         active    Fa0/17, Fa0/18, Fa0/19, Fa0/20
                                                        Fa0/21, Fa0/22, Fa0/23, Fa0/24
        30   VLAN0030                         active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/6, Fa0/7, Fa0/8
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Шаг 3.** Нажмите кнопку «VLAN» в условных обозначениях под схемой. Рядом с каждым портом коммутатора на схеме появится его сеть VLAN, например `F0/1 · V30`.

        **Шаг 4.** Откройте окно компьютера PC0 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC7 командой **ping 192.168.1.8**. Эхо-запросы выполняются успешно: PC0 и PC7 находятся в одной сети VLAN 30.

        ```
        C:\>ping 192.168.1.8

        Pinging 192.168.1.8 with 32 bytes of data:

        Reply from 192.168.1.8: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.8: bytes=32 time<1ms TTL=128
        Reply from 192.168.1.8: bytes=32 time<1ms TTL=128
        Reply from 192.168.1.8: bytes=32 time<1ms TTL=128

        Ping statistics for 192.168.1.8:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 5.** Проверьте связь с компьютером PC16 командой **ping 192.168.1.17**. Эхо-запросы не выполняются, хотя адрес 192.168.1.17 входит в ту же IP-сеть 192.168.1.0/27, что и адрес PC0: компьютер PC16 подключен к порту F0/17 сети VLAN 20. Сообщение «Destination host unreachable» выдает сам PC0 (192.168.1.1): он не нашел MAC-адрес получателя. Почему так происходит, вы увидите в режиме «Симуляция».

        ```
        C:\>ping 192.168.1.17

        Pinging 192.168.1.17 with 32 bytes of data:

        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.

        Ping statistics for 192.168.1.17:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Наблюдение за широковещательной рассылкой"
      body: |
        **Шаг 1.** Нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий. Время в сети остановится: следующее событие выполняется по кнопке «Шаг».

        **Шаг 2.** На панели нажмите «Фильтры». В окне «Фильтры событий» нажмите «Ничего», а затем «ICMP» и закройте окно. В списке будут показаны только события ICMP, а кнопка будет называться «Фильтры · ICMP».

        **Шаг 3.** Нажмите «Пакет» и выберите «Сложный PDU…». В форме «Сложный PDU» выберите в поле «Источник» компьютер PC0 и введите в поле «Адрес назначения» широковещательный адрес 255.255.255.255. В поле «Протокол» оставьте «ICMP (echo)»: это эхо-запрос, как у команды **ping**.

        **Шаг 4.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 5.** Нажмите «Отправить». В списке событий появится строка «echo → 255.255.255.255 · в F0»: компьютер PC0 отправляет эхо-запрос на широковещательный адрес.

        **Шаг 6.** Нажмите «Шаг». Кадр дойдет до коммутатора S1, и в столбце «Что происходит» будет видно, в какие порты коммутатор его рассылает: «широковещательный кадр в F0/1 → рассылка в F0/2, F0/3, F0/4, F0/5, F0/6, F0/7, F0/8». Если кнопка «VLAN» нажата, порты, по которым идет рассылка, подсвечены на схеме.

        **Шаг 7.** Нажимайте «Шаг» (или нажмите «Пуск»), пока кнопка «Шаг» не станет недоступной. Эхо-запрос получат компьютеры PC1–PC7 («echo-запрос доставлен»), и каждый из них отправит компьютеру PC0 эхо-ответ. Компьютеры с PC8 по PC23 в списке не появятся: кадр до них не доходит.

        **Примечание.** Широковещательный кадр коммутатор пересылает во все порты той сети VLAN, в которую входит порт, принявший кадр, кроме самого этого порта. В порты других сетей VLAN кадр не попадает, поэтому их узлы его не получают и не обрабатывают.

        **Шаг 8.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 9.** Нажмите кнопку «Сбросить» (↺) справа на панели «Симуляция»: список событий очистится. Повторите шаги 3, 5, 6 и 7 для компьютера PC8 (порт F0/9, VLAN 10). Затем снова сбросьте список и повторите их для компьютера PC16 (порт F0/17, VLAN 20).

        **Шаг 10.** Ответьте на вопросы 3, 4 и 5 в форме ответов.
    - title: "Наблюдение за одноадресной рассылкой"
      body: |
        **Шаг 1.** Сбросьте список событий кнопкой «Сбросить» (↺). Нажмите «Фильтры» и в окне «Фильтры событий» нажмите «ARP», чтобы в списке снова показывались и события ARP. Кнопка будет называться «Фильтры · ARP, ICMP».

        **Примечание.** По протоколу ARP компьютер узнает MAC-адрес получателя по его IP-адресу. ARP-запрос — широковещательный кадр, а ARP-ответ и эхо-запрос с известным MAC-адресом получателя — одноадресные.

        **Шаг 2.** Нажмите «Пакет» и выберите «Простой PDU — щёлкните источник и получателя». Щелкните на схеме компьютер PC10 (порт F0/11), а затем компьютер PC12 (порт F0/13). PC10 отправит компьютеру PC12 один эхо-запрос.

        **Шаг 3.** Нажимайте «Шаг», пока кнопка «Шаг» не станет недоступной. Если PC10 еще не знает MAC-адрес PC12, сначала в списке появится его ARP-запрос, разосланный в порты сети VLAN 10. Эхо-запрос и эхо-ответ проходят через коммутатор только между двумя портами: «кадр в F0/11 → F0/13» и «кадр в F0/13 → F0/11».

        **Примечание.** Одноадресный кадр коммутатор пересылает только в тот порт, за которым находится получатель: порт получателя он находит в своей таблице MAC-адресов. Каждый компьютер подключен к своему порту отдельным кабелем, поэтому кадры разных компьютеров не сталкиваются друг с другом.

        **Шаг 4.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 5.** Сбросьте список событий кнопкой «Сбросить» (↺). Аналогично отправьте простой PDU от компьютера PC1 (порт F0/2, VLAN 30) компьютеру PC22 (порт F0/23, VLAN 20).

        **Шаг 6.** Нажимайте «Шаг», пока кнопка «Шаг» не станет недоступной. PC1 рассылает ARP-запрос «кто 192.168.1.23?». Коммутатор пересылает его только в порты сети VLAN 30 (F0/1 и F0/3–F0/8), и компьютеры этих портов его отбрасывают. До PC22 запрос не доходит, ответа нет, и эхо-запрос остается у PC1 со статусом «ждёт ответа ARP». По этой же причине на странице «Начальное состояние» не прошли эхо-запросы от PC0 к PC16.

        **Шаг 7.** Ответьте на вопросы 6 и 8 в форме ответов.
    - title: "Проверка результатов"
      body: |
        **Шаг 1.** Нажмите «Лаборатория» вверху страницы, чтобы выйти из режима «Симуляция». Время в сети снова пойдет, а список событий очистится.

        Результаты наблюдений:

        - широковещательный кадр от PC0 получили только PC1–PC7, от PC8 — только PC9–PC15, от PC16 — только PC17–PC23;
        - одноадресный кадр от PC10 к PC12 прошел через коммутатор только между портами F0/11 и F0/13;
        - кадр из сети VLAN 30 не дошел до компьютера сети VLAN 20, хотя их IP-адреса принадлежат одной IP-сети 192.168.1.0/27.

        **Шаг 2.** Ответьте на вопросы 9 и 10 в форме ответов.
