    - title: "Начальное состояние"
      body: |
        - На компьютерах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации. Маршрутизатора в сети нет: адреса шлюзов 172.17.10.1, 172.17.20.1 и 172.17.30.1 не принадлежат ни одному устройству.
        - На каждом коммутаторе созданы сети VLAN 10 Faculty/Staff, VLAN 20 Students, VLAN 30 Guest(Default) и VLAN 99 Management&Native. Порт F0/11 назначен сети VLAN 10, порт F0/18 — сети VLAN 20, порт F0/6 — сети VLAN 30.
        - Соединения S1–S2 (порты F0/1) и S1–S3 (порты F0/3) — магистральные каналы (trunk) с собственной сетью VLAN (native VLAN) 99.
        - Интерфейсам VLAN 99 коммутаторов назначены IP-адреса по таблице адресации.

        **Шаг 1.** Нажмите «VLAN» в условных обозначениях под схемой. Рядом с каждым портом коммутатора появится его сеть VLAN: у портов доступа — номер сети VLAN (`F0/11 · V10`), у магистральных каналов — `T n99`.

        **Шаг 2.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите список сетей VLAN командой **show vlan brief**. Порты F0/11, F0/18 и F0/6 назначены сетям VLAN 10, 20 и 30, а порты F0/1 и F0/3 в списке отсутствуют: это магистральные каналы.

        ```
        S1>enable
        S1#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/2, Fa0/4, Fa0/5, Fa0/7
                                                        Fa0/8, Fa0/9, Fa0/10, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
                                                        Fa0/17, Fa0/19, Fa0/20, Fa0/21
                                                        Fa0/22, Fa0/23, Fa0/24, Gi0/1
                                                        Gi0/2
        10   Faculty/Staff                    active    Fa0/11
        20   Students                         active    Fa0/18
        30   Guest(Default)                   active    Fa0/6
        99   Management&Native                active
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Шаг 3.** Выведите список магистральных каналов командой **show interfaces trunk**. Порты F0/1 и F0/3 работают в режиме магистрального канала (столбец «Status»: trunking) с собственной сетью VLAN 99 и передают все сети VLAN коммутатора.

        ```
        S1#show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Fa0/1       on               802.1q         trunking      99
        Fa0/3       on               802.1q         trunking      99

        Port        Vlans allowed on trunk
        Fa0/1       1-4094
        Fa0/3       1-4094

        Port        Vlans allowed and active in management domain
        Fa0/1       1,10,20,30,99,1002-1005
        Fa0/3       1,10,20,30,99,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Fa0/1       1,10,20,30,99,1002-1005
        Fa0/3       1,10,20,30,99,1002-1005
        ```
    - title: "Наблюдение за рассылкой в сетях VLAN"
      body: |
        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым. Затем нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий: время в сети остановится, и каждое следующее событие будет выполняться по кнопке «Шаг».

        **Шаг 2.** На панели «Симуляция» нажмите «Пакет» и выберите «Простой PDU — щёлкните источник и получателя». Щелкните на схеме компьютер PC1, а затем компьютер PC6. PC1 отправит компьютеру PC6 один эхо-запрос, как команда **ping**.

        **Шаг 3.** Нажимайте «Шаг», пока кнопка не станет недоступной: событий в очереди больше нет. Просмотрите список событий. В столбце «Где» указано устройство, до которого дошел кадр, а в столбце «Что происходит» — что это устройство с ним сделало. При каждой рассылке широковещательного кадра слой «VLAN» подсвечивает на схеме порты, которые передают сеть VLAN этого кадра.

        **Шаг 4.** Ответьте на вопросы 1 и 2 в форме ответов.

        **Шаг 5.** Очистите список событий кнопкой «Сбросить» (↺) в правом конце панели «Симуляция». Затем нажмите «Пакет», выберите «Простой PDU — щёлкните источник и получателя» и щелкните на схеме компьютер PC1, а затем компьютер PC4.

        **Шаг 6.** Нажимайте «Шаг», пока кнопка не станет недоступной. На этот раз за ARP-запросом следуют ARP-ответ, эхо-запрос и эхо-ответ: последнее событие — «echo-ответ от 172.17.10.24 получен» на компьютере PC1. Найдите в списке событий все компьютеры, до которых дошел ARP-запрос компьютера PC1.

        **Шаг 7.** Ответьте на вопросы 3 и 4 в форме ответов.

        **Шаг 8.** Аналогично отправьте простой PDU от компьютера PC2 к компьютеру PC5 (сеть VLAN 20), а после сброса — от компьютера PC3 к компьютеру PC6 (сеть VLAN 30). Каждый раз найдите в списке событий компьютеры, до которых дошел ARP-запрос: одни отбрасывают его («не для … · отброшен»), а получатель отвечает («узнаёт свой адрес и отвечает»).

        **Примечание.** Порт доступа принадлежит одной сети VLAN, а магистральный канал передает кадры нескольких сетей VLAN, помечая каждый кадр тегом его сети VLAN. Поэтому широковещательный кадр проходит между коммутаторами по магистральному каналу, но коммутатор передает его только в порты доступа той сети VLAN, в которой кадр отправлен.

        **Шаг 9.** Ответьте на вопросы 8–11 в форме ответов.
    - title: "Сброс настроек коммутаторов"
      body: |
        **Шаг 1.** Нажмите «Лаборатория» вверху страницы: панель «Симуляция» закроется, и время в сети снова пойдет.

        **Шаг 2.** В консоли коммутатора S1 выведите содержимое флеш-памяти командой **show flash:**. Найдите в списке файл vlan.dat — базу данных VLAN.

        ```
        S1#show flash:
        Directory of flash:/

            1  -rw-     4414921          <no date>  ns01-netos-0.1.0.bin
            2  -rw-         616          <no date>  vlan.dat
            3  -rw-        1268          <no date>  config.text

        64016384 bytes total (59599579 bytes free)
        ```

        **Шаг 3.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 4.** Удалите загрузочную конфигурацию командой **erase startup-config** и подтвердите удаление клавишей Enter.

        **Шаг 5.** Удалите базу данных VLAN командой **delete vlan.dat**. На вопрос об имени файла и на запрос подтверждения нажмите Enter.

        ```
        S1#erase startup-config
        Erasing the nvram filesystem will remove all configuration files! Continue? [confirm]
        [OK]
        Erase of nvram: complete
        S1#delete vlan.dat
        Delete filename [vlan.dat]? 
        Delete flash:/vlan.dat? [confirm]
        ```

        **Примечание.** Сети VLAN и их имена хранятся не в загрузочной конфигурации, а в файле vlan.dat во флеш-памяти. Если удалить только загрузочную конфигурацию, коммутатор после перезагрузки сохранит свои сети VLAN, хотя порты вернутся в сеть VLAN 1.

        **Шаг 6.** Ответьте на вопросы 5 и 7 в форме ответов.

        **Шаг 7.** Перезагрузите коммутатор командой **reload**. На вопрос о сохранении конфигурации ответьте **no**, а запрос подтверждения перезагрузки примите клавишей Enter. Коммутатор перезагрузится, и в консоли появятся сообщения о загрузке.

        ```
        S1#reload
        System configuration has been modified. Save? [yes/no]: no
        Proceed with reload? [confirm]
        *Mar  1 00:00:56.791: %SYS-5-RELOAD: Reload requested by console. Reload Reason: Reload Command.
        …
        ```

        **Примечание.** Ответ yes записал бы текущую конфигурацию, в которой еще есть назначения портов и магистральные каналы, в загрузочную, и после перезагрузки коммутатор вернулся бы к прежним настройкам.

        **Шаг 8.** Аналогично сбросьте коммутаторы S2 и S3: откройте консоль, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable**, удалите загрузочную конфигурацию и файл vlan.dat и перезагрузите коммутатор. Команды те же, что на S1.

        ```
        S2>enable
        S2#erase startup-config
        Erasing the nvram filesystem will remove all configuration files! Continue? [confirm]
        [OK]
        Erase of nvram: complete
        S2#delete vlan.dat
        Delete filename [vlan.dat]? 
        Delete flash:/vlan.dat? [confirm]
        S2#reload
        System configuration has been modified. Save? [yes/no]: no
        Proceed with reload? [confirm]
        *Mar  1 00:02:44.761: %SYS-5-RELOAD: Reload requested by console. Reload Reason: Reload Command.
        …
        ```

        ```
        S3>enable
        S3#erase startup-config
        Erasing the nvram filesystem will remove all configuration files! Continue? [confirm]
        [OK]
        Erase of nvram: complete
        S3#delete vlan.dat
        Delete filename [vlan.dat]? 
        Delete flash:/vlan.dat? [confirm]
        S3#reload
        System configuration has been modified. Save? [yes/no]: no
        Proceed with reload? [confirm]
        *Mar  1 00:04:11.400: %SYS-5-RELOAD: Reload requested by console. Reload Reason: Reload Command.
        …
        ```

        **Примечание.** Пока коммутаторы S2 и S3 не перезагружены, в их консолях могут появляться сообщения %CDP-4-NATIVE_VLAN_MISMATCH: на сброшенном S1 собственная сеть VLAN порта — VLAN 1, а на их магистральных портах — по-прежнему VLAN 99.

        **Шаг 9.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым: после перезагрузки на это уходит около минуты. Коммутатор без загрузочной конфигурации после загрузки предлагает перейти в диалог начальной настройки (Would you like to enter the initial configuration dialog? [yes/no]:). В консоли S1 нажмите Enter: коммутатор повторит вопрос. Ответьте **no** и нажмите Enter еще раз. Приглашение теперь Switch>: имя устройства тоже было в удаленной конфигурации. Перейдите в привилегированный режим EXEC командой **enable** и убедитесь с помощью команды **show vlan brief**, что на коммутаторе остались только сети VLAN по умолчанию и все порты, включая F0/1 и F0/3, назначены сети VLAN 1.

        ```
        % Please answer 'yes' or 'no'.
        Would you like to enter the initial configuration dialog? [yes/no]: no


        Press RETURN to get started!

        Switch>enable
        Switch#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/6, Fa0/7, Fa0/8
                                                        Fa0/9, Fa0/10, Fa0/11, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
                                                        Fa0/17, Fa0/18, Fa0/19, Fa0/20
                                                        Fa0/21, Fa0/22, Fa0/23, Fa0/24
                                                        Gi0/1, Gi0/2
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```
    - title: "Проверка рассылки без сетей VLAN"
      body: |
        **Шаг 1.** В консоли S1 (приглашение Switch#) выведите список магистральных каналов командой **show interfaces trunk**. Вывод пуст: магистральных каналов между коммутаторами больше нет, и соединения между ними, как и порты компьютеров, — порты доступа сети VLAN 1.

        ```
        Switch#show interfaces trunk
        ```

        **Шаг 2.** Нажмите «Симуляция» вверху страницы. Нажмите «Пакет», выберите «Простой PDU — щёлкните источник и получателя» и щелкните на схеме компьютер PC1, а затем компьютер PC6.

        **Шаг 3.** Нажимайте «Шаг», пока кнопка не станет недоступной. Теперь ARP-запрос компьютера PC1 доходит до всех остальных компьютеров, PC2–PC9: каждый коммутатор рассылает его во все порты, кроме того, на котором кадр получен. Эхо-запрос по-прежнему ждет ARP-ответа.

        **Примечание.** Каждый компьютер подключен к своему порту коммутатора отдельным кабелем, поэтому кадры разных компьютеров не сталкиваются друг с другом. Широковещательный кадр, наоборот, коммутатор рассылает во все порты своей сети VLAN, а без сетей VLAN — во все порты всех коммутаторов сети.

        **Шаг 4.** Ответьте на вопросы 12 и 13 в форме ответов.
