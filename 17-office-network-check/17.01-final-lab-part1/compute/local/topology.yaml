    - title: "Начальное состояние"
      body: |
        - Маршрутизатор Edge-Router работает с параметрами по умолчанию: имя устройства не задано (приглашение Router>), паролей нет, интерфейсы выключены и не имеют адресов. Заданы только статические маршруты: маршрут по умолчанию через маршрутизатор ISP и маршруты к сетям коммутатора L3-SW1 через 10.10.10.2.
        - Маршрутизатор ISP и сервер Server настроены; сеть поставщика услуг знает маршруты к сетям предприятия.
        - На коммутаторе L3-SW1 заданы имя устройства и маршрут по умолчанию через маршрутизатор Edge-Router (10.10.10.1). Сети VLAN, интерфейсы SVI, агрегированные каналы и маршрутизация не настроены.
        - На коммутаторах Sw-A, Sw-B и Sw-C задано только имя устройства. Среди настроек коммутаторов есть одна, которая помешает образованию одного из агрегированных каналов: вам предстоит найти и устранить ее.
        - На компьютерах заданы IPv4-адреса и маски подсети по таблице адресации, но не заданы шлюзы по умолчанию.

        В начальном состоянии у компьютера WS-1-1 нет шлюза по умолчанию (**ipconfig** в приложении «Командная строка»), и эхо-запросы к серверу Server (**ping 209.165.201.10**) он отправить не может: «PING: transmit failed. General failure».

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:12FF:FE26:C001
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.10.11
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 0.0.0.0
        ```

        ```
        C:\>ping 209.165.201.10

        Pinging 209.165.201.10 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 209.165.201.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Базовая настройка маршрутизатора Edge-Router"
      body: |
        **Требование 1.** Имя устройства маршрутизатора — Edge-Router, по таблице адресации.

        **Требование 2.** Пароль привилегированного режима EXEC — Edgeenpa55, задан как секретный пароль (enable secret).

        **Требование 3.** Консольная линия требует при входе пароль Edgeconpa55.

        **Требование 4.** Линии VTY 0–4 требуют при входе пароль Edgevtypa55.

        **Требование 5.** Баннер MOTD предупреждает о запрете несанкционированного доступа.

        **Требование 6.** Пароли, которые хранятся в конфигурации открытым текстом, зашифрованы.

        **Требование 7.** Интерфейс G0/0/0 включен, имеет адрес 10.10.10.1 с маской 255.255.255.252 по таблице адресации и описание (например, к какому устройству он подключен).

        **Требование 8.** Интерфейс S0/1/0 включен, имеет адрес 209.165.200.225 с маской 255.255.255.252 и описание.

        **Требование 9.** Интерфейс G0/0/1 включен. На нем созданы подинтерфейсы G0/0/1.40, G0/0/1.50, G0/0/1.60 и G0/0/1.99 с инкапсуляцией 802.1Q (dot1Q) для сетей VLAN 40, 50, 60 и 99, адресами и масками по таблице адресации и описаниями; подинтерфейс G0/0/1.99 принимает кадры собственной VLAN магистрального канала без тега (параметр native).

        **Примечание.** Маршруты маршрутизатора уже заданы, менять их не нужно. Подинтерфейсы работают, только когда включен физический интерфейс.
    - title: "Настройка коммутатора Sw-C для удаленного управления"
      body: |
        **Требование 10.** Интерфейс управления коммутатора Sw-C — интерфейс VLAN 99 — включен и имеет адрес 192.168.99.2 с маской 255.255.255.0.

        **Требование 11.** Шлюз по умолчанию коммутатора Sw-C — 192.168.99.1 (подинтерфейс G0/0/1.99 маршрутизатора Edge-Router): коммутатор отвечает узлам других сетей.

        **Требование 12.** Пароль привилегированного режима EXEC коммутатора Sw-C — Edgeenpa55, задан как секретный пароль.

        **Требование 13.** На коммутаторе Sw-C настроен SSH: имя домена ccna-final.net, ключ RSA длиной не менее 2048 бит.

        **Требование 14.** На коммутаторе Sw-C создана учетная запись Admin1 с зашифрованным паролем Admin1pa55 (secret).

        **Требование 15.** Все линии VTY коммутатора Sw-C принимают только подключения по SSH и проверяют имя пользователя и пароль по локальным учетным записям.
    - title: "Создание сетей VLAN и назначение портов"
      body: |
        **Требование 16.** На коммутаторах L3-SW1, Sw-A и Sw-B созданы сети VLAN 10, 20 и 30 с именами из таблицы VLAN: Admin, Accounts и HR. На коммутаторе L3-SW1, кроме того, создана сеть VLAN 99 Management для его интерфейса управления.

        **Требование 17.** На коммутаторе Sw-C созданы сети VLAN 40 Sales, 50 Production, 60 Marketing и 99 Management.

        **Требование 18.** Порты коммутаторов Sw-A и Sw-B назначены сетям VLAN по таблице портов как порты доступа: F0/7–F0/12 — VLAN 10, F0/13–F0/18 — VLAN 20, F0/19–F0/24 — VLAN 30.

        **Требование 19.** Порты коммутатора Sw-C назначены сетям VLAN по таблице портов как порты доступа: F0/1–F0/5 — VLAN 40, F0/6–F0/10 — VLAN 50, F0/11–F0/15 — VLAN 60, F0/24 — VLAN 99.

        **Примечание.** Имена сетей VLAN чувствительны к регистру и должны совпадать с таблицей точно.
    - title: "Настройка агрегированных и магистральных каналов"
      body: |
        **Требование 20.** Агрегированные каналы созданы по таблице каналов: Port-channel 1 между L3-SW1 (G1/0/1, G1/0/2) и Sw-A (G0/1, G0/2), Port-channel 2 между L3-SW1 (G1/0/3, G1/0/4) и Sw-B (G0/1, G0/2), Port-channel 3 между Sw-A и Sw-B (F0/5, F0/6 на обоих). Каналы используют протокол LACP, и оба конца каждого канала инициируют согласование (режим active).

        **Требование 21.** Порты, входящие в агрегированные каналы, и интерфейсы Port-channel работают в режиме магистрального канала (trunk), заданном статически, а согласование по протоколу DTP на них выключено.

        **Требование 22.** Все три агрегированных канала образованы и работают с обоими портами: все порты каналов административно включены. Неполадка, которая мешает одному из них, найдена и устранена.

        **Требование 23.** Порт G0/1 коммутатора Sw-C, подключенный к маршрутизатору Edge-Router, работает в режиме магистрального канала, заданном статически; его собственная VLAN (native VLAN) — 99; согласование по протоколу DTP выключено.

        **Примечание.** Режим магистрального канала и выключение DTP задают и на портах, входящих в канал, и на интерфейсе Port-channel: интерфейс Port-channel появляется, когда первый порт получает номер группы каналов.
    - title: "Настройка маршрутизации между VLAN"
      body: |
        **Требование 24.** На коммутаторе L3-SW1 включена маршрутизация IPv4.

        **Требование 25.** Порт G1/1/1 коммутатора L3-SW1, подключенный к маршрутизатору Edge-Router, работает как маршрутизируемый порт (не коммутируемый) и имеет адрес 10.10.10.2 с маской 255.255.255.252.

        **Требование 26.** На коммутаторе L3-SW1 включены интерфейсы VLAN 10, 20, 30 и 99 с адресами 192.168.10.1, 192.168.20.1, 192.168.30.1 и 192.168.100.1 и маской 255.255.255.0 по таблице адресации: они служат шлюзами по умолчанию для своих сетей.

        **Требование 27.** Маршрутизация между сетями VLAN коммутатора Sw-C выполняется маршрутизатором Edge-Router через подинтерфейсы G0/0/1.40, G0/0/1.50, G0/0/1.60 и G0/0/1.99 (Требование 9).

        **Требование 28.** У каждого компьютера шлюз по умолчанию — адрес интерфейса, который служит шлюзом его сети VLAN: для WS-1-1 — WS-1-6 это интерфейс VLAN коммутатора L3-SW1, для WS-2-1 — WS-2-3 и Management-PC — подинтерфейс маршрутизатора Edge-Router в их сети (адрес .1 сети каждого компьютера).
    - title: "Проверка связи"
      body: |
        Когда все требования выполнены, дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым, и проверьте результат. Первые эхо-запросы каждой проверки могут остаться без ответа: в это время устройства определяют MAC-адреса друг друга по протоколу ARP.

        **Шаг 1.** Компьютер WS-1-1 получает ответы от компьютера WS-1-6 другой сети VLAN (**ping 192.168.30.16** в приложении «Командная строка»): пакеты проходят через коммутатор L3-SW1 (TTL=127).

        ```
        C:\>ping 192.168.30.16

        Pinging 192.168.30.16 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.16: bytes=32 time=1ms TTL=127
        Reply from 192.168.30.16: bytes=32 time=1ms TTL=127
        Reply from 192.168.30.16: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.30.16:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** Компьютер WS-1-4 получает ответы от компьютера WS-2-1 (**ping 192.168.40.11**): пакеты проходят через коммутатор L3-SW1 и маршрутизатор Edge-Router (TTL=126).

        ```
        C:\>ping 192.168.40.11

        Pinging 192.168.40.11 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 192.168.40.11: bytes=32 time=2ms TTL=126
        Reply from 192.168.40.11: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.40.11:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 3.** Компьютер WS-2-1 получает ответы от сервера Server (**ping 209.165.201.10**).

        ```
        C:\>ping 209.165.201.10

        Pinging 209.165.201.10 with 32 bytes of data:

        Request timed out.
        Reply from 209.165.201.10: bytes=32 time=1ms TTL=126
        Reply from 209.165.201.10: bytes=32 time=1ms TTL=126
        Reply from 209.165.201.10: bytes=32 time=1ms TTL=126

        Ping statistics for 209.165.201.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 4.** Компьютер Management-PC получает ответы от компьютера WS-1-1 (**ping 192.168.10.11**).

        ```
        C:\>ping 192.168.10.11

        Pinging 192.168.10.11 with 32 bytes of data:

        Reply from 192.168.10.11: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.11: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.11: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.11: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.10.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 5.** С компьютера Management-PC к коммутатору Sw-C можно подключиться по протоколу SSH под учетной записью Admin1 (**ssh -l Admin1 192.168.99.2**, пароль Admin1pa55 не отображается): открывается пользовательский режим EXEC с приглашением Sw-C>. Выведите состояние интерфейса управления командой **show ip interface brief | include Vlan**: у интерфейса Vlan99 адрес 192.168.99.2 и состояние up. Сеанс завершает команда **exit**.

        ```
        C:\>ssh -l Admin1 192.168.99.2
        Password:
        Sw-C>show ip interface brief | include Vlan
        Vlan1                      unassigned      YES unset  administratively down down
        Vlan99                     192.168.99.2    YES manual up                    up
        Sw-C>exit


        [Connection to 192.168.99.2 closed by foreign host]
        ```

        **Шаг 6.** На коммутаторе L3-SW1 команда **show etherchannel summary** показывает каналы Po1 и Po2 в состоянии SU (уровень 2, в работе) с протоколом LACP и обоими портами в состоянии P (объединены в канал).

        ```
        L3-SW1>show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 2
        Number of aggregators:           2

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        1      Po1(SU)         LACP      Gi1/0/1(P)  Gi1/0/2(P)
        2      Po2(SU)         LACP      Gi1/0/3(P)  Gi1/0/4(P)
        ```

        **Шаг 7.** На коммутаторе Sw-A та же команда показывает каналы Po1 и Po3 с обоими портами в состоянии P, а команда **show interfaces trunk** — оба канала в режиме магистрального канала.

        ```
        Sw-A>show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 2
        Number of aggregators:           2

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        1      Po1(SU)         LACP      Gi0/1(P)    Gi0/2(P)
        3      Po3(SU)         LACP      Fa0/5(P)    Fa0/6(P)
        ```

        ```
        Sw-A>show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Po1         on               802.1q         trunking      1
        Po3         on               802.1q         trunking      1

        Port        Vlans allowed on trunk
        Po1         1-4094
        Po3         1-4094

        Port        Vlans allowed and active in management domain
        Po1         1,10,20,30,1002-1005
        Po3         1,10,20,30,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Po1         1,10,20,30,1002-1005
        Po3         1002-1005
        ```

        **Шаг 8.** Путь от компьютера WS-1-1 к компьютеру WS-2-1 (**tracert 192.168.40.11**) проходит через интерфейс VLAN 10 коммутатора L3-SW1 и интерфейс G0/0/0 маршрутизатора Edge-Router.

        ```
        C:\>tracert 192.168.40.11

        Tracing route to 192.168.40.11 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  192.168.10.1
          2     1 ms     1 ms     1 ms  10.10.10.1
          3     1 ms     1 ms     1 ms  192.168.40.11

        Trace complete.
        ```
