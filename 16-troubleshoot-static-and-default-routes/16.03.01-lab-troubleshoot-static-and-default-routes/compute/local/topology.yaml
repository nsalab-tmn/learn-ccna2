scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Последовательный | R1 | S0/0/0 | R2 | S0/0/0 |
        | Последовательный | R2 | S0/0/1 | R3 | S0/0/1 |
        | Медный | R1 | G0/0 | S1 | G0/1 |
        | Медный | R2 | G0/0 | S2 | G0/1 |
        | Медный | R3 | G0/0 | S3 | G0/1 |
        | Медный | PC1 | F0 | S1 | F0/1 |
        | Медный | PC2 | F0 | S2 | F0/1 |
        | Медный | Server | F0 | S3 | F0/1 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети или длина префикса | Шлюз по умолчанию |
        |---|---|---|---|---|
        | R1 | G0/0 | 172.31.1.1, 2001:db8:1::1 | 255.255.255.128, /64 | — |
        | R1 | S0/0/0 | 172.31.1.194, 2001:db8:2::194 | 255.255.255.252, /64 | — |
        | R2 | G0/0 | 172.31.0.1, 2001:db8:3::1 | 255.255.255.0, /64 | — |
        | R2 | S0/0/0 | 172.31.1.193, 2001:db8:2::193 | 255.255.255.252, /64 | — |
        | R2 | S0/0/1 | 172.31.1.197, 2001:db8:4::197 | 255.255.255.252, /64 | — |
        | R3 | G0/0 | 172.31.1.129, 2001:db8:5::1 | 255.255.255.192, /64 | — |
        | R3 | S0/0/1 | 172.31.1.198, 2001:db8:4::198 | 255.255.255.252, /64 | — |
        | PC1 | NIC | 172.31.1.126, 2001:db8:1::126 | 255.255.255.128, /64 | 172.31.1.1, 2001:db8:1::1 |
        | PC2 | NIC | 172.31.0.254, 2001:db8:3::254 | 255.255.255.0, /64 | 172.31.0.1, 2001:db8:3::1 |
        | Server | NIC | 172.31.1.190, 2001:db8:5::190 | 255.255.255.192, /64 | 172.31.1.129, 2001:db8:5::1 |

        Проект статической маршрутизации — какие статические маршруты должны быть на каждом маршрутизаторе и какого они вида:

        | Маршрутизатор | Протокол | Сеть назначения | Вид маршрута |
        |---|---|---|---|
        | R1 | IPv4 | все остальные сети (маршрут по умолчанию) | маршрут следующего перехода |
        | R1 | IPv6 | все остальные сети (маршрут по умолчанию) | маршрут следующего перехода |
        | R2 | IPv4 | локальная сеть маршрутизатора R1 | маршрут следующего перехода |
        | R2 | IPv4 | локальная сеть маршрутизатора R3 | маршрут следующего перехода |
        | R2 | IPv6 | локальная сеть маршрутизатора R1 | маршрут следующего перехода |
        | R2 | IPv6 | локальная сеть маршрутизатора R3 | маршрут следующего перехода |
        | R3 | IPv4 | локальная сеть маршрутизатора R2 | напрямую подключенный |
        | R3 | IPv4 | локальная сеть маршрутизатора R1 | напрямую подключенный |
        | R3 | IPv4 | сеть канала между R1 и R2 | напрямую подключенный |
        | R3 | IPv6 | локальная сеть маршрутизатора R1 | маршрут следующего перехода |
        | R3 | IPv6 | локальная сеть маршрутизатора R2 | маршрут следующего перехода |

        Маршрут следующего перехода указывает адрес следующего перехода, а напрямую подключенный маршрут — выходной интерфейс. Адреса сетей назначения, следующие переходы и выходные интерфейсы определяются по таблице адресации.
    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы R1, R2 и R3 настроены: на их интерфейсах заданы IPv4- и IPv6-адреса по таблице адресации, интерфейсы включены, а маршруты между локальными сетями заданы статически.
        - На коммутаторах S1, S2 и S3 задано только имя устройства.
        - На компьютерах PC1, PC2 и сервере Server заданы IPv4- и IPv6-адреса, маски подсети, длины префиксов и шлюзы по умолчанию по таблице адресации.
        - Статические маршруты настраивал недавно нанятый специалист, и в них есть ошибки: локальные сети не связаны между собой. Сколько ошибок и на каких маршрутизаторах они находятся, вам предстоит выяснить.

        После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях). Компьютер PC1 не получает ответов от сервера Server по IPv6 (**ping 2001:db8:5::190** в приложении «Командная строка»):

        ```
        C:\>ping 2001:db8:5::190

        Pinging 2001:DB8:5::190 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 2001:DB8:5::190:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для поиска и устранения неполадок вы выбираете сами. Найдите и устраните все ошибки так, чтобы выполнялись все требования.
    - title: "Поиск неполадок"
      body: |
        **Требование 1.** Для каждой неполадки статической маршрутизации известно, на каком маршрутизаторе она находится, в чем она состоит и как ее устранить. Неполадки находят, сравнивая конфигурацию и таблицы маршрутизации маршрутизаторов с таблицей адресации и проектом статической маршрутизации и проверяя связь между локальными сетями эхо-запросами и трассировкой маршрута.

        **Примечание.** Статический маршрут попадает в таблицу маршрутизации, только если маршрутизатор может им воспользоваться: адрес следующего перехода достижим (в этой лабораторной работе — принадлежит одной из подключенных к маршрутизатору сетей), а выходной интерфейс подключен и включен. Маршрут, который этому условию не отвечает, остается в конфигурации, но в таблице маршрутизации его нет. Поэтому неполадку выдает и маршрут, которого нет в таблице маршрутизации, и маршрут, который в ней есть, но ведет не туда.
    - title: "Устранение неполадок"
      body: |
        **Требование 2.** На каждом маршрутизаторе настроены статические маршруты из проекта статической маршрутизации, по одному к каждой сети назначения, и других статических маршрутов нет. Неверный маршрут удален, а не просто дополнен верным: если неверный маршрут уже есть в таблице маршрутизации, маршрут к той же сети, добавленный рядом с ним, неполадку не устраняет.

        **Требование 3.** Сеть назначения каждого маршрута задана адресом сети и маской подсети IPv4 или префиксом IPv6 этой сети по таблице адресации. Маршрут IPv4 по умолчанию ведет к сети 0.0.0.0 с маской 0.0.0.0, а маршрут IPv6 по умолчанию — к префиксу ::/0.

        **Требование 4.** Маршрут следующего перехода указывает только адрес следующего перехода: IPv4-адрес или глобальный индивидуальный адрес (GUA) IPv6 интерфейса соседнего маршрутизатора на последовательном канале, который ведет к сети назначения. Напрямую подключенный маршрут указывает только выходной интерфейс — последовательный интерфейс маршрутизатора, подключенный к такому каналу. Административное расстояние в маршрутах не задается.
    - title: "Проверка связи"
      body: |
        Когда все требования выполнены, проверьте результат. Первый эхо-запрос проверки может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с сервером Server командой **ping 172.31.1.190**. Сервер отвечает. Значение TTL=125 показывает, что ответ прошел через три маршрутизатора.

        ```
        C:\>ping 172.31.1.190

        Pinging 172.31.1.190 with 32 bytes of data:

        Request timed out.
        Reply from 172.31.1.190: bytes=32 time=2ms TTL=125
        Reply from 172.31.1.190: bytes=32 time=2ms TTL=125
        Reply from 172.31.1.190: bytes=32 time=2ms TTL=125

        Ping statistics for 172.31.1.190:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Проверьте связь с сервером по IPv6 командой **ping 2001:db8:5::190**. Сервер отвечает по IPv6.

        ```
        C:\>ping 2001:db8:5::190

        Pinging 2001:DB8:5::190 with 32 bytes of data:

        Reply from 2001:DB8:5::190: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:5::190: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:5::190: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:5::190: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:5::190:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 3.** Откройте окно компьютера PC2 и в приложении «Командная строка» проверьте связь с компьютером PC1 командой **ping 172.31.1.126**. Компьютер PC1 отвечает. Значение TTL=126 показывает, что ответ прошел через два маршрутизатора.

        ```
        C:\>ping 172.31.1.126

        Pinging 172.31.1.126 with 32 bytes of data:

        Reply from 172.31.1.126: bytes=32 time=2ms TTL=126
        Reply from 172.31.1.126: bytes=32 time=2ms TTL=126
        Reply from 172.31.1.126: bytes=32 time=2ms TTL=126
        Reply from 172.31.1.126: bytes=32 time=2ms TTL=126

        Ping statistics for 172.31.1.126:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** Проверьте связь с компьютером PC1 по IPv6 командой **ping 2001:db8:1::126**. Компьютер PC1 отвечает по IPv6.

        ```
        C:\>ping 2001:db8:1::126

        Pinging 2001:DB8:1::126 with 32 bytes of data:

        Reply from 2001:DB8:1::126: bytes=32 time=2ms TTL=126
        Reply from 2001:DB8:1::126: bytes=32 time=2ms TTL=126
        Reply from 2001:DB8:1::126: bytes=32 time=2ms TTL=126
        Reply from 2001:DB8:1::126: bytes=32 time=2ms TTL=126

        Ping statistics for 2001:DB8:1::126:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 5.** Аналогично убедитесь, что компьютер PC2 получает ответы от сервера Server (172.31.1.190 и 2001:db8:5::190), сервер Server — от компьютеров PC1 (172.31.1.126 и 2001:db8:1::126) и PC2 (172.31.0.254 и 2001:db8:3::254), а компьютер PC1 — от компьютера PC2. Все три локальные сети связаны между собой по IPv4 и IPv6.
