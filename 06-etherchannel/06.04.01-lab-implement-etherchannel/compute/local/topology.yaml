scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | SWA | G0/1 | SWB | G0/1 |
        | Медный | SWA | G0/2 | SWB | G0/2 |
        | Медный | SWA | F0/21 | SWC | F0/21 |
        | Медный | SWA | F0/22 | SWC | F0/22 |
        | Медный | SWB | F0/23 | SWC | F0/23 |
        | Медный | SWB | F0/24 | SWC | F0/24 |

        | Агрегированный канал | Коммутаторы | Порты | Протокол |
        |---|---|---|---|
        | Port-channel 1 | SWA — SWB | G0/1, G0/2 | PAgP |
        | Port-channel 2 | SWA — SWC | F0/21, F0/22 | LACP |
        | Port-channel 3 | SWB — SWC | F0/23, F0/24 | LACP |

        IP-адресов в этой лабораторной работе нет.
    - title: "Начальное состояние"
      body: |
        - Коммутаторы SWA, SWB и SWC размещены на схеме, но не соединены кабелями.
        - Коммутаторы не настроены: все их параметры имеют значения по умолчанию. Имя устройства в ОС тоже не задано, поэтому в консоли каждого коммутатора приглашение Switch>, а имена SWA, SWB и SWC показаны только на схеме.

        В начальном состоянии на коммутаторах нет ни одного агрегированного канала (**show etherchannel summary** в консоли коммутатора SWA):

        ```
        Switch>enable
        Switch#show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 0
        Number of aggregators:           0

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Соединение коммутаторов"
      body: |
        **Требование 1.** Коммутаторы соединены шестью кабелями по таблице соединений: SWA G0/1 — SWB G0/1 и SWA G0/2 — SWB G0/2, SWA F0/21 — SWC F0/21 и SWA F0/22 — SWC F0/22, SWB F0/23 — SWC F0/23 и SWB F0/24 — SWC F0/24. Каждый кабель — медный перекрестный («Медный перекрёстный» в окне выбора кабеля): так соединяют два коммутатора.

        **Примечание.** Когда соединение установлено, индикаторы на обоих концах кабеля горят зеленым. Если тип кабеля не подходит к портам, соединение не устанавливается и индикаторы остаются красными.
    - title: "Настройка магистральных каналов"
      body: |
        **Требование 2.** Все двенадцать портов, которыми соединены коммутаторы, — G0/1, G0/2, F0/21 и F0/22 коммутатора SWA, G0/1, G0/2, F0/23 и F0/24 коммутатора SWB, F0/21–F0/24 коммутатора SWC, — статически работают в режиме магистрального канала (trunk) — независимо от режима соседнего порта.
    - title: "Настройка агрегированного канала PAgP"
      body: |
        **Требование 3.** Порты G0/1 и G0/2 коммутаторов SWA и SWB объединены в агрегированный канал Port-channel 1 (группа каналов 1) по протоколу PAgP.

        **Требование 4.** Порты агрегированного канала Port-channel 1 на обоих коммутаторах, SWA и SWB, работают в режиме desirable протокола PAgP, в котором коммутатор сам предлагает соседу образовать агрегированный канал.

        **Примечание.** Порты одного агрегированного канала должны быть настроены одинаково: с одним и тем же режимом магистрального канала, скоростью и дуплексом. Порт с другими параметрами коммутатор в агрегированный канал не включает.
    - title: "Настройка агрегированных каналов LACP"
      body: |
        **Требование 5.** Порты F0/21 и F0/22 коммутаторов SWA и SWC объединены в агрегированный канал Port-channel 2 (группа каналов 2) по протоколу LACP. Порты обоих коммутаторов работают в режиме active протокола LACP, в котором коммутатор сам предлагает соседу образовать агрегированный канал.

        **Требование 6.** Порты F0/23 и F0/24 коммутаторов SWB и SWC объединены в агрегированный канал Port-channel 3 (группа каналов 3) по протоколу LACP. Порты коммутатора SWC работают в режиме active, а порты коммутатора SWB — в режиме passive протокола LACP: SWB сам согласование не начинает и только отвечает на предложение соседа.

        **Примечание.** LACP описан стандартом IEEE 802.3ad и поддерживается коммутаторами разных производителей, а PAgP — протокол одного производителя. Друг с другом эти протоколы не работают, поэтому оба конца агрегированного канала должны использовать один и тот же протокол.
    - title: "Проверка агрегированных каналов"
      body: |
        После настройки подождите около 30 секунд: за это время протокол STP переводит агрегированные каналы в состояние пересылки. Затем проверьте результат.

        **Шаг 1.** В консоли коммутатора SWA выведите сведения об агрегированных каналах командой **show etherchannel summary**. Работают два агрегированных канала второго уровня, Po1 по протоколу PAgP и Po2 по протоколу LACP, с флагами (SU), и каждый из портов G0/1, G0/2, F0/21 и F0/22 входит в свой канал с флагом (P).

        ```
        Switch#show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 2
        Number of aggregators:           2

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        1      Po1(SU)         PAgP      Gi0/1(P)    Gi0/2(P)
        2      Po2(SU)         LACP      Fa0/21(P)   Fa0/22(P)
        ```

        **Шаг 2.** Аналогично проверьте коммутаторы SWB и SWC: на SWB работают каналы Po1 (PAgP) и Po3 (LACP), на SWC — Po2 и Po3 (LACP), у всех каналов флаги (SU), а у портов — (P).

        **Шаг 3.** В консоли коммутатора SWA выведите сведения о магистральных каналах командой **show interfaces trunk**. Магистральными каналами работают сами агрегированные каналы Po1 и Po2, а не отдельные порты.

        ```
        Switch#show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Po1         on               802.1q         trunking      1
        Po2         on               802.1q         trunking      1

        Port        Vlans allowed on trunk
        Po1         1-4094
        Po2         1-4094

        Port        Vlans allowed and active in management domain
        Po1         1,1002-1005
        Po2         1,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Po1         1,1002-1005
        Po2         1,1002-1005
        ```

        **Шаг 4.** Выведите те же сведения на коммутаторе SWB командой **show interfaces trunk**. В последней таблице у канала Po1 нет сети VLAN 1: протокол STP заблокировал этот агрегированный канал для сети VLAN 1.

        ```
        Switch#show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Po1         on               802.1q         trunking      1
        Po3         on               802.1q         trunking      1

        Port        Vlans allowed on trunk
        Po1         1-4094
        Po3         1-4094

        Port        Vlans allowed and active in management domain
        Po1         1,1002-1005
        Po3         1,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Po1         1002-1005
        Po3         1,1002-1005
        ```

        **Примечание.** Три агрегированных канала соединяют коммутаторы в кольцо, и протокол STP разрывает петлю, блокируя один из них. Агрегированный канал STP блокирует целиком, как один порт, а не отдельные кабели внутри него.
