        | Медный | S3 | F0/24 | S4 | F0/24 |

        | Агрегированный канал | Коммутаторы | Порты | Протокол |
        |---|---|---|---|
        | Port-channel 1 | S1 — S3 | G0/1, G0/2 | LACP |
        | Port-channel 2 | S2 — S4 | G0/1, G0/2 | LACP |
        | Port-channel 3 | S1 — S2 | F0/23, F0/24 | LACP |
        | Port-channel 4 | S3 — S4 | F0/23, F0/24 | LACP |
        | Port-channel 5 | S1 — S4 | F0/21, F0/22 | LACP |
        | Port-channel 6 | S2 — S3 | F0/21, F0/22 | LACP |

        IP-адресов в этой лабораторной работе нет.
    - title: "Начальное состояние"
      body: |
        - Коммутаторы S1–S4 соединены кабелями по таблице соединений.
        - На каждом коммутаторе задано имя устройства, а для портов между коммутаторами заданы режим порта и группа каналов. Остальные параметры имеют значения по умолчанию.
        - Настройку выполнял младший специалист, и в ней есть ошибки: агрегированные каналы работают не так, как указано в таблице агрегированных каналов. Сколько ошибок и на каких коммутаторах они находятся, вам предстоит выяснить.

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для поиска и устранения неполадок вы выбираете сами. Найдите и устраните все ошибки так, чтобы выполнялись все требования.
    - title: "Устранение неполадок режима портов"
      body: |
        **Требование 1.** На каждом коммутаторе все шесть портов, которыми он соединен с другими коммутаторами, работают в режиме магистрального канала (trunk), заданном статически: режим этих портов — trunk, а не access и не режим согласования по протоколу DTP. Тот же режим задан на интерфейсах Port-channel, которые образуют эти порты.

        **Примечание.** Порты одного агрегированного канала должны быть настроены одинаково, а оба конца канала — работать в одном режиме. Порт доступа (access) передает кадры только одной сети VLAN, поэтому агрегированный канал, который должен передавать все сети VLAN, на нем не работает как магистральный канал.
    - title: "Устранение неполадок распределения портов по группам каналов"
      body: |
        **Требование 2.** Порты каждого коммутатора входят в группы каналов по таблице агрегированных каналов: номер группы порта совпадает с номером агрегированного канала, к которому ведет его кабель. Например, порты G0/1 и G0/2 коммутатора S1 входят в группу 1, потому что их кабели ведут к коммутатору S3 и образуют Port-channel 1.

        **Примечание.** Все порты одной группы каналов должны вести к одному и тому же соседу. Порт, кабель которого ведет к другому коммутатору, чем у остальных портов группы, в агрегированный канал не включается.
    - title: "Устранение неполадок протокола согласования"
      body: |
        **Требование 3.** Все порты агрегированных каналов на всех коммутаторах согласуют канал по протоколу LACP в режиме active, в котором коммутатор сам предлагает соседу образовать агрегированный канал.

        **Примечание.** Протоколы LACP и PAgP друг с другом не работают: если один конец агрегированного канала согласует его по LACP, а другой — по PAgP, порты не объединяются и работают как отдельные каналы.
    - title: "Проверка агрегированных каналов"
      body: |
        После исправлений подождите около 30 секунд: за это время протокол STP переводит агрегированные каналы в состояние пересылки. Затем проверьте результат.

        **Шаг 1.** В консоли коммутатора S1 выведите сведения об агрегированных каналах командой **show etherchannel summary**. Работают три агрегированных канала второго уровня по протоколу LACP, Po1, Po3 и Po5, с флагами (SU), и все шесть портов входят в свои каналы с флагом (P).

        ```
        S1>enable
        S1#show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 3
        Number of aggregators:           3

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        1      Po1(SU)         LACP      Gi0/1(P)    Gi0/2(P)
        3      Po3(SU)         LACP      Fa0/23(P)   Fa0/24(P)
        5      Po5(SU)         LACP      Fa0/21(P)   Fa0/22(P)
        ```

        **Шаг 2.** Аналогично проверьте коммутаторы S2, S3 и S4. На каждом работают три агрегированных канала по таблице агрегированных каналов (на S2 — Po2, Po3 и Po6, на S3 — Po1, Po4 и Po6, на S4 — Po2, Po4 и Po5), все по протоколу LACP и с флагами (SU), а их порты — с флагом (P).

        **Шаг 3.** В консоли коммутатора S1 выведите сведения о магистральных каналах командой **show interfaces trunk**. Магистральными каналами работают сами агрегированные каналы Po1, Po3 и Po5, а не отдельные порты, в режиме on, то есть заданном статически.

        ```
        S1#show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Po1         on               802.1q         trunking      1
        Po3         on               802.1q         trunking      1
        Po5         on               802.1q         trunking      1

        Port        Vlans allowed on trunk
        Po1         1-4094
        Po3         1-4094
        Po5         1-4094

        Port        Vlans allowed and active in management domain
        Po1         1,1002-1005
        Po3         1,1002-1005
        Po5         1,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Po1         1,1002-1005
        Po3         1002-1005
        Po5         1,1002-1005
        ```

        **Примечание.** Шесть агрегированных каналов соединяют четыре коммутатора в несколько колец, и протокол STP разрывает петли, блокируя часть каналов для сети VLAN 1. Поэтому в последней таблице вывода у некоторых каналов нет сети VLAN 1: на S1 это Po3. Агрегированный канал STP блокирует целиком, как один порт, а не отдельные кабели внутри него.
