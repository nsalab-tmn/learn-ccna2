    - title: "Начальное состояние"
      body: |
        - Коммутаторы S1, S2 и S3 соединены кабелями по таблице соединений, но не настроены: все их параметры имеют значения по умолчанию. Имя устройства в ОС тоже не задано, поэтому в консоли каждого коммутатора приглашение Switch>, а имена S1, S2 и S3 показаны только на схеме.
        - Порты, которыми соединены коммутаторы, работают в режиме dynamic auto протокола DTP: в этом режиме порт сам не предлагает соседу образовать магистральный канал (trunk), поэтому два таких порта остаются портами доступа сети VLAN 1.

        **Шаг 1.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Выведите сведения о магистральных каналах командой **show interfaces trunk**. Команда ничего не выводит: ни один порт коммутатора не работает магистральным каналом.

        ```
        Switch>enable
        Switch#show interfaces trunk
        ```

        **Шаг 3.** Выведите сведения об агрегированных каналах командой **show etherchannel summary**. Под заголовком таблицы нет ни одной строки: на коммутаторе нет ни одного агрегированного канала (Number of channel-groups in use: 0).

        ```
        Switch#show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 0
        Number of aggregators:           0

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        ```
    - title: "Базовая настройка коммутаторов"
      body: |
        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal** и задайте имя устройства командой **hostname S1**.

        **Шаг 2.** Перейдите к настройке сразу четырех портов, которыми коммутатор S1 соединен с коммутаторами S3 и S2, командой **interface range f0/21 - 22 , g0/1 - 2**. Переведите порты в режим магистрального канала (trunk) командой **switchport mode trunk** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#hostname S1
        S1(config)#interface range f0/21 - 22 , g0/1 - 2
        S1(config-if-range)#switchport mode trunk
        S1(config-if-range)#end
        *Mar  1 00:00:49.879: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Команда **switchport mode trunk** включает магистральный канал статически: порт работает магистральным каналом независимо от режима соседнего порта. Порты, которые затем объединяются в агрегированный канал, должны быть настроены одинаково — с одним и тем же режимом магистрального канала, скоростью и дуплексом, — иначе коммутатор не включит их в агрегированный канал.

        **Шаг 3.** Откройте консоль коммутатора S2, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Настройте коммутатор так же: имя устройства **hostname S2** и режим магистрального канала на портах G0/1, G0/2, F0/23 и F0/24, к которым подключены коммутаторы S1 и S3 (**interface range g0/1 - 2 , f0/23 - 24**).

        ```
        Switch>enable
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#hostname S2
        S2(config)#interface range g0/1 - 2 , f0/23 - 24
        S2(config-if-range)#switchport mode trunk
        S2(config-if-range)#end
        *Mar  1 00:01:09.959: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Аналогично настройте коммутатор S3: имя устройства **hostname S3** и режим магистрального канала на портах F0/21–F0/24 (**interface range f0/21 - 24**).

        ```
        Switch>enable
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#hostname S3
        S3(config)#interface range f0/21 - 24
        S3(config-if-range)#switchport mode trunk
        S3(config-if-range)#end
        *Mar  1 00:01:30.043: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** В консоли коммутатора S1 проверьте магистральные каналы командой **show interfaces trunk**. Все четыре порта, F0/21, F0/22, G0/1 и G0/2, работают магистральными каналами (столбец «Status» — trunking), включенными статически (столбец «Mode» — on). Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S1#.

        ```
        S1#show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Fa0/21      on               802.1q         trunking      1
        Fa0/22      on               802.1q         trunking      1
        Gi0/1       on               802.1q         trunking      1
        Gi0/2       on               802.1q         trunking      1

        Port        Vlans allowed on trunk
        Fa0/21      1-4094
        Fa0/22      1-4094
        Gi0/1       1-4094
        Gi0/2       1-4094

        Port        Vlans allowed and active in management domain
        Fa0/21      1,1002-1005
        Fa0/22      1,1002-1005
        Gi0/1       1,1002-1005
        Gi0/2       1,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Fa0/21      1,1002-1005
        Fa0/22      1,1002-1005
        Gi0/1       1,1002-1005
        Gi0/2       1,1002-1005
        ```
    - title: "Настройка агрегированного канала PAgP"
      body: |
        **Примечание.** Перед объединением в агрегированный канал порты отключают, а после настройки включают снова. Иначе механизм защиты от ошибок настройки EtherChannel может обнаружить несогласованные порты, пока настройка не закончена, и перевести их в состояние err-disabled.

        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке портов F0/21 и F0/22 командой **interface range f0/21 - 22**. Отключите порты командой **shutdown**.

        **Шаг 2.** Объедините порты в группу каналов 1 по протоколу PAgP в режиме desirable командой **channel-group 1 mode desirable**. В режиме desirable коммутатор сам предлагает соседу образовать агрегированный канал. Коммутатор создает логический интерфейс агрегированного канала и сообщает об этом: «Creating a port-channel interface Port-channel 1». В выводе команд этот интерфейс обозначается Po1.

        **Шаг 3.** Включите порты командой **no shutdown**.

        **Шаг 4.** Перейдите к настройке созданного интерфейса командой **interface port-channel 1**, переведите его в режим магистрального канала (trunk) командой **switchport mode trunk** и вернитесь в привилегированный режим EXEC командой **end**. Порты F0/21 и F0/22 включились, но сам интерфейс Port-channel1 на коммутаторе S1 пока не включается: коммутатор S3 еще не настроен.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#interface range f0/21 - 22
        S1(config-if-range)#shutdown
        *Mar  1 00:01:45.603: %LINK-5-CHANGED: Interface FastEthernet0/21, changed state to administratively down
        *Mar  1 00:01:45.603: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/21, changed state to down
        *Mar  1 00:01:45.603: %LINK-5-CHANGED: Interface FastEthernet0/22, changed state to administratively down
        *Mar  1 00:01:45.603: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/22, changed state to down
        S1(config-if-range)#channel-group 1 mode desirable
        Creating a port-channel interface Port-channel 1
        S1(config-if-range)#no shutdown
        S1(config-if-range)#
        *Mar  1 00:01:54.838: %LINK-3-UPDOWN: Interface FastEthernet0/21, changed state to up
        S1(config-if-range)#
        *Mar  1 00:01:54.838: %LINK-3-UPDOWN: Interface FastEthernet0/22, changed state to up
        S1(config-if-range)#
        *Mar  1 00:01:55.838: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/21, changed state to up
        S1(config-if-range)#
        *Mar  1 00:01:55.838: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/22, changed state to up
        S1(config-if-range)#interface port-channel 1
        S1(config-if)#switchport mode trunk
        S1(config-if)#end
        *Mar  1 00:02:08.136: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** В консоли коммутатора S3 выполните те же команды: отключите порты F0/21 и F0/22, объедините их в группу каналов 1 командой **channel-group 1 mode desirable**, включите их и переведите интерфейс Port-channel 1 в режим магистрального канала. После команды **no shutdown** появляются сообщения о том, что интерфейс Port-channel1 включился (changed state to up): коммутаторы S1 и S3 договорились об агрегированном канале по протоколу PAgP.

        ```
        S3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S3(config)#interface range f0/21 - 22
        S3(config-if-range)#shutdown
        *Mar  1 00:02:20.483: %LINK-5-CHANGED: Interface FastEthernet0/21, changed state to administratively down
        *Mar  1 00:02:20.483: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/21, changed state to down
        *Mar  1 00:02:20.483: %LINK-5-CHANGED: Interface FastEthernet0/22, changed state to administratively down
        *Mar  1 00:02:20.483: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/22, changed state to down
        S3(config-if-range)#channel-group 1 mode desirable
        Creating a port-channel interface Port-channel 1
        S3(config-if-range)#no shutdown
        S3(config-if-range)#
        *Mar  1 00:02:29.715: %LINK-3-UPDOWN: Interface FastEthernet0/21, changed state to up
        S3(config-if-range)#
        *Mar  1 00:02:29.715: %LINK-3-UPDOWN: Interface FastEthernet0/22, changed state to up
        S3(config-if-range)#
        *Mar  1 00:02:30.715: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/21, changed state to up
        S3(config-if-range)#
        *Mar  1 00:02:30.715: %LINK-3-UPDOWN: Interface Port-channel1, changed state to up
        S3(config-if-range)#
        *Mar  1 00:02:30.715: %LINEPROTO-5-UPDOWN: Line protocol on Interface Port-channel1, changed state to up
        S3(config-if-range)#
        *Mar  1 00:02:30.715: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/22, changed state to up
        S3(config-if-range)#interface port-channel 1
        S3(config-if)#switchport mode trunk
        S3(config-if)#end
        *Mar  1 00:02:42.981: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 6.** В консоли коммутатора S1 проверьте агрегированный канал командой **show etherchannel summary**. Группа каналов 1 — используемый агрегированный канал второго уровня Po1 (флаги (SU)) с протоколом PAgP, и оба порта, F0/21 и F0/22, входят в него (флаг (P)).

        ```
        S1#show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 1
        Number of aggregators:           1

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        1      Po1(SU)         PAgP      Fa0/21(P)   Fa0/22(P)
        ```
    - title: "Настройка агрегированного канала LACP"
      body: |
        **Примечание.** LACP описан стандартом IEEE 802.3ad и поддерживается коммутаторами разных производителей, а PAgP — протокол одного производителя. Друг с другом эти протоколы не работают, поэтому оба конца агрегированного канала должны использовать один и тот же протокол. Номер группы каналов действует только на своем коммутаторе: на S1 номер 1 уже занят агрегированным каналом к S3, поэтому для канала к S2 используется номер 2.

        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации, затем к настройке портов G0/1 и G0/2 командой **interface range g0/1 - 2** и отключите их командой **shutdown**.

        **Шаг 2.** Объедините порты в группу каналов 2 по протоколу LACP в режиме active командой **channel-group 2 mode active**. В режиме active коммутатор сам предлагает соседу образовать агрегированный канал.

        **Шаг 3.** Включите порты командой **no shutdown**, перейдите к настройке интерфейса командой **interface port-channel 2**, переведите его в режим магистрального канала (trunk) командой **switchport mode trunk** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#interface range g0/1 - 2
        S1(config-if-range)#shutdown
        *Mar  1 00:02:57.441: %LINK-5-CHANGED: Interface GigabitEthernet0/1, changed state to administratively down
        *Mar  1 00:02:57.441: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:02:57.441: %LINK-5-CHANGED: Interface GigabitEthernet0/2, changed state to administratively down
        *Mar  1 00:02:57.441: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/2, changed state to down
        S1(config-if-range)#channel-group 2 mode active
        Creating a port-channel interface Port-channel 2
        S1(config-if-range)#no shutdown
        S1(config-if-range)#
        *Mar  1 00:03:06.675: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        S1(config-if-range)#
        *Mar  1 00:03:06.675: %LINK-3-UPDOWN: Interface GigabitEthernet0/2, changed state to up
        S1(config-if-range)#
        *Mar  1 00:03:07.675: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        S1(config-if-range)#
        *Mar  1 00:03:07.675: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/2, changed state to up
        S1(config-if-range)#interface port-channel 2
        S1(config-if)#switchport mode trunk
        S1(config-if)#end
        *Mar  1 00:03:20.033: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** В консоли коммутатора S2 выполните те же команды для портов G0/1 и G0/2: группа каналов 2, режим active (**channel-group 2 mode active**), интерфейс Port-channel 2 в режиме магистрального канала. После команды **no shutdown** интерфейс Port-channel2 включается.

        ```
        S2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S2(config)#interface range g0/1 - 2
        S2(config-if-range)#shutdown
        *Mar  1 00:03:32.380: %LINK-5-CHANGED: Interface GigabitEthernet0/1, changed state to administratively down
        *Mar  1 00:03:32.380: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:03:32.380: %LINK-5-CHANGED: Interface GigabitEthernet0/2, changed state to administratively down
        *Mar  1 00:03:32.380: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/2, changed state to down
        S2(config-if-range)#channel-group 2 mode active
        Creating a port-channel interface Port-channel 2
        S2(config-if-range)#no shutdown
        S2(config-if-range)#
        *Mar  1 00:03:41.612: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        S2(config-if-range)#
        *Mar  1 00:03:41.612: %LINK-3-UPDOWN: Interface GigabitEthernet0/2, changed state to up
        S2(config-if-range)#
        *Mar  1 00:03:42.612: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        S2(config-if-range)#
        *Mar  1 00:03:42.612: %LINK-3-UPDOWN: Interface Port-channel2, changed state to up
        S2(config-if-range)#
        *Mar  1 00:03:42.612: %LINEPROTO-5-UPDOWN: Line protocol on Interface Port-channel2, changed state to up
        S2(config-if-range)#
        *Mar  1 00:03:42.612: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/2, changed state to up
        S2(config-if-range)#interface port-channel 2
        S2(config-if)#switchport mode trunk
        S2(config-if)#end
        *Mar  1 00:03:54.869: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** В консоли коммутатора S1 снова выведите сведения об агрегированных каналах командой **show etherchannel summary**. Теперь на коммутаторе два агрегированных канала: Po1 с протоколом PAgP и Po2 с протоколом LACP, в который входят порты G0/1 и G0/2.

        ```
        S1#show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 2
        Number of aggregators:           2

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        1      Po1(SU)         PAgP      Fa0/21(P)   Fa0/22(P)
        2      Po2(SU)         LACP      Gi0/1(P)    Gi0/2(P)
        ```
    - title: "Настройка резервного агрегированного канала"
      body: |
        Агрегированный канал между коммутаторами S2 и S3 замыкает кольцо S1 — S2 — S3 — S1 и служит резервным путем между ними. Режим согласования этого канала на двух коммутаторах разный.

        **Шаг 1.** На коммутаторе S2 перейдите в режим глобальной конфигурации, а затем к настройке портов F0/23 и F0/24 командой **interface range f0/23 - 24**. Наберите **channel-group 3 mode ?**: как только вы вводите вопросительный знак, коммутатор выводит список режимов согласования и снова показывает начатую команду. Нажмите Enter: команда без режима неполная, и коммутатор отвечает «% Incomplete command.».

        ```
        S2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S2(config)#interface range f0/23 - 24
        S2(config-if-range)#channel-group 3 mode ?
          active     Enable LACP unconditionally
          auto       Enable PAgP only if a PAgP device is detected
          desirable  Enable PAgP unconditionally
          on         Enable Etherchannel only
          passive    Enable LACP only if a LACP device is detected

        S2(config-if-range)#channel-group 3 mode 
        % Incomplete command.
        ```

        **Примечание.** Режимы active и passive относятся к протоколу LACP, desirable и auto — к протоколу PAgP, а в режиме on агрегированный канал включается без согласования. Канал образуется, если хотя бы один его конец сам предлагает агрегацию: по протоколу PAgP — desirable с desirable или с auto, по протоколу LACP — active с active или с passive. Два порта в режиме auto или два порта в режиме passive канал не образуют: ни один из них не начинает согласование.

        **Шаг 2.** Отключите порты командой **shutdown** и объедините их в группу каналов 3 по протоколу LACP в режиме passive командой **channel-group 3 mode passive**: в этом режиме коммутатор S2 сам согласование не начинает и только отвечает на предложение соседа. Включите порты командой **no shutdown**, переведите интерфейс Port-channel 3 в режим магистрального канала (trunk) командами **interface port-channel 3** и **switchport mode trunk** и вернитесь в привилегированный режим EXEC командой **end**. Интерфейс Port-channel3 не включается: сосед еще не предлагает агрегацию.

        ```
        S2(config-if-range)#shutdown
        *Mar  1 00:04:07.418: %LINK-5-CHANGED: Interface FastEthernet0/23, changed state to administratively down
        *Mar  1 00:04:07.418: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/23, changed state to down
        *Mar  1 00:04:07.418: %LINK-5-CHANGED: Interface FastEthernet0/24, changed state to administratively down
        *Mar  1 00:04:07.418: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/24, changed state to down
        S2(config-if-range)#channel-group 3 mode passive
        Creating a port-channel interface Port-channel 3
        S2(config-if-range)#no shutdown
        S2(config-if-range)#
        *Mar  1 00:04:16.649: %LINK-3-UPDOWN: Interface FastEthernet0/23, changed state to up
        S2(config-if-range)#
        *Mar  1 00:04:16.649: %LINK-3-UPDOWN: Interface FastEthernet0/24, changed state to up
        S2(config-if-range)#
        *Mar  1 00:04:17.649: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/23, changed state to up
        S2(config-if-range)#
        *Mar  1 00:04:17.649: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/24, changed state to up
        S2(config-if-range)#interface port-channel 3
        S2(config-if)#switchport mode trunk
        S2(config-if)#end
        *Mar  1 00:04:29.908: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** В консоли коммутатора S3 настройте порты F0/23 и F0/24 так же, но в режиме active: **channel-group 3 mode active**. Коммутатор S3 предлагает агрегацию, S2 отвечает, и интерфейс Port-channel3 включается.

        ```
        S3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S3(config)#interface range f0/23 - 24
        S3(config-if-range)#shutdown
        *Mar  1 00:04:42.263: %LINK-5-CHANGED: Interface FastEthernet0/23, changed state to administratively down
        *Mar  1 00:04:42.263: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/23, changed state to down
        *Mar  1 00:04:42.263: %LINK-5-CHANGED: Interface FastEthernet0/24, changed state to administratively down
        *Mar  1 00:04:42.263: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/24, changed state to down
        S3(config-if-range)#channel-group 3 mode active
        Creating a port-channel interface Port-channel 3
        S3(config-if-range)#no shutdown
        S3(config-if-range)#
        *Mar  1 00:04:51.492: %LINK-3-UPDOWN: Interface FastEthernet0/23, changed state to up
        S3(config-if-range)#
        *Mar  1 00:04:51.492: %LINK-3-UPDOWN: Interface FastEthernet0/24, changed state to up
        S3(config-if-range)#
        *Mar  1 00:04:52.492: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/23, changed state to up
        S3(config-if-range)#
        *Mar  1 00:04:52.492: %LINK-3-UPDOWN: Interface Port-channel3, changed state to up
        S3(config-if-range)#
        *Mar  1 00:04:52.492: %LINEPROTO-5-UPDOWN: Line protocol on Interface Port-channel3, changed state to up
        S3(config-if-range)#
        *Mar  1 00:04:52.492: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/24, changed state to up
        S3(config-if-range)#interface port-channel 3
        S3(config-if)#switchport mode trunk
        S3(config-if)#end
        *Mar  1 00:05:04.849: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** В консоли коммутатора S2 проверьте агрегированные каналы командой **show etherchannel summary**. Работают два агрегированных канала с протоколом LACP: Po2 к коммутатору S1 и Po3 к коммутатору S3.

        ```
        S2#show etherchannel summary
        Flags:  D - down        P - bundled in port-channel
                I - stand-alone s - suspended
                H - Hot-standby (LACP only)
                R - Layer3      S - Layer2
                U - in use      f - failed to allocate aggregator

                M - not in use, minimum links not met
                u - unsuitable for bundling
                w - waiting to be aggregated
                d - default port


        Number of channel-groups in use: 2
        Number of aggregators:           2

        Group  Port-channel  Protocol    Ports
        ------+-------------+-----------+-----------------------------------------------
        2      Po2(SU)         LACP      Gi0/1(P)    Gi0/2(P)
        3      Po3(SU)         LACP      Fa0/23(P)   Fa0/24(P)
        ```
    - title: "Проверка агрегированных каналов и связующего дерева"
      body: |
        Три агрегированных канала образуют петлю S1 — S2 — S3 — S1, и протокол STP разрывает ее, как разорвал бы петлю из отдельных каналов. Подождите около 30 секунд после настройки: за это время протокол STP переводит агрегированные каналы в состояние пересылки или блокировки. Затем проверьте результат.

        **Шаг 1.** В консоли коммутатора S1 выведите сведения о связующем дереве командой **show spanning-tree active**. Коммутатор S1 — корневой мост (This bridge is the root): при одинаковом приоритете 32769 у него наименьший MAC-адрес. В списке интерфейсов нет портов F0/21, F0/22, G0/1 и G0/2 — только агрегированные каналы Po1 и Po2: протокол STP работает с каждым агрегированным каналом как с одним портом. Оба канала — назначенные порты (Desg) в состоянии пересылки (FWD). Стоимость (столбец «Cost») канала Po2 из двух портов GigabitEthernet — 3, канала Po1 из двух портов FastEthernet — 12.

        ```
        S1#show spanning-tree active
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     00D0.C038.0601
                     This bridge is the root
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     00D0.C038.0601
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Po1              Desg FWD 12        128.65   P2p
        Po2              Desg FWD 3         128.66   P2p
        ```

        **Шаг 2.** В консоли коммутатора S2 выполните ту же команду. Корневой порт коммутатора S2 (Root) — агрегированный канал Po2 к коммутатору S1 со стоимостью пути до корневого моста 3. Канал Po3 к коммутатору S3 — назначенный порт в состоянии пересылки.

        ```
        S2#show spanning-tree active
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     00D0.C038.0601
                     Cost        3
                     Port        66 (Port-channel2)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     00D0.D5A9.8201
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Po2              Root FWD 3         128.66   P2p
        Po3              Desg FWD 12        128.67   P2p
        ```

        **Шаг 3.** В консоли коммутатора S3 выполните ту же команду. Корневой порт коммутатора S3 — агрегированный канал Po1 к коммутатору S1 (стоимость 12). Канал Po3 к коммутатору S2 — альтернативный порт (Altn) в состоянии блокировки (BLK): назначенным на этом отрезке стал порт коммутатора S2, путь которого до корневого моста дешевле (3 против 12). Протокол STP заблокировал агрегированный канал Po3 целиком, оба его порта, F0/23 и F0/24. Если канал Po1 перестанет работать, трафик коммутатора S3 пойдет через резервный канал Po3.

        ```
        S3#show spanning-tree active
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     00D0.C038.0601
                     Cost        12
                     Port        65 (Port-channel1)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     00D0.F1FF.6A01
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Po1              Root FWD 12        128.65   P2p
        Po3              Altn BLK 12        128.67   P2p
        ```
