    - title: "Начальное состояние"
      body: |
        - Маршрутизатор R1 настроен: на его интерфейсах заданы адреса по таблицам адресации, включена маршрутизация IPv6, а маршруты по умолчанию IPv4 и IPv6 ведут к маршрутизатору R2.
        - Маршрутизатор Internet настроен по таблицам адресации, и его маршруты по умолчанию ведут к маршрутизатору R2.
        - На компьютерах PC1 и PC2 заданы IPv4- и IPv6-адреса и шлюзы по умолчанию по таблицам адресации. Компьютеры PC3 и PC4 не настроены. На коммутаторах S1–S4 задано только имя устройства.
        - Маршрутизатор R2 не настроен: у него стандартное имя Router, нет паролей, а его интерфейсы не имеют адресов и выключены.

        **Шаг 1.** Откройте консоль маршрутизатора R2 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**: пароль не запрашивается, потому что он еще не задан.

        **Шаг 2.** Выведите краткие сведения об интерфейсах командой **show ip interface brief**. Ни одному интерфейсу не назначен адрес (unassigned), и все они выключены (administratively down).

        ```
        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       unassigned      YES unset  administratively down down
        GigabitEthernet0/0/1       unassigned      YES unset  administratively down down
        Serial0/1/0                unassigned      YES unset  administratively down down
        Serial0/1/1                unassigned      YES unset  administratively down down
        ```
    - title: "Настройка IP-адресации компьютеров PC3 и PC4"
      body: |
        **Шаг 1.** Откройте окно компьютера PC3 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Задайте IPv4-адрес, маску подсети и шлюз по умолчанию командой **ipconfig 10.0.4.10 255.255.255.0 10.0.4.1**.

        **Шаг 2.** Задайте IPv6-адрес с длиной префикса и шлюз по умолчанию IPv6 командой **ipv6config 2001:db8:acad:4::10/64 fe80::2:a**.

        **Шаг 3.** Убедитесь с помощью команды **ipconfig**, что адреса заданы. В строке Default Gateway указаны оба шлюза: локальный адрес канала FE80::2:A и IPv4-адрес 10.0.4.1.

        ```
        C:\>ipconfig 10.0.4.10 255.255.255.0 10.0.4.1
        C:\>ipv6config 2001:db8:acad:4::10/64 fe80::2:a
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:49FF:FE97:6D01
           IPv6 Address....................: 2001:DB8:ACAD:4::10
           IPv4 Address....................: 10.0.4.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: FE80::2:A
                                             10.0.4.1
        ```

        **Примечание.** Шлюзом по умолчанию IPv6 служит локальный адрес канала (link-local) интерфейса маршрутизатора: он не меняется, даже если интерфейсу маршрутизатора назначат другой глобальный индивидуальный адрес (GUA). Те же параметры можно задать в приложении «IP-конфигурация».

        **Шаг 4.** Аналогично в приложении «Командная строка» компьютера PC4 задайте адреса командами **ipconfig 10.0.5.10 255.255.255.0 10.0.5.1** и **ipv6config 2001:db8:acad:5::10/64 fe80::2:b**.

        ```
        C:\>ipconfig 10.0.5.10 255.255.255.0 10.0.5.1
        C:\>ipv6config 2001:db8:acad:5::10/64 fe80::2:b
        ```
    - title: "Базовая настройка маршрутизатора R2"
      body: |
        **Шаг 1.** Вернитесь в консоль маршрутизатора R2 и перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Задайте имя устройства командой **hostname R2**. Приглашение меняется на R2(config)#.

        **Шаг 3.** Задайте зашифрованный пароль привилегированного режима EXEC командой **enable secret R2enpa55**.

        ```
        Router#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Router(config)#hostname R2
        R2(config)#enable secret R2enpa55
        ```

        **Шаг 4.** Отключите поиск имен в DNS командой **no ip domain-lookup**.

        **Примечание.** Слово, которое введено в режиме EXEC и не является командой, маршрутизатор считает именем узла для подключения по протоколу Telnet и ищет его адрес в DNS: в выводе появляется строка Translating "…"...domain server (255.255.255.255). На оборудовании без доступного DNS-сервера такой поиск после каждой опечатки занимает несколько секунд, и все это время консоль не принимает команды. Команда **no ip domain-lookup** отключает поиск.

        **Шаг 5.** Включите шифрование паролей, которые хранятся в конфигурации открытым текстом, командой **service password-encryption**.

        **Шаг 6.** Создайте баннер с предупреждением о запрете несанкционированного доступа командой **banner motd #Authorized Users Only!#**. Символ # отмечает начало и конец текста баннера.

        ```
        R2(config)#no ip domain-lookup
        R2(config)#service password-encryption
        R2(config)#banner motd #Authorized Users Only!#
        ```

        **Шаг 7.** Перейдите к настройке линии консоли командой **line con 0**. Задайте пароль консоли командой **password R2linepa55** и включите его проверку при входе командой **login**. Настройте отключение сеанса после шести минут бездействия командой **exec-timeout 6 0**. Чтобы сообщения системы не прерывали ввод команд, введите команду **logging synchronous**.

        **Шаг 8.** Вернитесь в режим глобальной конфигурации командой **exit**.

        ```
        R2(config)#line con 0
        R2(config-line)#password R2linepa55
        R2(config-line)#login
        R2(config-line)#exec-timeout 6 0
        R2(config-line)#logging synchronous
        R2(config-line)#exit
        ```

        **Примечание.** Текущий сеанс консоли продолжает работать. Если консоль не используется шесть минут, сеанс завершается: нажмите Enter и введите пароль консоли R2linepa55, а затем снова перейдите в привилегированный режим EXEC командой **enable** с паролем R2enpa55.
    - title: "Настройка протокола SSH на маршрутизаторе R2"
      body: |
        **Примечание.** Для работы SSH маршрутизатору нужны доменное имя и пара ключей RSA: ключи шифруют сеанс, а их имя составляется из имени устройства и доменного имени. Вход по SSH выполняется под учетной записью пользователя, поэтому линии VTY проверяют имя пользователя и пароль по локальной базе учетных записей маршрутизатора.

        **Шаг 1.** В режиме глобальной конфигурации задайте доменное имя командой **ip domain-name CCNA-lab.com**.

        **Шаг 2.** Создайте учетную запись администратора SSHadmin с зашифрованным паролем командой **username SSHadmin secret 55Hadm!n**.

        **Шаг 3.** Создайте ключи RSA командой **crypto key generate rsa**. На вопрос «How many bits in the modulus [512]:» введите длину ключа **1024**. Имя ключей — R2.CCNA-lab.com, и после их создания маршрутизатор включает протокол SSH.

        ```
        R2(config)#ip domain-name CCNA-lab.com
        R2(config)#username SSHadmin secret 55Hadm!n
        R2(config)#crypto key generate rsa
        The name for the keys will be: R2.CCNA-lab.com
        Choose the size of the key modulus in the range of 360 to 4096 for your
          General Purpose Keys. Choosing a key modulus greater than 512 may take
          a few minutes.

        How many bits in the modulus [512]: 1024
        % Generating 1024 bit RSA keys, keys will be non-exportable...
        [OK]
        *Mar  1 00:01:32.921: %SSH-5-ENABLED: SSH 1.99 has been enabled
        ```

        **Шаг 4.** Перейдите к настройке линий VTY командой **line vty 0 4**. Настройте отключение сеанса после шести минут бездействия командой **exec-timeout 6 0**, включите проверку учетных записей по локальной базе командой **login local** и разрешите на линиях только протокол SSH командой **transport input ssh**.

        **Шаг 5.** Вернитесь в режим глобальной конфигурации командой **exit**.

        ```
        R2(config)#line vty 0 4
        R2(config-line)#exec-timeout 6 0
        R2(config-line)#login local
        R2(config-line)#transport input ssh
        R2(config-line)#exit
        ```

        **Примечание.** С командой **login local** линии VTY проверяют имя и пароль учетной записи пользователя, поэтому отдельный пароль для самих линий VTY не нужен.
    - title: "Настройка интерфейсов маршрутизатора R2"
      body: |
        **Шаг 1.** Включите маршрутизацию IPv6 командой **ipv6 unicast-routing**: без нее маршрутизатор не передает пакеты IPv6 между своими интерфейсами.

        **Шаг 2.** Перейдите к настройке интерфейса G0/0/0 командой **interface g0/0/0**. Задайте его описание командой **description Link to S3**, IPv4-адрес командой **ip address 10.0.4.1 255.255.255.0**, локальный адрес канала командой **ipv6 address fe80::2:a link-local** и IPv6-адрес командой **ipv6 address 2001:db8:acad:4::1/64**. Включите интерфейс командой **no shutdown**.

        ```
        R2(config)#ipv6 unicast-routing
        R2(config)#interface g0/0/0
        R2(config-if)#description Link to S3
        R2(config-if)#ip address 10.0.4.1 255.255.255.0
        R2(config-if)#ipv6 address fe80::2:a link-local
        R2(config-if)#ipv6 address 2001:db8:acad:4::1/64
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:02:06.245: %LINK-3-UPDOWN: Interface GigabitEthernet0/0/0, changed state to up
        R2(config-if)#
        *Mar  1 00:02:07.245: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0/0, changed state to up
        ```

        **Шаг 3.** Аналогично настройте интерфейс G0/0/1 (**interface g0/0/1**): описание Link to S4, адреса 10.0.5.1 255.255.255.0, fe80::2:b link-local и 2001:db8:acad:5::1/64.

        ```
        R2(config-if)#interface g0/0/1
        R2(config-if)#description Link to S4
        R2(config-if)#ip address 10.0.5.1 255.255.255.0
        R2(config-if)#ipv6 address fe80::2:b link-local
        R2(config-if)#ipv6 address 2001:db8:acad:5::1/64
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:02:26.824: %LINK-3-UPDOWN: Interface GigabitEthernet0/0/1, changed state to up
        R2(config-if)#
        *Mar  1 00:02:27.824: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0/1, changed state to up
        ```

        **Шаг 4.** Аналогично настройте последовательные интерфейсы:
        - S0/1/0 (**interface s0/1/0**): описание Link to R1, адреса 10.0.3.2 255.255.255.0, fe80::1:c link-local и 2001:db8:acad:3::2/64;
        - S0/1/1 (**interface s0/1/1**): описание Link to Internet, адреса 209.165.200.225 255.255.255.252, fe80::1:d link-local и 2001:db8:feed:224::1/64.

        Затем вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2(config-if)#interface s0/1/0
        R2(config-if)#description Link to R1
        R2(config-if)#ip address 10.0.3.2 255.255.255.0
        R2(config-if)#ipv6 address fe80::1:c link-local
        R2(config-if)#ipv6 address 2001:db8:acad:3::2/64
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:02:47.405: %LINK-3-UPDOWN: Interface Serial0/1/0, changed state to up
        R2(config-if)#
        *Mar  1 00:02:48.405: %LINEPROTO-5-UPDOWN: Line protocol on Interface Serial0/1/0, changed state to up
        R2(config-if)#interface s0/1/1
        R2(config-if)#description Link to Internet
        R2(config-if)#ip address 209.165.200.225 255.255.255.252
        R2(config-if)#ipv6 address fe80::1:d link-local
        R2(config-if)#ipv6 address 2001:db8:feed:224::1/64
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:03:07.992: %LINK-3-UPDOWN: Interface Serial0/1/1, changed state to up
        R2(config-if)#
        *Mar  1 00:03:08.992: %LINEPROTO-5-UPDOWN: Line protocol on Interface Serial0/1/1, changed state to up
        R2(config-if)#end
        *Mar  1 00:03:12.010: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Сохраните текущую конфигурацию в файл загрузочной конфигурации командой **copy running-config startup-config** и подтвердите имя файла клавишей Enter.

        ```
        R2#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```
    - title: "Просмотр сведений о маршрутизаторе R2"
      body: |
        Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым: после включения интерфейсов маршрутизатора на это уходит около 30 секунд.

        **Шаг 1.** В приложении «Командная строка» компьютера PC3 подключитесь к маршрутизатору R2 по протоколу SSH командой **ssh -l SSHadmin 10.0.4.1**: параметр -l (латинская буква L) задает имя пользователя. Перед запросом пароля маршрутизатор показывает баннер. На запрос «Password:» введите пароль учетной записи **55Hadm!n**: вводимые символы не отображаются.

        **Шаг 2.** Выведите сведения об оборудовании и программном обеспечении маршрутизатора командой **show version**. Имя файла образа ОС указано в строке System image file, а объем энергонезависимой памяти (NVRAM), в которой хранится загрузочная конфигурация, — в строке «256K bytes of non-volatile configuration memory».

        ```
        C:\>ssh -l SSHadmin 10.0.4.1
        Authorized Users Only!
        Password: 
        R2>show version
        NSALAB NetOS Software, NR05 Software (NR05-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        R2 uptime is 3 minutes
        System returned to ROM by power-on
        System image file is "flash0:nr05-netos-0.1.0.bin"

        NSALAB NR05 (revision 1.0) with 1048576K/6147K bytes of memory.
        Processor board ID NSA00000001
        2 Gigabit Ethernet interfaces
        2 Serial(sync/async) interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```

        **Шаг 3.** Выведите из сведений о версии только строку с регистром конфигурации командой **show version | include register**. Значение регистра — 0x2102.

        ```
        R2>show version | include register
        Configuration register is 0x2102
        ```

        **Примечание.** Вертикальная черта (|) после команды show передает ее вывод фильтру: **include** оставляет строки, в которых есть заданное выражение, **exclude** убирает их, **begin** выводит все строки начиная с первой, где оно встретилось, а **section** — только раздел конфигурации с этим выражением. Значение регистра конфигурации 0x2102 означает обычную загрузку: маршрутизатор загружает образ ОС из флеш-памяти, а конфигурацию — из файла загрузочной конфигурации в NVRAM.

        **Шаг 4.** Перейдите в привилегированный режим EXEC командой **enable** и введите пароль **R2enpa55**.

        **Шаг 5.** Выведите строки текущей конфигурации со словом password командой **show running-config | include password**. Пароль консоли записан в зашифрованном виде (password 7 …), потому что включено шифрование паролей.

        ```
        R2>enable
        Password: 
        R2#show running-config | include password
        service password-encryption
         password 7 0036410A0D550E160E7419
        ```

        **Примечание.** Команда **service password-encryption** шифрует пароли простым обратимым алгоритмом (тип 7). Пароль привилегированного режима EXEC и пароль учетной записи SSHadmin заданы командами **enable secret** и **username … secret**: они хранятся в виде хеша (тип 5) в строках enable secret и username, в которых нет слова password.

        **Шаг 6.** Выведите конфигурацию начиная с первой строки со словом vty командой **show running-config | begin vty**, а затем только раздел линий VTY командой **show running-config | section vty**. Первая команда выводит все строки до конца конфигурации, вторая — только раздел line vty 0 4.

        ```
        R2#show running-config | begin vty
        line vty 0 4
         exec-timeout 6 0
         login local
         transport input ssh
        !
        end
        R2#show running-config | section vty
        line vty 0 4
         exec-timeout 6 0
         login local
         transport input ssh
        ```

        **Шаг 7.** Выведите таблицу маршрутизации IPv4 командой **show ip route**. Напрямую подключенные сети отмечены кодом C: их четыре, по одной на каждый настроенный интерфейс. Кодом L отмечены адреса самих интерфейсов. Маршрута по умолчанию нет: «Gateway of last resort is not set».

        ```
        R2#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              10.0.0.0/8 is variably subnetted, 6 subnets, 2 masks
        C        10.0.3.0/24 is directly connected, Serial0/1/0
        L        10.0.3.2/32 is directly connected, Serial0/1/0
        C        10.0.4.0/24 is directly connected, GigabitEthernet0/0/0
        L        10.0.4.1/32 is directly connected, GigabitEthernet0/0/0
        C        10.0.5.0/24 is directly connected, GigabitEthernet0/0/1
        L        10.0.5.1/32 is directly connected, GigabitEthernet0/0/1
              209.165.200.0/24 is variably subnetted, 2 subnets, 2 masks
        C        209.165.200.224/30 is directly connected, Serial0/1/1
        L        209.165.200.225/32 is directly connected, Serial0/1/1
        ```

        **Шаг 8.** Выведите краткие сведения об интерфейсах командой **show ip interface brief**. Все четыре интерфейса имеют адреса и работают (up/up): их включила команда **no shutdown**.

        ```
        R2#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       10.0.4.1        YES manual up                    up
        GigabitEthernet0/0/1       10.0.5.1        YES manual up                    up
        Serial0/1/0                10.0.3.2        YES manual up                    up
        Serial0/1/1                209.165.200.225 YES manual up                    up
        ```

        **Шаг 9.** Выведите краткие сведения об интерфейсах IPv6 командой **show ipv6 interface brief**. Для каждого интерфейса указаны локальный адрес канала и глобальный индивидуальный адрес, а запись [up/up] означает, что работают и сам интерфейс (первое слово), и протокол канального уровня на нем (второе слово).

        ```
        R2#show ipv6 interface brief
        GigabitEthernet0/0/0   [up/up]
            FE80::2:A
            2001:DB8:ACAD:4::1
        GigabitEthernet0/0/1   [up/up]
            FE80::2:B
            2001:DB8:ACAD:5::1
        Serial0/1/0            [up/up]
            FE80::1:C
            2001:DB8:ACAD:3::2
        Serial0/1/1            [up/up]
            FE80::1:D
            2001:DB8:FEED:224::1
        ```

        **Шаг 10.** Завершите сеанс SSH командой **exit**. В окне компьютера PC3 снова появляется приглашение C:\>.

        ```
        R2#exit


        [Connection to 10.0.4.1 closed by foreign host]
        ```
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC3 проверьте связь с компьютером PC4 командой **ping 10.0.5.10**. PC4 отвечает: маршрутизатор R2 передает пакеты между своими локальными сетями. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 10.0.5.10

        Pinging 10.0.5.10 with 32 bytes of data:

        Request timed out.
        Reply from 10.0.5.10: bytes=32 time=1ms TTL=127
        Reply from 10.0.5.10: bytes=32 time=1ms TTL=127
        Reply from 10.0.5.10: bytes=32 time=1ms TTL=127

        Ping statistics for 10.0.5.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** Проверьте связь с компьютером PC4 по IPv6 командой **ping 2001:db8:acad:5::10**. PC4 отвечает.

        ```
        C:\>ping 2001:db8:acad:5::10

        Pinging 2001:DB8:ACAD:5::10 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:5::10: bytes=32 time=4ms TTL=127
        Reply from 2001:DB8:ACAD:5::10: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:ACAD:5::10: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:ACAD:5::10: bytes=32 time=1ms TTL=127

        Ping statistics for 2001:DB8:ACAD:5::10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 4ms, Average = 1ms
        ```

        **Шаг 3.** В консоли маршрутизатора R2 проверьте связь с интерфейсом S0/1/1 маршрутизатора R1 командами **ping 10.0.3.1** и **ping 2001:db8:acad:3::1**. Маршрутизатор R1 отвечает на все эхо-запросы и по IPv4, и по IPv6 (!!!!!).

        ```
        R2#ping 10.0.3.1
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 10.0.3.1, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms
        R2#ping 2001:db8:acad:3::1
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 2001:DB8:ACAD:3::1, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC3 проверьте связь с маршрутизатором провайдера командой **ping 209.165.200.226**. Маршрутизатор Internet отвечает: сеть 209.165.200.224/30 подключена к R2 напрямую.

        ```
        C:\>ping 209.165.200.226

        Pinging 209.165.200.226 with 32 bytes of data:

        Reply from 209.165.200.226: bytes=32 time=1ms TTL=254
        Reply from 209.165.200.226: bytes=32 time=1ms TTL=254
        Reply from 209.165.200.226: bytes=32 time=1ms TTL=254
        Reply from 209.165.200.226: bytes=32 time=1ms TTL=254

        Ping statistics for 209.165.200.226:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 5.** Проверьте связь с узлом в интернете командой **ping 64.100.1.1**. Узел не отвечает, и сообщение «Destination host unreachable» присылает шлюз 10.0.4.1, то есть маршрутизатор R2: в его таблице маршрутизации есть только напрямую подключенные сети и нет маршрута по умолчанию, поэтому ему некуда передать пакет.

        ```
        C:\>ping 64.100.1.1

        Pinging 64.100.1.1 with 32 bytes of data:

        Reply from 10.0.4.1: Destination host unreachable.
        Reply from 10.0.4.1: Destination host unreachable.
        Reply from 10.0.4.1: Destination host unreachable.
        Reply from 10.0.4.1: Destination host unreachable.

        Ping statistics for 64.100.1.1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 6.** Подключитесь к маршрутизатору R2 по протоколу Telnet командой **telnet 10.0.4.1**. Маршрутизатор отклоняет подключение: линии VTY принимают только SSH.

        ```
        C:\>telnet 10.0.4.1
        Trying 10.0.4.1 ... 
        % Connection refused by remote host
        ```
