    - title: "Начальное состояние"
      body: |
        - На коммутаторе S1 заданы имя устройства и IP-адрес интерфейса VLAN 1, а порты F0/1 и F0/2 настроены как порты доступа. Остальные параметры имеют значения по умолчанию: безопасность портов не настроена, и все порты включены.
        - На компьютерах и ноутбуке заданы IP-адреса и маски подсети по таблице адресации.
        - Ноутбук Rogue-Laptop подключен к свободному порту F0/5 коммутатора S1.

        **Шаг 1.** Откройте окно ноутбука Rogue-Laptop и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC1 командой **ping 10.10.10.10**. Эхо-запросы выполняются успешно: порт F0/5 включен, и коммутатор принимает кадры любого подключенного к нему устройства.

        ```
        C:\>ping 10.10.10.10

        Pinging 10.10.10.10 with 32 bytes of data:

        Reply from 10.10.10.10: bytes=32 time=1ms TTL=128
        Reply from 10.10.10.10: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.10: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.10: bytes=32 time<1ms TTL=128

        Ping statistics for 10.10.10.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 2.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 3.** Выведите сведения о безопасности портов командой **show port-security**. Таблица портов пуста: безопасность не включена ни на одном порту.

        ```
        S1>enable
        S1#show port-security
        Secure Port  MaxSecureAddr  CurrentAddr  SecurityViolation  Security Action
                        (Count)       (Count)          (Count)
        ---------------------------------------------------------------------------
        ---------------------------------------------------------------------------
        Total Addresses in System (excluding one mac per port)     : 0
        Max Addresses limit in System (excluding one mac per port) : 8192
        ```
    - title: "Настройка безопасности портов"
      body: |
        **Примечание.** Безопасность портов (port security) ограничивает число MAC-адресов, с которых порт принимает кадры. Разрешенные адреса задают вручную или запоминают динамически: с параметром sticky коммутатор записывает в текущую конфигурацию MAC-адреса, первыми полученные на порту. Кадр с другого адреса — нарушение безопасности, и порт поступает с ним по режиму реакции на нарушение.

        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке сразу двух интерфейсов, F0/1 и F0/2, командой **interface range f0/1 - 2**.

        **Шаг 2.** Включите безопасность портов командой **switchport port-security** и разрешите на каждом порту не больше одного MAC-адреса командой **switchport port-security maximum 1**.

        **Шаг 3.** Включите запоминание MAC-адресов в текущей конфигурации командой **switchport port-security mac-address sticky**.

        **Шаг 4.** Задайте режим реакции на нарушение командой **switchport port-security violation restrict** и вернитесь в привилегированный режим EXEC командой **end**. В режиме restrict порт не выключается: он отбрасывает кадры с неизвестных MAC-адресов и считает нарушения.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#interface range f0/1 - 2
        S1(config-if-range)#switchport port-security
        S1(config-if-range)#switchport port-security maximum 1
        S1(config-if-range)#switchport port-security mac-address sticky
        S1(config-if-range)#switchport port-security violation restrict
        S1(config-if-range)#end
        *Mar  1 00:00:54.983: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Убедитесь с помощью команды **show port-security**, что безопасность включена на портах F0/1 и F0/2: в столбце «MaxSecureAddr» — 1, в столбце «Security Action» — Restrict. В столбце «CurrentAddr» пока 0: порты еще не запомнили ни одного адреса.

        ```
        S1#show port-security
        Secure Port  MaxSecureAddr  CurrentAddr  SecurityViolation  Security Action
                        (Count)       (Count)          (Count)
        ---------------------------------------------------------------------------
              Fa0/1              1            0                  0         Restrict
              Fa0/2              1            0                  0         Restrict
        ---------------------------------------------------------------------------
        Total Addresses in System (excluding one mac per port)     : 0
        Max Addresses limit in System (excluding one mac per port) : 8192
        ```
    - title: "Выключение неиспользуемых портов"
      body: |
        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке всех портов, к которым не подключены компьютеры сотрудников, командой **interface range f0/3 - 24 , g0/1 - 2**.

        **Шаг 2.** Выключите порты командой **shutdown** и вернитесь в привилегированный режим EXEC командой **end**. Коммутатор сообщает о выключении каждого порта, а у порта F0/5, к которому подключен ноутбук Rogue-Laptop, пропадает соединение.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#interface range f0/3 - 24 , g0/1 - 2
        S1(config-if-range)#shutdown
        *Mar  1 00:01:06.027: %LINK-5-CHANGED: Interface FastEthernet0/3, changed state to administratively down
        *Mar  1 00:01:06.027: %LINK-5-CHANGED: Interface FastEthernet0/4, changed state to administratively down
        *Mar  1 00:01:06.027: %LINK-5-CHANGED: Interface FastEthernet0/5, changed state to administratively down
        *Mar  1 00:01:06.027: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/5, changed state to down
        …
        *Mar  1 00:01:06.027: %LINK-5-CHANGED: Interface GigabitEthernet0/2, changed state to administratively down
        S1(config-if-range)#end
        *Mar  1 00:01:10.142: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** В приложении «Командная строка» ноутбука Rogue-Laptop снова проверьте связь с компьютером PC1 командой **ping 10.10.10.10**. Эхо-запросы не выполняются: порт F0/5 выключен, и у ноутбука нет работающего соединения (сообщение «General failure»).

        ```
        C:\>ping 10.10.10.10

        Pinging 10.10.10.10 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 10.10.10.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Проверка запоминания MAC-адресов"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и в приложении «Командная строка» проверьте связь с компьютером PC2 командой **ping 10.10.10.11**. Эхо-запросы выполняются успешно, и порты F0/1 и F0/2 получают первые кадры от компьютеров.

        ```
        C:\>ping 10.10.10.11

        Pinging 10.10.10.11 with 32 bytes of data:

        Reply from 10.10.10.11: bytes=32 time=1ms TTL=128
        Reply from 10.10.10.11: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.11: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.11: bytes=32 time<1ms TTL=128

        Ping statistics for 10.10.10.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 2.** На коммутаторе S1 выведите конфигурацию портов командами **show running-config interface f0/1** и **show running-config interface f0/2**. В конфигурации каждого порта появилась строка switchport port-security mac-address sticky с MAC-адресом его компьютера: 00e0.b027.2245 у PC1 и 0001.647c.697e у PC2.

        ```
        S1#show running-config interface f0/1
        Building configuration...

        Current configuration : 232 bytes
        !
        interface FastEthernet0/1
         switchport mode access
         switchport port-security
         switchport port-security violation restrict
         switchport port-security mac-address sticky
         switchport port-security mac-address sticky 00e0.b027.2245
        end

        S1#show running-config interface f0/2
        Building configuration...

        Current configuration : 232 bytes
        !
        interface FastEthernet0/2
         switchport mode access
         switchport port-security
         switchport port-security violation restrict
         switchport port-security mac-address sticky
         switchport port-security mac-address sticky 0001.647c.697e
        end
        ```

        **Примечание.** Строки switchport port-security maximum 1 в конфигурации нет: один MAC-адрес на порту — значение по умолчанию, а значения по умолчанию в текущей конфигурации не показываются.

        **Шаг 3.** Выведите таблицу защищенных MAC-адресов командой **show port-security address**. Оба адреса записаны с типом SecureSticky: порты запомнили их сами.

        ```
        S1#show port-security address
                       Secure Mac Address Table
        -----------------------------------------------------------------------------
        Vlan    Mac Address       Type                          Ports   Remaining Age
                                                                           (mins)
        ----    -----------       ----                          -----   -------------
           1    00e0.b027.2245    SecureSticky                  Fa0/1        -
           1    0001.647c.697e    SecureSticky                  Fa0/2        -
        -----------------------------------------------------------------------------
        Total Addresses in System (excluding one mac per port)     : 0
        Max Addresses limit in System (excluding one mac per port) : 8192
        ```
    - title: "Проверка защиты от постороннего подключения"
      body: |
        **Шаг 1.** Отключите компьютер PC2 от коммутатора: щелкните правой кнопкой мыши кабель между PC2 и S1 и выберите «Удалить соединение». Так же удалите кабель между ноутбуком Rogue-Laptop и коммутатором S1.

        **Шаг 2.** Подключите ноутбук Rogue-Laptop к порту F0/2, к которому был подключен PC2: наведите указатель на ноутбук, нажмите «Соединить» над ним и щелкните коммутатор S1. В окне выбора кабеля оставьте тип «Медный прямой», убедитесь, что в поле «Порт S1» выбран порт F0/2, и нажмите «Соединить».

        **Шаг 3.** Дождитесь, когда индикатор нового соединения на схеме загорится зеленым («Соединение активно» в условных обозначениях): после подключения на это уходит около 30 секунд. В приложении «Командная строка» ноутбука Rogue-Laptop проверьте связь с компьютером PC1 командой **ping 10.10.10.10**. Эхо-запросы не выполняются.

        ```
        C:\>ping 10.10.10.10

        Pinging 10.10.10.10 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 10.10.10.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 4.** На коммутаторе S1 выведите сведения о безопасности порта F0/2 командой **show port-security interface f0/2**. Строка «Last Source Address:Vlan» показывает MAC-адрес ноутбука Rogue-Laptop, а строка «Security Violation Count» — число нарушений.

        ```
        S1#show port-security interface f0/2
        Port Security              : Enabled
        Port Status                : Secure-up
        Violation Mode             : Restrict
        Aging Time                 : 0 mins
        Aging Type                 : Absolute
        SecureStatic Address Aging : Disabled
        Maximum MAC Addresses      : 1
        Total MAC Addresses        : 1
        Configured MAC Addresses   : 0
        Sticky MAC Addresses       : 1
        Last Source Address:Vlan   : 00d0.9432.7501:1
        Security Violation Count   : 4
        ```

        **Шаг 5.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 6.** Отключите ноутбук Rogue-Laptop от порта F0/2 и снова подключите к этому порту компьютер PC2 так же, как в шагах 1 и 2.

        **Шаг 7.** Дождитесь, когда индикатор соединения загорится зеленым. В приложении «Командная строка» компьютера PC2 проверьте связь с компьютером PC1 командой **ping 10.10.10.10**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 10.10.10.10

        Pinging 10.10.10.10 with 32 bytes of data:

        Reply from 10.10.10.10: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.10: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.10: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.10: bytes=32 time<1ms TTL=128

        Ping statistics for 10.10.10.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 8.** Ответьте на вопрос 2 в форме ответов.
