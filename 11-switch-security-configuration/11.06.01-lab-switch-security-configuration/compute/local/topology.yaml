        **Шаг 3.** Откройте окно компьютера PC-110 и в приложении «Командная строка» проверьте связь с компьютером PC-210 командой **ping 192.168.20.21**. Эхо-запросы выполняются: оба компьютера находятся в сети VLAN 20.

        ```
