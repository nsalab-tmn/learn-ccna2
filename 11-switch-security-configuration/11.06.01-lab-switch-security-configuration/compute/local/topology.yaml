        **Шаг 4.** Откройте окно компьютера PC-124 и в приложении «Командная строка» проверьте связь с компьютером PC-224 сети управления командой **ping 192.168.99.21**. Эхо-запросы выполняются: оба компьютера находятся в сети VLAN 99.

