    - title: "Начальное состояние"
      body: |
        - Коммутатор уровня 3 MLS настроен: он маршрутизирует трафик между сетями VLAN 10, 20 и 99 (его интерфейсы VLAN — шлюзы по умолчанию компьютеров), а его порты G0/1 и G0/2 — статические магистральные каналы с собственной VLAN 100.
        - На коммутаторах SW-1 и SW-2 созданы сети VLAN 10 Admin, 20 Sales и 99 Management, и порты компьютеров назначены им по таблице VLAN. Остальные параметры коммутаторов SW-1 и SW-2 имеют значения по умолчанию.
        - На компьютерах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.

        В начальном состоянии компьютер PC-101 сети VLAN 10 получает ответы на эхо-запросы от компьютера PC-210 сети VLAN 20 (**ping 192.168.20.21** в приложении «Командная строка»): трафик между сетями VLAN маршрутизирует коммутатор MLS. Первый эхо-запрос остается без ответа, пока узлы определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.20.21

        Pinging 192.168.20.21 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.20.21: bytes=32 time=1ms TTL=127
        Reply from 192.168.20.21: bytes=32 time=1ms TTL=127
        Reply from 192.168.20.21: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.20.21:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        Связь между узлами всех сетей VLAN должна сохраниться и после выполнения требований. Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Создание защищенного магистрального канала"
      body: |
        **Требование 1.** Порты G0/2 коммутаторов SW-1 и SW-2 соединены кабелем подходящего типа, и соединение установлено.

        **Требование 2.** На коммутаторах SW-1 и SW-2 порты G0/1 и G0/2 статически работают в режиме магистрального канала (trunk), а согласование режима по протоколу DTP на них выключено.

        **Требование 3.** На коммутаторах SW-1 и SW-2 создана сеть VLAN 100 с именем Native.

        **Требование 4.** Собственная VLAN (native VLAN) всех магистральных каналов коммутаторов SW-1 и SW-2 — VLAN 100.

        **Примечание.** Порт, который согласует режим по протоколу DTP, может стать магистральным каналом по предложению чужого устройства, а кадры без тега магистральный канал передает в свою собственную VLAN. Поэтому магистральные каналы задают статически, без согласования, и переносят их собственную VLAN из VLAN 1, которой по умолчанию назначены все порты, в отдельную сеть VLAN без узлов.
    - title: "Защита неиспользуемых портов"
      body: |
        **Требование 5.** На коммутаторе SW-1 создана сеть VLAN 999 с именем BlackHole. Имя чувствительно к регистру и должно совпадать точно.

        **Требование 6.** Все неиспользуемые порты коммутатора SW-1 (F0/3–F0/9 и F0/11–F0/23) назначены сети VLAN 999 и выключены.

        **Примечание.** Выключенный порт не передает кадры, даже если к нему подключат устройство. Сеть VLAN без узлов и без интерфейса VLAN, в которую назначены неиспользуемые порты, закрывает доступ и тогда, когда порт по ошибке включат: подключенное к нему устройство окажется в изолированной сети VLAN.
    - title: "Настройка безопасности портов"
      body: |
        **Требование 7.** На активных портах доступа коммутатора SW-1 (F0/1, F0/2, F0/10 и F0/24) включена безопасность портов (port security), и каждый из этих портов изучает не более четырех MAC-адресов.

        **Требование 8.** MAC-адреса, изученные на этих портах, автоматически добавляются в текущую конфигурацию коммутатора (sticky).

        **Требование 9.** Режим реакции на нарушение безопасности этих портов — restrict: кадры с MAC-адресов сверх разрешенного числа отбрасываются и учитываются в счетчике нарушений, но порт не выключается.

        **Требование 10.** На порту F0/1 коммутатора SW-1 MAC-адрес компьютера PC-101 задан статически как защищенный адрес.
    - title: "Настройка DHCP snooping"
      body: |
        **Требование 11.** На коммутаторе SW-1 магистральные порты G0/1 и G0/2 — доверенные порты DHCP snooping.

        **Требование 12.** На коммутаторе SW-1 недоверенные активные порты доступа (F0/1, F0/2, F0/10 и F0/24) пропускают не более пяти пакетов DHCP в секунду.

        **Требование 13.** На коммутаторе SW-2 функция DHCP snooping включена глобально и для сетей VLAN 10, 20 и 99.

        **Примечание.** DHCP snooping пропускает ответы сервера DHCP только через доверенные порты — обращенные к сети, где находится настоящий сервер, — и ограничивает число сообщений DHCP на недоверенных портах. Так подставной сервер DHCP за портом пользователя не раздает узлам свои настройки, а поток запросов с одного порта не исчерпывает пул адресов сервера.
    - title: "Настройка PortFast и BPDU Guard"
      body: |
        **Требование 14.** На активных портах доступа коммутатора SW-1 (F0/1, F0/2, F0/10 и F0/24) включены PortFast и BPDU Guard.

        **Требование 15.** На коммутаторе SW-2 функция PortFast по умолчанию включена на всех портах доступа.

        **Примечание.** Порт с PortFast переходит к пересылке кадров сразу, без ожидания состояний протокола STP, поэтому PortFast включают только на портах, к которым подключены конечные узлы. BPDU Guard выключает такой порт, если на него приходит кадр BPDU: значит, к порту подключили коммутатор, который может образовать петлю.
    - title: "Проверка конфигурации и связи"
      body: |
        После выполнения всех требований должны выполняться следующие условия:

        - соединение между портами G0/2 коммутаторов SW-1 и SW-2 не отображается на схеме как «Соединение отключено» (в кольце из трех коммутаторов протокол STP может заблокировать один из портов: «Порт заблокирован STP»);
        - магистральные каналы коммутаторов SW-1 и SW-2 работают без согласования по протоколу DTP с собственной VLAN 100, и сообщения о несоответствии собственной VLAN больше не появляются;
        - неиспользуемые порты коммутатора SW-1 выключены и назначены сети VLAN 999;
        - узлы всех сетей VLAN по-прежнему связываются друг с другом.

        **Шаг 1.** В приложении «Командная строка» компьютера PC-101 проверьте связь с компьютером PC-201 командой **ping 192.168.10.21**. Эхо-запросы выполняются: оба компьютера находятся в сети VLAN 10, и ее кадры проходят между коммутаторами по магистральным каналам.

        ```
        C:\>ping 192.168.10.21

        Pinging 192.168.10.21 with 32 bytes of data:

        Reply from 192.168.10.21: bytes=32 time=3ms TTL=128
        Reply from 192.168.10.21: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.21: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.21: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.10.21:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
