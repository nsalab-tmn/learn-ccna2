        **Шаг 2.** На компьютере PC-101 проверьте связь с компьютером PC-210 сети VLAN 20 командой **ping 192.168.20.21**. Эхо-запросы выполняются: трафик между сетями VLAN маршрутизирует коммутатор MLS.

        ```
