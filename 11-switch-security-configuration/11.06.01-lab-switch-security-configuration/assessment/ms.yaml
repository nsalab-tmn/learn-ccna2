  subCriterions:
  - code: SW-2.PORTS
    name: Ports
    aspects:
    - code: SW-2.PORTS.G0-2-LINK
      name: GigabitEthernet0/2.Link to SW-1.Connects to GigabitEthernet0/2
      description: G0/2 соединён с SW-1 G0/2
      skills:
      - Configure secure trunks
      max_mark: 2
      steps:
      - name: a cable SW-2 GigabitEthernet0/2 — SW-1 GigabitEthernet0/2
        code: check
        type: check
        device: SW-2
        action_chain:
        - action: validate_web_response
          action_vars:
            name: http://{lab_ip}:7681/api/topology
            assert_code: 200
            assert_jmespath:
              path: length(links[?(a.device=='SW-2' && a.port=='GigabitEthernet0/2' && b.device=='SW-1' && b.port=='GigabitEthernet0/2')
                || (a.device=='SW-1' && a.port=='GigabitEthernet0/2' && b.device=='SW-2' && b.port=='GigabitEthernet0/2')])
              value: 1
    - code: SW-2.PORTS.G0-2-NATIVE
      name: GigabitEthernet0/2.Native VLAN
      description: 'G0/2: native VLAN 100'
      skills:
      - Configure secure trunks
      max_mark: 3
      steps:
      - name: 'show interfaces GigabitEthernet0/2 switchport: matches Trunking Native Mode VLAN: 100 \('
        code: check
        type: check
        device: SW-2
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: show interfaces GigabitEthernet0/2 switchport
            expr: 'Trunking Native Mode VLAN: 100 \('
            match: true
    - code: SW-2.PORTS.G0-2-NONEGOTIATE
      name: GigabitEthernet0/2.Nonegotiate
      description: 'G0/2: DTP выключен (nonegotiate)'
      skills:
      - Configure secure trunks
      max_mark: 2
      steps:
      - name: 'show interfaces GigabitEthernet0/2 switchport: matches Negotiation of Trunking: Off'
        code: check
        type: check
        device: SW-2
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: show interfaces GigabitEthernet0/2 switchport
            expr: 'Negotiation of Trunking: Off'
            match: true
    - code: SW-2.PORTS.G0-2-TRUNK
      name: GigabitEthernet0/2.Port Mode
      description: 'G0/2: статический транк (switchport mode trunk)'
      skills:
      - Configure secure trunks
      max_mark: 2
      steps:
      - name: 'show interfaces GigabitEthernet0/2 switchport: matches Administrative Mode: trunk'
        code: check
        type: check
        device: SW-2
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: show interfaces GigabitEthernet0/2 switchport
            expr: 'Administrative Mode: trunk'
            match: true
  - code: SW-2.STP
    name: STP
    aspects:
    - code: SW-2.STP.PORTFAST-DEFAULT
      name: PortFast Default
      description: PortFast по умолчанию на портах доступа
      skills:
      - Activate BPDU Guard and Portfast
      max_mark: 1
      steps:
      - name: 'show running-config: matches (?m)^spanning-tree portfast default\s*$'
        code: check
        type: check
        device: SW-2
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: show running-config
            expr: (?m)^spanning-tree portfast default\s*$
            match: true
  - code: SW-2.VLANS
    name: VLANS
    aspects:
    - code: SW-2.VLANS.VLAN100-NAME
      name: VLAN 100.VLAN Name
      description: VLAN 100 с именем Native
      skills:
      - Configure secure trunks
      max_mark: 2
      steps:
      - name: 'show vlan brief: matches (?m)^100\s+Native\s+active'
        code: check
        type: check
        device: SW-2
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: show vlan brief
            expr: (?m)^100\s+Native\s+active
            match: true
