        | ISP1 | G0/0 | 198.0.0.1, 2001:db8:f:f::1 | 255.255.255.0, /64 | — |
        | ISP2 | S0/0/1 | 10.10.10.5, 2001:db8:a:2::1 | 255.255.255.252, /64 | — |
