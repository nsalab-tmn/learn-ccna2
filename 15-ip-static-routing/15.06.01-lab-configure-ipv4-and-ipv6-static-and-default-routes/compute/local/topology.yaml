          2     1 ms     1 ms     1 ms  10.10.10.5
          3     2 ms     2 ms     2 ms  198.0.0.10

        Trace complete.
        ```

        **Шаг 8.** В приложении «Командная строка» компьютера PC-B выполните трассировку маршрута до сервера командой **tracert 2001:db8:f:f::10**. Путь проходит через маршрутизатор ISP2 (2001:DB8:A:2::1).

