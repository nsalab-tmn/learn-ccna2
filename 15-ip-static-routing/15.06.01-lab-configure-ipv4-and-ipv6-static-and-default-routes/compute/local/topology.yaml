    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах Edge_Router, ISP1 и ISP2 заданы имена устройств и адреса IPv4 и IPv6 интерфейсов по таблице адресации, интерфейсы включены, включена маршрутизация IPv6.
        - На маршрутизаторе ISP2 настроены статические маршруты IPv4 и IPv6 к сетям LAN 1 и LAN 2 через маршрутизатор Edge_Router.
        - На маршрутизаторах Edge_Router и ISP1 статических маршрутов нет: каждый из них знает только напрямую подключенные к нему сети.
        - На коммутаторах LAN_1, LAN_2 и ISP_LAN задано только имя устройства.
        - На компьютерах PC-A и PC-B и на сервере Customer-Server заданы адреса IPv4 и IPv6 и шлюзы по умолчанию по таблице адресации. Шлюз по умолчанию сервера — маршрутизатор ISP1.

        После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым. Компьютер PC-A не получает ответов от сервера ни по IPv4 (**ping 198.0.0.10** в приложении «Командная строка»), ни по IPv6 (**ping 2001:db8:f:f::10**): сообщения о недоступности присылает его шлюз, маршрутизатор Edge_Router (192.168.10.17 и 2001:DB8:1:10::1), потому что у него нет маршрута к сети сервера.

        ```
        C:\>ping 198.0.0.10

        Pinging 198.0.0.10 with 32 bytes of data:

        Reply from 192.168.10.17: Destination host unreachable.
        Reply from 192.168.10.17: Destination host unreachable.
        Reply from 192.168.10.17: Destination host unreachable.
        Reply from 192.168.10.17: Destination host unreachable.

        Ping statistics for 198.0.0.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        ```
        C:\>ping 2001:db8:f:f::10

        Pinging 2001:DB8:F:F::10 with 32 bytes of data:

        Reply from 2001:DB8:1:10::1: Destination net unreachable.
        Reply from 2001:DB8:1:10::1: Destination net unreachable.
        Reply from 2001:DB8:1:10::1: Destination net unreachable.
        Reply from 2001:DB8:1:10::1: Destination net unreachable.

        Ping statistics for 2001:DB8:F:F::10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Каждый маршрут должен совпадать со своим требованием точно: по способу указания пути (адрес следующего перехода или выходной интерфейс) и по административному расстоянию.

        **Примечание.** Набор маршрутов в этой лабораторной работе нужен, чтобы отработать все виды статических маршрутов. В реальной сети такая схема маршрутизации может не соответствовать рекомендуемой практике.
    - title: "Настройка маршрутов IPv4 по умолчанию"
      body: |
        **Требование 1.** На маршрутизаторе Edge_Router настроен статический маршрут IPv4 по умолчанию через маршрутизатор ISP1. Это напрямую подключенный маршрут: в нем указан только выходной интерфейс S0/0/0, без адреса следующего перехода, а административное расстояние остается по умолчанию.

        **Требование 2.** На маршрутизаторе Edge_Router настроен плавающий статический маршрут IPv4 по умолчанию через маршрутизатор ISP2: напрямую подключенный, с выходным интерфейсом S0/0/1 и без адреса следующего перехода, с административным расстоянием 5.

        **Примечание.** У статического маршрута административное расстояние по умолчанию равно 1. Из нескольких маршрутов к одной сети маршрутизатор помещает в таблицу маршрутизации маршрут с наименьшим административным расстоянием, поэтому маршрут с расстоянием 5 остается в конфигурации, а в таблице появляется, только когда основной маршрут пропадает: например, когда его выходной интерфейс выключается.
    - title: "Настройка маршрутов IPv6 по умолчанию"
      body: |
        **Требование 3.** На маршрутизаторе Edge_Router настроен статический маршрут IPv6 по умолчанию через маршрутизатор ISP1. Это маршрут следующего перехода: в нем указан только адрес следующего перехода 2001:db8:a:1::1 (интерфейс S0/0/0 маршрутизатора ISP1), без выходного интерфейса, а административное расстояние остается по умолчанию.

        **Требование 4.** На маршрутизаторе Edge_Router настроен плавающий статический маршрут IPv6 по умолчанию через маршрутизатор ISP2: в нем указан только адрес следующего перехода 2001:db8:a:2::1 (интерфейс S0/0/1 маршрутизатора ISP2), без выходного интерфейса, с административным расстоянием 5.
    - title: "Настройка маршрутов IPv4 к локальным сетям"
      body: |
        **Требование 5.** На маршрутизаторе ISP1 настроены статические маршруты IPv4 к сетям LAN 1 и LAN 2 через маршрутизатор Edge_Router. Это маршруты следующего перехода: в каждом указан только адрес следующего перехода 10.10.10.2 (интерфейс S0/0/0 маршрутизатора Edge_Router), без выходного интерфейса. Адрес и маска каждой сети отмечены «?» в таблице сетей: определите их по адресу и маске интерфейса маршрутизатора Edge_Router в этой сети.

        **Требование 6.** На маршрутизаторе ISP1 настроены плавающие статические маршруты IPv4 к сетям LAN 1 и LAN 2 через маршрутизатор ISP2: напрямую подключенные, с выходным интерфейсом G0/0 и без адреса следующего перехода, с административным расстоянием 5.

        **Примечание.** Сервер Customer-Server отправляет ответы своему шлюзу по умолчанию, маршрутизатору ISP1, поэтому маршруты к локальным сетям компании нужны ISP1 и на случай отказа основного канала. В напрямую подключенном маршруте через интерфейс Ethernet нет адреса следующего перехода, и маршрутизатор запрашивает по протоколу ARP MAC-адрес самого получателя. На такой запрос отвечает маршрутизатор той же сети, который знает маршрут к получателю (proxy ARP): здесь это ISP2.
    - title: "Настройка маршрутов IPv6 к локальным сетям"
      body: |
        **Требование 7.** На маршрутизаторе ISP1 настроены статические маршруты IPv6 к сетям LAN 1 и LAN 2 через маршрутизатор Edge_Router. Префикс каждой сети отмечен «?» в таблице сетей: определите его по адресу интерфейса маршрутизатора Edge_Router в этой сети. В каждом маршруте указан только адрес следующего перехода 2001:db8:a:1::2 (интерфейс S0/0/0 маршрутизатора Edge_Router), без выходного интерфейса.

        **Требование 8.** На маршрутизаторе ISP1 настроены плавающие статические маршруты IPv6 к сетям LAN 1 и LAN 2 через маршрутизатор ISP2: в каждом указан только адрес следующего перехода 2001:db8:f:f::2 (интерфейс G0/0 маршрутизатора ISP2), без выходного интерфейса, с административным расстоянием 5.
    - title: "Настройка маршрутов узла к серверу"
      body: |
        **Требование 9.** На маршрутизаторе Edge_Router настроен статический маршрут узла IPv4 к серверу Customer-Server, к адресу 198.0.0.10 с маской 255.255.255.255, через маршрутизатор ISP1: напрямую подключенный, с выходным интерфейсом S0/0/0 и без адреса следующего перехода.

        **Требование 10.** На маршрутизаторе Edge_Router настроен плавающий статический маршрут узла IPv4 к адресу 198.0.0.10 с маской 255.255.255.255 через маршрутизатор ISP2: напрямую подключенный, с выходным интерфейсом S0/0/1 и без адреса следующего перехода, с административным расстоянием 5.

        **Требование 11.** На маршрутизаторе Edge_Router настроен статический маршрут узла IPv6 к серверу Customer-Server, к адресу 2001:db8:f:f::10 с длиной префикса /128, через маршрутизатор ISP1: в нем указан только адрес следующего перехода 2001:db8:a:1::1, без выходного интерфейса.

        **Требование 12.** На маршрутизаторе Edge_Router настроен плавающий статический маршрут узла IPv6 к адресу 2001:db8:f:f::10 с длиной префикса /128 через маршрутизатор ISP2: напрямую подключенный, с выходным интерфейсом S0/0/1 и без адреса следующего перехода, с административным расстоянием 5.

        **Примечание.** Маршрутизатор пересылает пакет по маршруту, префикс которого дает самое длинное совпадение с адресом получателя. Поэтому пакеты к серверу Customer-Server идут по маршруту узла, а не по маршруту по умолчанию, хотя оба маршрута ведут к одному провайдеру.
    - title: "Проверка связи и резервирования"
      body: |
        Когда все требования выполнены, проверьте результат. Первые эхо-запросы проверки могут остаться без ответа: в это время маршрутизаторы определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** В приложении «Командная строка» компьютера PC-A проверьте связь с сервером командой **ping 198.0.0.10**. Сервер отвечает. Значение TTL=126 показывает, что ответ прошел через два маршрутизатора: ISP1 и Edge_Router.

        ```
        C:\>ping 198.0.0.10

        Pinging 198.0.0.10 with 32 bytes of data:

        Request timed out.
        Reply from 198.0.0.10: bytes=32 time=2ms TTL=126
        Reply from 198.0.0.10: bytes=32 time=2ms TTL=126
        Reply from 198.0.0.10: bytes=32 time=2ms TTL=126

        Ping statistics for 198.0.0.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Выполните трассировку маршрута до сервера командой **tracert 198.0.0.10**. Путь проходит через маршрутизатор Edge_Router (192.168.10.17) и маршрутизатор ISP1 (10.10.10.1): пакеты к серверу идут по основному каналу.

        ```
        C:\>tracert 198.0.0.10

        Tracing route to 198.0.0.10 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  192.168.10.17
          2     1 ms     1 ms     1 ms  10.10.10.1
          3     2 ms     2 ms     2 ms  198.0.0.10

        Trace complete.
        ```

        **Шаг 3.** Откройте окно компьютера PC-B и в приложении «Командная строка» проверьте связь с сервером по IPv6 командой **ping 2001:db8:f:f::10**. Сервер отвечает.

        ```
        C:\>ping 2001:db8:f:f::10

        Pinging 2001:DB8:F:F::10 with 32 bytes of data:

        Reply from 2001:DB8:F:F::10: bytes=32 time=3ms TTL=126
        Reply from 2001:DB8:F:F::10: bytes=32 time=2ms TTL=126
        Reply from 2001:DB8:F:F::10: bytes=32 time=2ms TTL=126
        Reply from 2001:DB8:F:F::10: bytes=32 time=2ms TTL=126

        Ping statistics for 2001:DB8:F:F::10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 3ms, Average = 2ms
        ```

        **Шаг 4.** Выполните трассировку маршрута до сервера командой **tracert 2001:db8:f:f::10**. Путь проходит через маршрутизатор Edge_Router (2001:DB8:1:11::1) и маршрутизатор ISP1 (2001:DB8:A:1::1).

        ```
        C:\>tracert 2001:db8:f:f::10

        Tracing route to 2001:DB8:F:F::10 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  2001:DB8:1:11::1
          2     1 ms     1 ms     1 ms  2001:DB8:A:1::1
          3     2 ms     2 ms     2 ms  2001:DB8:F:F::10

        Trace complete.
        ```

        **Шаг 5.** Проверьте переход на резервный канал. В консоли маршрутизатора Edge_Router перейдите в режим глобальной конфигурации командой **configure terminal**, затем в режим конфигурации интерфейса S0/0/0 командой **interface s0/0/0** и выключите интерфейс командой **shutdown**. Канал к маршрутизатору ISP1 отключается: интерфейс переходит в состояние administratively down.

        ```
        Edge_Router#configure terminal
