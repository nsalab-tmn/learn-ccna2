        ```

        **Шаг 6.** В приложении «Командная строка» компьютера PC-A снова проверьте связь с сервером командой **ping 198.0.0.10**. Сервер отвечает, теперь с TTL=125.

        ```
        C:\>ping 198.0.0.10

        Pinging 198.0.0.10 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 198.0.0.10: bytes=32 time=2ms TTL=125
        Reply from 198.0.0.10: bytes=32 time=2ms TTL=125

