        **Примечание.** Основные маршруты IPv4 через канал S0/0/0 пропали из таблиц маршрутизации вместе с каналом, и маршрутизаторы пользуются плавающими маршрутами. Сервер по-прежнему отправляет ответы своему шлюзу ISP1, а ISP1 передает их по плавающим маршрутам через ISP2. Поэтому обратный путь проходит через три маршрутизатора, и TTL на единицу меньше.

        **Шаг 7.** Выполните трассировку маршрута до сервера командой **tracert 198.0.0.10**. Второй переход теперь — маршрутизатор ISP2 (10.10.10.5).

        ```
