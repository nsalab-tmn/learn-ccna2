name: 4.4.8 Troubleshoot Inter-VLAN Routing
devices:
- name: R1
  type: router
  model: NR01
  simulated: true
  position:
    x: 420
    y: 40
  hostname: R1
  config: |-
    hostname R1
    interface GigabitEthernet0/1
     no shutdown
    interface GigabitEthernet0/1.10
     encapsulation dot1Q 30
     ip address 172.17.10.1 255.255.255.0
     shutdown
    interface GigabitEthernet0/1.30
     encapsulation dot1Q 10
     ip address 172.17.30.1 255.255.255.0
- name: S1
  type: switch
  model: NS01
  simulated: true
  position:
    x: 420
    y: 220
  hostname: S1
  config: |-
    hostname S1
    vlan 10
    vlan 30
    interface FastEthernet0/11
     switchport mode access
     switchport access vlan 10
    interface FastEthernet0/6
     switchport mode access
     switchport access vlan 30
    interface GigabitEthernet0/1
     switchport mode access
- name: PC1
  type: pc
  model: NPC
  simulated: true
  position:
    x: 160
    y: 230
  config: ipconfig 172.17.10.10 255.255.255.0 172.17.10.1
- name: PC3
  type: pc
  model: NPC
  simulated: true
  position:
    x: 680
    y: 230
  config: ipconfig 172.17.30.10 255.255.255.0 172.17.10.1
