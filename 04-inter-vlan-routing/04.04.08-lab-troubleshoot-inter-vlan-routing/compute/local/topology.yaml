scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | R1 | G0/1 | S1 | G0/1 |
        | Медный | PC1 | F0 | S1 | F0/11 |
        | Медный | PC3 | F0 | S1 | F0/6 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию | VLAN |
        |---|---|---|---|---|---|
        | R1 | G0/1.10 | 172.17.10.1 | 255.255.255.0 | — | 10 |
        | R1 | G0/1.30 | 172.17.30.1 | 255.255.255.0 | — | 30 |
        | PC1 | NIC | 172.17.10.10 | 255.255.255.0 | 172.17.10.1 | 10 |
        | PC3 | NIC | 172.17.30.10 | 255.255.255.0 | 172.17.30.1 | 30 |

        Таблица адресации задает требуемые значения: по ним проверяется конфигурация устройств.
    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе R1 включен интерфейс G0/1 и созданы подинтерфейсы G0/1.10 и G0/1.30 с IP-адресами из таблицы адресации.
        - На коммутаторе S1 созданы сети VLAN 10 и 30. Порт F0/11, к которому подключен компьютер PC1, — порт доступа сети VLAN 10, а порт F0/6, к которому подключен компьютер PC3, — порт доступа сети VLAN 30.
        - На компьютерах PC1 и PC3 заданы IP-адреса, маски подсети и шлюзы по умолчанию.
        - В конфигурации устройств есть неполадки, из-за которых связь не работает. Сколько их и на каких устройствах они находятся, вам предстоит выяснить.

        В начальном состоянии компьютер PC1 не получает ответов ни от своего шлюза, маршрутизатора R1 (**ping 172.17.10.1** в приложении «Командная строка»), ни от компьютера PC3 (**ping 172.17.30.10**):

        ```
        C:\>ping 172.17.10.1

        Pinging 172.17.10.1 with 32 bytes of data:

        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.

        Ping statistics for 172.17.10.1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        ```
        C:\>ping 172.17.30.10

        Pinging 172.17.30.10 with 32 bytes of data:

        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.

        Ping statistics for 172.17.30.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для поиска и устранения неполадок вы выбираете сами. Найдите и устраните все неполадки, мешающие связи, так, чтобы выполнялись все требования.
    - title: "Проверка подинтерфейсов маршрутизатора R1"
      body: |
        **Требование 1.** Подинтерфейсы G0/1.10 и G0/1.30 маршрутизатора R1 включены: ни один из них не находится в состоянии administratively down.

        **Требование 2.** Подинтерфейс G0/1.10 принимает и отправляет кадры с тегом 802.1Q сети VLAN 10, а подинтерфейс G0/1.30 — с тегом сети VLAN 30: у каждого из них задана инкапсуляция dot1Q с номером своей сети VLAN.
    - title: "Проверка порта коммутатора S1"
      body: |
        **Требование 3.** Порт G0/1 коммутатора S1, к которому подключен маршрутизатор R1, работает как магистральный канал (trunk) и передает маршрутизатору кадры сетей VLAN 10 и 30.
    - title: "Проверка настроек компьютеров"
      body: |
        **Требование 4.** На компьютерах PC1 и PC3 IP-адреса, маски подсети и шлюзы по умолчанию совпадают с таблицей адресации. Шлюз по умолчанию каждого компьютера — адрес подинтерфейса маршрутизатора R1 в сети VLAN этого компьютера: у PC1 — 172.17.10.1, у PC3 — 172.17.30.1.
    - title: "Проверка связи"
      body: |
        Когда все требования выполнены, проверьте результат.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с его шлюзом командой **ping 172.17.10.1**. Маршрутизатор R1 отвечает.

        ```
        C:\>ping 172.17.10.1

        Pinging 172.17.10.1 with 32 bytes of data:

        Reply from 172.17.10.1: bytes=32 time=1ms TTL=255
        Reply from 172.17.10.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.10.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.10.1: bytes=32 time<1ms TTL=255

        Ping statistics for 172.17.10.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 2.** Проверьте связь с компьютером PC3 командой **ping 172.17.30.10**. Компьютер PC3 отвечает: маршрутизатор R1 передает пакеты между сетями VLAN 10 и 30. Значение TTL=127 показывает, что ответ прошел через один маршрутизатор.

        ```
        C:\>ping 172.17.30.10

        Pinging 172.17.30.10 with 32 bytes of data:

        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127

        Ping statistics for 172.17.30.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Откройте окно компьютера PC3 и в приложении «Командная строка» проверьте связь с его шлюзом командой **ping 172.17.30.1**. Маршрутизатор R1 отвечает.

        ```
        C:\>ping 172.17.30.1

        Pinging 172.17.30.1 with 32 bytes of data:

        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255

        Ping statistics for 172.17.30.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 4.** Проверьте связь с компьютером PC1 командой **ping 172.17.10.10**. Компьютер PC1 отвечает.

        ```
