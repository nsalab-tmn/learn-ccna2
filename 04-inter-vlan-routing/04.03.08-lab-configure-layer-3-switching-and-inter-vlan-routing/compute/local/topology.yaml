    - title: "Начальное состояние"
      body: |
        - На коммутаторах S1, S2 и S3 созданы сети VLAN 10 Staff, 20 Student, 30 Faculty и 99 Management, а интерфейсам VLAN 99 назначены IP-адреса по таблице адресации. Порты F0/1–F0/3 коммутаторов S2 и S3 — порты доступа сетей VLAN 10, 20 и 30, а соединения S1–S2 и S1–S3 — магистральные каналы (trunk) с собственной VLAN (native VLAN) 99. Порт G0/1 коммутатора S1, к которому подключен коммутатор MLS, не настроен.
        - На многоуровневом коммутаторе MLS созданы только сеть VLAN 99 Management и статические маршруты по умолчанию IPv4 и IPv6 к маршрутизатору Cloud. Остальные параметры имеют значения по умолчанию: маршрутизация выключена, а все порты — порты коммутатора.
        - На компьютерах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации, а на компьютерах PC3, PC4 и PC5 — также IPv6-адреса.
        - Маршрутизатор Cloud изображает сеть провайдера и уже настроен: маршруты к сетям 192.168.0.0/16 и 2001:db8:acad::/48 ведут у него к коммутатору MLS.

        **Шаг 1.** Откройте окно компьютера PC0 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC3 командой **ping 192.168.10.2**. Эхо-запросы выполняются успешно: PC0 и PC3 находятся в одной сети VLAN 10, и ее кадры проходят от коммутатора S2 к S3 через магистральные каналы коммутатора S1.

        **Шаг 2.** Проверьте связь со шлюзом по умолчанию командой **ping 192.168.10.254**. Эхо-запросы не выполняются: сообщение «Destination host unreachable» выдает сам компьютер PC0 (192.168.10.1), потому что адрес шлюза пока не назначен ни одному устройству.

        ```
        C:\>ping 192.168.10.2

        Pinging 192.168.10.2 with 32 bytes of data:

        Reply from 192.168.10.2: bytes=32 time=3ms TTL=128
        Reply from 192.168.10.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.2: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.10.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 3ms, Average = 1ms

        C:\>ping 192.168.10.254

        Pinging 192.168.10.254 with 32 bytes of data:

        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.

        Ping statistics for 192.168.10.254:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 3.** Откройте консоль коммутатора MLS и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 4.** Выведите список сетей VLAN командой **show vlan brief**. Кроме сетей VLAN по умолчанию на коммутаторе MLS есть только сеть VLAN 99 Management, а все порты, включая G0/1 и G0/2, назначены сети VLAN 1.

        ```
        MLS>enable
        MLS#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/6, Fa0/7, Fa0/8
                                                        Fa0/9, Fa0/10, Fa0/11, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
                                                        Fa0/17, Fa0/18, Fa0/19, Fa0/20
                                                        Fa0/21, Fa0/22, Fa0/23, Fa0/24
                                                        Gi0/1, Gi0/2
        99   Management                       active
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```
    - title: "Настройка маршрутизируемого порта"
      body: |
        **Примечание.** Порт многоуровневого коммутатора по умолчанию — порт коммутатора (switchport): он передает кадры своей сети VLAN. Команда **no switchport** делает порт маршрутизируемым — интерфейсом уровня 3 с собственным IP-адресом, как интерфейс маршрутизатора. Такой порт подключают к другому устройству уровня 3, здесь — к маршрутизатору провайдера.

        **Шаг 1.** На коммутаторе MLS перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/2 командой **interface g0/2**.

        **Шаг 2.** Сделайте порт маршрутизируемым командой **no switchport** и назначьте ему IP-адрес командой **ip address 209.165.200.225 255.255.255.252**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        MLS#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        MLS(config)#interface g0/2
        MLS(config-if)#no switchport
        MLS(config-if)#ip address 209.165.200.225 255.255.255.252
        MLS(config-if)#end
        *Mar  1 00:01:13.302: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Убедитесь с помощью команды **show ip interface brief | exclude unassigned**, что у интерфейса G0/2 есть IP-адрес 209.165.200.225 и он находится в состоянии up (столбцы «Status» и «Protocol»). Фильтр **| exclude unassigned** скрывает строки интерфейсов без IP-адреса.

        ```
        MLS#show ip interface brief | exclude unassigned
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/2         209.165.200.225 YES manual up                    up
        ```

        **Шаг 4.** Проверьте связь с маршрутизатором провайдера командой **ping 209.165.200.226**. Маршрутизатор отвечает. Первый эхо-запрос остается без ответа (символ «.»): в это время коммутатор определяет MAC-адрес получателя по протоколу ARP.

        ```
        MLS#ping 209.165.200.226
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 209.165.200.226, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```
    - title: "Создание сетей VLAN и интерфейсов SVI"
      body: |
        **Шаг 1.** На коммутаторе MLS перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте сеть VLAN 10 командой **vlan 10** и присвойте ей имя Staff командой **name Staff**. Имена сетей VLAN чувствительны к регистру, поэтому вводите их точно так, как они написаны.

        **Шаг 3.** Аналогично создайте сеть VLAN 20 с именем Student и сеть VLAN 30 с именем Faculty. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        MLS#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        MLS(config)#vlan 10
        MLS(config-vlan)#name Staff
        MLS(config-vlan)#vlan 20
        MLS(config-vlan)#name Student
        MLS(config-vlan)#vlan 30
        MLS(config-vlan)#name Faculty
        MLS(config-vlan)#end
        *Mar  1 00:01:48.428: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Убедитесь с помощью команды **show vlan brief**, что сети VLAN 10, 20 и 30 созданы. Порта G0/2 больше нет в списке портов сети VLAN 1: маршрутизируемый порт не принадлежит ни одной сети VLAN.

        ```
        MLS#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/6, Fa0/7, Fa0/8
                                                        Fa0/9, Fa0/10, Fa0/11, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
                                                        Fa0/17, Fa0/18, Fa0/19, Fa0/20
                                                        Fa0/21, Fa0/22, Fa0/23, Fa0/24
                                                        Gi0/1
        10   Staff                            active
        20   Student                          active
        30   Faculty                          active
        99   Management                       active
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Примечание.** Интерфейс SVI (коммутируемый виртуальный интерфейс) — это интерфейс уровня 3 для сети VLAN, который создает команда **interface vlan**. IP-адрес интерфейса SVI служит шлюзом по умолчанию для узлов этой сети VLAN, и через интерфейсы SVI коммутатор маршрутизирует пакеты между сетями VLAN.

        **Шаг 5.** Перейдите в режим глобальной конфигурации командой **configure terminal** и создайте интерфейс SVI сети VLAN 10 командой **interface vlan 10**. Назначьте ему IP-адрес командой **ip address 192.168.10.254 255.255.255.0** и включите его командой **no shutdown**.

        **Шаг 6.** Аналогично настройте интерфейсы SVI остальных сетей VLAN: VLAN 20 с адресом 192.168.20.254, VLAN 30 с адресом 192.168.30.254 и VLAN 99 с адресом 192.168.99.254, все с маской 255.255.255.0. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        MLS#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        MLS(config)#interface vlan 10
        MLS(config-if)#ip address 192.168.10.254 255.255.255.0
        MLS(config-if)#no shutdown
        MLS(config-if)#interface vlan 20
        MLS(config-if)#ip address 192.168.20.254 255.255.255.0
        MLS(config-if)#no shutdown
        MLS(config-if)#interface vlan 30
        MLS(config-if)#ip address 192.168.30.254 255.255.255.0
        MLS(config-if)#no shutdown
        MLS(config-if)#interface vlan 99
        MLS(config-if)#ip address 192.168.99.254 255.255.255.0
        MLS(config-if)#no shutdown
        MLS(config-if)#end
        *Mar  1 00:02:32.690: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 7.** Выведите состояние интерфейсов SVI командой **show ip interface brief | include Vlan**. У интерфейсов есть IP-адреса, но в столбце «Protocol» указано down: на коммутаторе MLS еще нет ни одного работающего порта этих сетей VLAN, потому что они пока не доходят до него от коммутатора S1.

        ```
        MLS#show ip interface brief | include Vlan
        Vlan1                      unassigned      YES unset  administratively down down
        Vlan10                     192.168.10.254  YES manual up                    down
        Vlan20                     192.168.20.254  YES manual up                    down
        Vlan30                     192.168.30.254  YES manual up                    down
        Vlan99                     192.168.99.254  YES manual up                    down
        ```
    - title: "Настройка магистрального канала"
      body: |
        **Шаг 1.** На коммутаторе MLS перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/1 командой **interface g0/1**.

        **Шаг 2.** Переведите порт в режим магистрального канала командой **switchport mode trunk**. Интерфейсы SVI сетей VLAN 10, 20, 30 и 99 переходят в состояние up: магистральный канал передает кадры всех сетей VLAN.

        **Шаг 3.** Сделайте собственной VLAN магистрального канала сеть VLAN 99 командой **switchport trunk native vlan 99** и вернитесь в привилегированный режим EXEC командой **end**. Сообщение NATIVE_VLAN_MISMATCH означает, что у соседнего порта G0/1 коммутатора S1 собственная VLAN пока сеть VLAN 1.

        ```
        MLS#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        MLS(config)#interface g0/1
        MLS(config-if)#switchport mode trunk
        *Mar  1 00:02:44.132: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan10, changed state to up
        *Mar  1 00:02:44.132: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan20, changed state to up
        *Mar  1 00:02:44.132: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan30, changed state to up
        *Mar  1 00:02:44.132: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan99, changed state to up
        MLS(config-if)#switchport trunk native vlan 99
        *Mar  1 00:02:47.246: %CDP-4-NATIVE_VLAN_MISMATCH: Native VLAN mismatch discovered on GigabitEthernet0/1 (99), with S1 GigabitEthernet0/1 (1).
        MLS(config-if)#end
        *Mar  1 00:02:50.356: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** На коммутаторах, которые поддерживают две инкапсуляции магистрального канала, перед командой **switchport mode trunk** задают инкапсуляцию 802.1Q командой **switchport trunk encapsulation dot1q**. Коммутатор MLS поддерживает только 802.1Q, поэтому здесь эта команда не нужна.

        **Шаг 4.** Откройте консоль коммутатора S1, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 5.** Аналогично настройте порт G0/1 коммутатора S1: **configure terminal**, **interface g0/1**, **switchport mode trunk**, **switchport trunk native vlan 99**, **end**.

        ```
        S1>enable
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#interface g0/1
        S1(config-if)#switchport mode trunk
        *Mar  1 00:03:04.210: %CDP-4-NATIVE_VLAN_MISMATCH: Native VLAN mismatch discovered on GigabitEthernet0/1 (1), with MLS GigabitEthernet0/1 (99).
        S1(config-if)#switchport trunk native vlan 99
        S1(config-if)#end
        *Mar  1 00:03:10.434: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 6.** Убедитесь с помощью команды **show interfaces trunk**, что порт G0/1 коммутатора S1 работает как магистральный канал (столбец «Status» — trunking) с собственной VLAN 99, как и порты F0/1 и F0/2 к коммутаторам S2 и S3.

        ```
        S1#show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Fa0/1       on               802.1q         trunking      99
        Fa0/2       on               802.1q         trunking      99
        Gi0/1       on               802.1q         trunking      99

        Port        Vlans allowed on trunk
        Fa0/1       1-4094
        Fa0/2       1-4094
        Gi0/1       1-4094

        Port        Vlans allowed and active in management domain
        Fa0/1       1,10,20,30,99,1002-1005
        Fa0/2       1,10,20,30,99,1002-1005
        Gi0/1       1,10,20,30,99,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Fa0/1       1,10,20,30,99,1002-1005
        Fa0/2       1,10,20,30,99,1002-1005
        Gi0/1       1,10,20,30,99,1002-1005
        ```

        **Шаг 7.** На коммутаторе MLS снова выведите состояние интерфейсов SVI командой **show ip interface brief | include Vlan**. Теперь у интерфейсов VLAN 10, 20, 30 и 99 в столбцах «Status» и «Protocol» указано up.

        ```
        MLS#show ip interface brief | include Vlan
        Vlan1                      unassigned      YES unset  administratively down down
        Vlan10                     192.168.10.254  YES manual up                    up
        Vlan20                     192.168.20.254  YES manual up                    up
        Vlan30                     192.168.30.254  YES manual up                    up
        Vlan99                     192.168.99.254  YES manual up                    up
        ```

        **Шаг 8.** В приложении «Командная строка» компьютера PC0 снова проверьте связь со шлюзом по умолчанию командой **ping 192.168.10.254**: шлюз отвечает. Затем проверьте связь с компьютером PC1 из сети VLAN 20 командой **ping 192.168.20.1**. Эхо-запросы к PC1 не выполняются: коммутатор MLS получает пакеты для другой сети VLAN, но пока не маршрутизирует их.

        ```
        C:\>ping 192.168.10.254

        Pinging 192.168.10.254 with 32 bytes of data:

        Reply from 192.168.10.254: bytes=32 time=2ms TTL=255
        Reply from 192.168.10.254: bytes=32 time=1ms TTL=255
        Reply from 192.168.10.254: bytes=32 time=1ms TTL=255
        Reply from 192.168.10.254: bytes=32 time=1ms TTL=255

        Ping statistics for 192.168.10.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms

        C:\>ping 192.168.20.1

        Pinging 192.168.20.1 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 192.168.20.1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Включение маршрутизации IPv4"
      body: |
        **Шаг 1.** На коммутаторе MLS выведите таблицу маршрутизации командой **show ip route** и посмотрите, есть ли в ней маршруты.

        ```
        MLS#show ip route
        Default gateway is not set

        Host               Gateway           Last Use    Total Uses  Interface
        ICMP redirect cache is empty
        ```

        **Шаг 2.** Ответьте на вопрос 1 в форме ответов.

        **Примечание.** По умолчанию маршрутизация на многоуровневом коммутаторе выключена: он работает как узел сети и использует свои IP-адреса только для связи с ним самим. Команда **ip routing** включает маршрутизацию IPv4, и подключенные сети интерфейсов SVI и маршрутизируемого порта появляются в таблице маршрутизации вместе с заданным заранее статическим маршрутом по умолчанию.

        **Шаг 3.** Перейдите в режим глобальной конфигурации командой **configure terminal**, включите маршрутизацию IPv4 командой **ip routing** и вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 4.** Снова выведите таблицу маршрутизации командой **show ip route**. В ней есть подключенные сети (код C) сетей VLAN 10, 20, 30 и 99 и интерфейса G0/2, а также статический маршрут по умолчанию (код S*) через маршрутизатор Cloud 209.165.200.226.

        ```
        MLS#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        MLS(config)#ip routing
        MLS(config)#end
        *Mar  1 00:04:00.435: %SYS-5-CONFIG_I: Configured from console by console
        MLS#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 209.165.200.226 to network 0.0.0.0

        S*    0.0.0.0/0 [1/0] via 209.165.200.226
              192.168.10.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.10.0/24 is directly connected, Vlan10
        L        192.168.10.254/32 is directly connected, Vlan10
              192.168.20.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.20.0/24 is directly connected, Vlan20
        L        192.168.20.254/32 is directly connected, Vlan20
              192.168.30.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.30.0/24 is directly connected, Vlan30
        L        192.168.30.254/32 is directly connected, Vlan30
              192.168.99.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.99.0/24 is directly connected, Vlan99
        L        192.168.99.254/32 is directly connected, Vlan99
              209.165.200.0/24 is variably subnetted, 2 subnets, 2 masks
        C        209.165.200.224/30 is directly connected, GigabitEthernet0/2
        L        209.165.200.225/32 is directly connected, GigabitEthernet0/2
        ```

        **Шаг 5.** В приложении «Командная строка» компьютера PC0 проверьте связь с компьютером PC4 из сети VLAN 20 командой **ping 192.168.20.2**. Эхо-запросы выполняются успешно: коммутатор MLS маршрутизирует пакеты между сетями VLAN 10 и 20. Первый эхо-запрос может остаться без ответа, пока коммутатор определяет MAC-адрес получателя по протоколу ARP.

        ```
        C:\>ping 192.168.20.2

        Pinging 192.168.20.2 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.20.2: bytes=32 time=2ms TTL=127
        Reply from 192.168.20.2: bytes=32 time=2ms TTL=127
        Reply from 192.168.20.2: bytes=32 time=2ms TTL=127

        Ping statistics for 192.168.20.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 6.** Откройте окно компьютера PC2 и в приложении «Командная строка» проверьте связь с маршрутизатором провайдера командой **ping 209.165.200.226**. Эхо-запросы выполняются успешно: пакеты из сети VLAN 30 уходят к провайдеру по маршруту по умолчанию.

        ```
        C:\>ping 209.165.200.226

        Pinging 209.165.200.226 with 32 bytes of data:

        Reply from 209.165.200.226: bytes=32 time=2ms TTL=254
        Reply from 209.165.200.226: bytes=32 time=1ms TTL=254
        Reply from 209.165.200.226: bytes=32 time=1ms TTL=254
        Reply from 209.165.200.226: bytes=32 time=1ms TTL=254

        Ping statistics for 209.165.200.226:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 7.** На коммутаторе S1 проверьте связь с интерфейсом SVI сети VLAN 99 коммутатора MLS командой **ping 192.168.99.254**. Коммутатор MLS отвечает: сеть управления VLAN 99 доходит до него по магистральному каналу.

        ```
        S1#ping 192.168.99.254
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.99.254, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```
    - title: "Настройка маршрутизации IPv6"
      body: |
        **Шаг 1.** На коммутаторе MLS перейдите в режим глобальной конфигурации командой **configure terminal** и включите маршрутизацию IPv6 командой **ipv6 unicast-routing**.

        **Шаг 2.** Перейдите к настройке интерфейса SVI сети VLAN 10 командой **interface vlan 10** и назначьте ему IPv6-адрес командой **ipv6 address 2001:db8:acad:10::1/64**.

        **Шаг 3.** Аналогично назначьте IPv6-адреса интерфейсам SVI сетей VLAN 20 (2001:db8:acad:20::1/64) и VLAN 30 (2001:db8:acad:30::1/64) и маршрутизируемому порту G0/2 (**interface g0/2**, адрес 2001:db8:acad:a::1/64). Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        MLS#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        MLS(config)#ipv6 unicast-routing
        MLS(config)#interface vlan 10
        MLS(config-if)#ipv6 address 2001:db8:acad:10::1/64
        MLS(config-if)#interface vlan 20
        MLS(config-if)#ipv6 address 2001:db8:acad:20::1/64
        MLS(config-if)#interface vlan 30
        MLS(config-if)#ipv6 address 2001:db8:acad:30::1/64
        MLS(config-if)#interface g0/2
        MLS(config-if)#ipv6 address 2001:db8:acad:a::1/64
        MLS(config-if)#end
        *Mar  1 00:05:17.728: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Выведите таблицу маршрутизации IPv6 командой **show ipv6 route**. В ней есть подключенные сети (код C) и локальные адреса (код L) интерфейсов VLAN 10, 20, 30 и G0/2, а также статический маршрут по умолчанию ::/0 (код S) через маршрутизатор Cloud 2001:DB8:ACAD:A::2.

        ```
        MLS#show ipv6 route
        IPv6 Routing Table - default - 10 entries
        Codes: C - Connected, L - Local, S - Static, U - Per-user Static route
               B - BGP, R - RIP, I1 - ISIS L1, I2 - ISIS L2
               IA - ISIS interarea, IS - ISIS summary, D - EIGRP, EX - EIGRP external
               ND - Neighbor Discovery
               O - OSPF Intra, OI - OSPF Inter, OE1 - OSPF ext 1, OE2 - OSPF ext 2
               ON1 - OSPF NSSA ext 1, ON2 - OSPF NSSA ext 2
        S   ::/0 [1/0]
             via 2001:DB8:ACAD:A::2
        C   2001:DB8:ACAD:A::/64 [0/0]
             via GigabitEthernet0/2, directly connected
        L   2001:DB8:ACAD:A::1/128 [0/0]
             via GigabitEthernet0/2, receive
        C   2001:DB8:ACAD:10::/64 [0/0]
             via Vlan10, directly connected
        L   2001:DB8:ACAD:10::1/128 [0/0]
             via Vlan10, receive
        C   2001:DB8:ACAD:20::/64 [0/0]
             via Vlan20, directly connected
        L   2001:DB8:ACAD:20::1/128 [0/0]
             via Vlan20, receive
        C   2001:DB8:ACAD:30::/64 [0/0]
             via Vlan30, directly connected
        L   2001:DB8:ACAD:30::1/128 [0/0]
             via Vlan30, receive
        L   FF00::/8 [0/0]
             via Null0, receive
        ```
    - title: "Проверка связи по IPv6"
      body: |
        **Шаг 1.** Откройте окно компьютера PC3 и в приложении «Командная строка» проверьте связь со шлюзом по умолчанию командой **ping 2001:db8:acad:10::1**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 2001:db8:acad:10::1

        Pinging 2001:DB8:ACAD:10::1 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:10::1: bytes=32 time=2ms TTL=64
        Reply from 2001:DB8:ACAD:10::1: bytes=32 time=1ms TTL=64
        Reply from 2001:DB8:ACAD:10::1: bytes=32 time=1ms TTL=64
        Reply from 2001:DB8:ACAD:10::1: bytes=32 time=1ms TTL=64

        Ping statistics for 2001:DB8:ACAD:10::1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 2.** Проверьте связь с компьютером PC5 из сети VLAN 30 командой **ping 2001:db8:acad:30::2**. Эхо-запросы выполняются успешно: коммутатор MLS маршрутизирует пакеты IPv6 между сетями VLAN.

        ```
        C:\>ping 2001:db8:acad:30::2

        Pinging 2001:DB8:ACAD:30::2 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=3ms TTL=127
        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=2ms TTL=127
        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=2ms TTL=127
        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=2ms TTL=127

        Ping statistics for 2001:DB8:ACAD:30::2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 3ms, Average = 2ms
        ```

        **Шаг 3.** Откройте окно компьютера PC4 и в приложении «Командная строка» проверьте связь с компьютером PC5 командой **ping 2001:db8:acad:30::2**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 2001:db8:acad:30::2

        Pinging 2001:DB8:ACAD:30::2 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=3ms TTL=127
        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=2ms TTL=127
        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=2ms TTL=127
        Reply from 2001:DB8:ACAD:30::2: bytes=32 time=2ms TTL=127

        Ping statistics for 2001:DB8:ACAD:30::2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 3ms, Average = 2ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC3 проверьте связь с маршрутизатором провайдера командой **ping 2001:db8:acad:a::2**. Эхо-запросы выполняются успешно: пакеты IPv6 уходят к провайдеру по маршруту по умолчанию.

        ```
        C:\>ping 2001:db8:acad:a::2

        Pinging 2001:DB8:ACAD:A::2 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:A::2: bytes=32 time=2ms TTL=63
        Reply from 2001:DB8:ACAD:A::2: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:ACAD:A::2: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:ACAD:A::2: bytes=32 time=1ms TTL=63

        Ping statistics for 2001:DB8:ACAD:A::2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```
