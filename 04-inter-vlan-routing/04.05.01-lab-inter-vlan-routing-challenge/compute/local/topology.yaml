        | VLAN | Имя | Порты коммутатора S1 |
        |---|---|---|
        | 10 | Faculty/Staff | F0/11–F0/17 |
        | 20 | Students | F0/18–F0/24 |
        | 30 | Guest(Default) | F0/6–F0/10 |
        | 88 | Native | собственная VLAN магистрального канала G0/1 |
        | 99 | Management | интерфейс управления коммутатора |
    - title: "Начальное состояние"
      body: |
        - На коммутаторе S1 задано только имя устройства, остальные параметры имеют значения по умолчанию.
        - На маршрутизаторе R1 заданы имя устройства, IP-адрес интерфейса G0/0 по таблице адресации и статический маршрут к сети сервера 172.17.50.0/24 через маршрутизатор HQ (172.17.25.1).
        - Маршрутизатор HQ настроен: он подключает сеть сервера и знает маршрут к сетям 172.17.0.0/16 через маршрутизатор R1. Его консоль со схемы не открывается.
        - На компьютерах и сервере заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.

        В начальном состоянии компьютер PC1 не получает ответов на эхо-запросы от сервера (**ping 172.17.50.254** в приложении «Командная строка»): сообщение «Destination host unreachable» выдает сам PC1, потому что его шлюз по умолчанию 172.17.10.1 пока никому не принадлежит.

        ```
        C:\>ping 172.17.50.254

        Pinging 172.17.50.254 with 32 bytes of data:

        Reply from 172.17.10.21: Destination host unreachable.
        Reply from 172.17.10.21: Destination host unreachable.
        Reply from 172.17.10.21: Destination host unreachable.
        Reply from 172.17.10.21: Destination host unreachable.

        Ping statistics for 172.17.50.254:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Создание сетей VLAN и назначение портов"
      body: |
        **Требование 1.** На коммутаторе S1 созданы сети VLAN из таблицы VLAN с указанными в ней именами: 10 Faculty/Staff, 20 Students, 30 Guest(Default), 88 Native и 99 Management. Имена сетей VLAN чувствительны к регистру, поэтому они должны совпадать с таблицей точно.

        **Требование 2.** Порты коммутатора S1 работают в режиме порта доступа и назначены сетям VLAN по таблице VLAN: F0/11–F0/17 — сети VLAN 10, F0/18–F0/24 — сети VLAN 20, F0/6–F0/10 — сети VLAN 30.

        **Требование 3.** Все порты коммутатора S1, которые не назначены ни одной сети VLAN и не используются для магистрального канала, — F0/1–F0/5 и G0/2, — выключены.
    - title: "Настройка магистрального канала"
      body: |
        **Требование 4.** Порт G0/1 коммутатора S1, к которому подключен маршрутизатор R1, статически работает в режиме магистрального канала (trunk).

        **Требование 5.** Собственная VLAN (native VLAN) магистрального канала G0/1 — VLAN 88.

        **Примечание.** Маршрутизатор не согласует режим порта с коммутатором, поэтому порт коммутатора в сторону маршрутизатора переводят в режим магистрального канала вручную. Кадры собственной VLAN передаются по магистральному каналу без тега, и на маршрутизаторе их принимает подинтерфейс, назначенный собственной VLAN.
    - title: "Настройка интерфейса управления"
      body: |
        **Требование 6.** Интерфейс сети VLAN 99 коммутатора S1 включен и имеет IP-адрес 172.17.99.10 с маской 255.255.255.0.

        **Требование 7.** Шлюз по умолчанию коммутатора S1 — 172.17.99.1, адрес маршрутизатора R1 в сети VLAN 99: через него коммутатор отвечает узлам других сетей.
    - title: "Настройка маршрутизации между VLAN"
      body: |
        **Требование 8.** Интерфейсы G0/0 и G0/1 маршрутизатора R1 включены.

        **Требование 9.** На интерфейсе G0/1 маршрутизатора R1 для каждой сети VLAN из таблицы VLAN есть подинтерфейс с инкапсуляцией 802.1Q (dot1Q) и номером своей сети VLAN: G0/1.10 — VLAN 10, G0/1.20 — VLAN 20, G0/1.30 — VLAN 30, G0/1.88 — VLAN 88, G0/1.99 — VLAN 99. IP-адреса и маски подсети подинтерфейсов — из таблицы адресации.

        **Требование 10.** Подинтерфейс G0/1.88 принимает и отправляет кадры собственной VLAN 88 без тега: инкапсуляция dot1Q на нем задана с параметром native.
    - title: "Проверка связи"
      body: |
        Когда все требования выполнены, дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым: после включения интерфейсов маршрутизатора на это уходит около 30 секунд. Затем проверьте результат. Первые эхо-запросы каждой проверки могут остаться без ответа: в это время устройства определяют MAC-адреса друг друга по протоколу ARP.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с сервером командой **ping 172.17.50.254**. Сервер отвечает: пакеты проходят через маршрутизаторы R1 и HQ (TTL=126).

        ```
        C:\>ping 172.17.50.254

        Pinging 172.17.50.254 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 172.17.50.254: bytes=32 time=1ms TTL=126
        Reply from 172.17.50.254: bytes=32 time=1ms TTL=126

        Ping statistics for 172.17.50.254:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** Проверьте связь с компьютером PC2 сети VLAN 20 командой **ping 172.17.20.22**. Компьютер PC2 отвечает: маршрутизатор R1 передает пакеты между сетями VLAN 10 и 20.

        ```
        C:\>ping 172.17.20.22

        Pinging 172.17.20.22 with 32 bytes of data:

        Request timed out.
        Reply from 172.17.20.22: bytes=32 time=1ms TTL=127
        Reply from 172.17.20.22: bytes=32 time=1ms TTL=127
        Reply from 172.17.20.22: bytes=32 time=1ms TTL=127

        Ping statistics for 172.17.20.22:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Откройте окно компьютера PC3 и в приложении «Командная строка» проверьте связь с интерфейсом управления коммутатора S1 командой **ping 172.17.99.10**. Коммутатор отвечает.

        ```
        C:\>ping 172.17.99.10

        Pinging 172.17.99.10 with 32 bytes of data:

        Request timed out.
        Reply from 172.17.99.10: bytes=32 time=1ms TTL=254
        Reply from 172.17.99.10: bytes=32 time=1ms TTL=254
        Reply from 172.17.99.10: bytes=32 time=1ms TTL=254

        Ping statistics for 172.17.99.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 4.** В консоли коммутатора S1 проверьте связь с сервером командой **ping 172.17.50.254**. Сервер отвечает.

        ```
        S1#ping 172.17.50.254
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 172.17.50.254, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 2/3/5 ms
        ```

        **Шаг 5.** В консоли маршрутизатора R1 проверьте связь с компьютером PC2 командой **ping 172.17.20.22**. Компьютер отвечает.

        ```
        R1#ping 172.17.20.22
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 172.17.20.22, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms
        ```
