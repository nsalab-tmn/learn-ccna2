    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе R1 и коммутаторе S1 задано только имя устройства. Остальные параметры имеют значения по умолчанию: интерфейсы маршрутизатора выключены, а все порты коммутатора назначены сети VLAN 1.
        - На компьютерах PC1 и PC3 заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.

        **Шаг 1.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Выведите список сетей VLAN командой **show vlan brief**. Кроме сетей VLAN по умолчанию, сетей VLAN на коммутаторе нет, и все порты назначены сети VLAN 1.

        ```
        S1>enable
        S1#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/6, Fa0/7, Fa0/8
                                                        Fa0/9, Fa0/10, Fa0/11, Fa0/12
                                                        Fa0/13, Fa0/14, Fa0/15, Fa0/16
                                                        Fa0/17, Fa0/18, Fa0/19, Fa0/20
                                                        Fa0/21, Fa0/22, Fa0/23, Fa0/24
                                                        Gi0/1, Gi0/2
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Шаг 3.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC3 командой **ping 172.17.30.10**. Эхо-запросы не выполняются: PC3 находится в другой IP-сети, поэтому PC1 отправляет пакет своему шлюзу по умолчанию 172.17.10.1, а этот адрес еще не назначен ни одному устройству. Сообщение «Destination host unreachable» выдает сам PC1 (172.17.10.10): он не нашел MAC-адрес шлюза.

        ```
        C:\>ping 172.17.30.10

        Pinging 172.17.30.10 with 32 bytes of data:

        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.

        Ping statistics for 172.17.30.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Создание сетей VLAN"
      body: |
        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте сети VLAN 10 и 30 командами **vlan 10** и **vlan 30**. Имена сетям VLAN не задавайте: они получат имена по умолчанию VLAN0010 и VLAN0030.

        **Шаг 3.** Перейдите к настройке интерфейса F0/11, к которому подключен PC1, командой **interface f0/11**. Переведите его в режим порта доступа командой **switchport mode access** и назначьте сети VLAN 10 командой **switchport access vlan 10**.

        **Шаг 4.** Аналогично назначьте интерфейс F0/6, к которому подключен PC3, сети VLAN 30 (**interface f0/6**, **switchport mode access**, **switchport access vlan 30**). Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#vlan 10
        S1(config-vlan)#vlan 30
        S1(config-vlan)#interface f0/11
        S1(config-if)#switchport mode access
        S1(config-if)#switchport access vlan 10
        S1(config-if)#interface f0/6
        S1(config-if)#switchport mode access
        S1(config-if)#switchport access vlan 30
        S1(config-if)#end
        *Mar  1 00:01:01.096: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Убедитесь с помощью команды **show vlan brief**, что порт F0/11 назначен сети VLAN 10 с именем VLAN0010, а порт F0/6 — сети VLAN 30 с именем VLAN0030.

        ```
        S1#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/7, Fa0/8, Fa0/9
                                                        Fa0/10, Fa0/12, Fa0/13, Fa0/14
                                                        Fa0/15, Fa0/16, Fa0/17, Fa0/18
                                                        Fa0/19, Fa0/20, Fa0/21, Fa0/22
                                                        Fa0/23, Fa0/24, Gi0/1, Gi0/2
        10   VLAN0010                         active    Fa0/11
        30   VLAN0030                         active    Fa0/6
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Шаг 6.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC3 командой **ping 172.17.30.10**. Эхо-запросы не выполняются.

        ```
        C:\>ping 172.17.30.10

        Pinging 172.17.30.10 with 32 bytes of data:

        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.

        Ping statistics for 172.17.30.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 7.** Ответьте на вопрос 1 в форме ответов.
    - title: "Настройка подинтерфейсов"
      body: |
        **Примечание.** Подинтерфейс — логический интерфейс на физическом интерфейсе маршрутизатора: G0/0.10 и G0/0.30 — подинтерфейсы интерфейса G0/0. Команда **encapsulation dot1Q** связывает подинтерфейс с сетью VLAN: маршрутизатор принимает на нем кадры с тегом этой сети VLAN и помечает этим тегом кадры, которые отправляет. Номер подинтерфейса может быть любым, но обычно он совпадает с номером сети VLAN, чтобы конфигурацию было легче читать.

        **Шаг 1.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**, а затем в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте подинтерфейс G0/0.10 командой **interface g0/0.10**. Приглашение изменится на R1(config-subif)#.

        **Шаг 3.** Свяжите подинтерфейс с сетью VLAN 10 командой **encapsulation dot1Q 10** и назначьте ему IP-адрес командой **ip address 172.17.10.1 255.255.255.0**.

        **Шаг 4.** Аналогично создайте подинтерфейс G0/0.30 для сети VLAN 30 с IP-адресом 172.17.30.1 и маской 255.255.255.0 (**interface g0/0.30**, **encapsulation dot1Q 30**, **ip address 172.17.30.1 255.255.255.0**). Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1>enable
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/0.10
        R1(config-subif)#encapsulation dot1Q 10
        R1(config-subif)#ip address 172.17.10.1 255.255.255.0
        R1(config-subif)#interface g0/0.30
        R1(config-subif)#encapsulation dot1Q 30
        R1(config-subif)#ip address 172.17.30.1 255.255.255.0
        R1(config-subif)#end
        *Mar  1 00:01:47.276: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Выведите состояние интерфейсов командой **show ip interface brief**. Подинтерфейсы G0/0.10 и G0/0.30 получили IP-адреса, но выключены (administratively down), как и физический интерфейс G0/0.

        ```
        R1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/0.10      172.17.10.1     YES manual administratively down down
        GigabitEthernet0/0.30      172.17.30.1     YES manual administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        ```

        **Примечание.** Подинтерфейс работает, только когда работает его физический интерфейс. Интерфейсы маршрутизатора по умолчанию выключены, поэтому включить нужно интерфейс G0/0: подинтерфейсы включатся вместе с ним.

        **Шаг 6.** Перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**. Включите его командой **no shutdown** и вернитесь в привилегированный режим EXEC командой **end**. Консоль сообщит, что интерфейс GigabitEthernet0/0 перешел в состояние up.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/0
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:01:59.315: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        R1(config-if)#
        *Mar  1 00:02:00.315: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        R1(config-if)#end
        *Mar  1 00:02:04.337: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 7.** Убедитесь с помощью команды **show ip interface brief**, что интерфейс G0/0 и оба подинтерфейса работают: в столбцах «Status» и «Protocol» — up.

        ```
        R1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  up                    up
        GigabitEthernet0/0.10      172.17.10.1     YES manual up                    up
        GigabitEthernet0/0.30      172.17.30.1     YES manual up                    up
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        ```
    - title: "Настройка магистрального канала"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC3 командой **ping 172.17.30.10**. Эхо-запросы по-прежнему не выполняются.

        ```
        C:\>ping 172.17.30.10

        Pinging 172.17.30.10 with 32 bytes of data:

        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.
        Reply from 172.17.10.10: Destination host unreachable.

        Ping statistics for 172.17.30.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 2.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 3.** На коммутаторе S1 выведите сведения о сетях VLAN командой **show vlan** и найдите в списке портов порт G0/1, к которому подключен маршрутизатор R1.

        ```
        S1#show vlan
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/7, Fa0/8, Fa0/9
                                                        Fa0/10, Fa0/12, Fa0/13, Fa0/14
                                                        Fa0/15, Fa0/16, Fa0/17, Fa0/18
                                                        Fa0/19, Fa0/20, Fa0/21, Fa0/22
                                                        Fa0/23, Fa0/24, Gi0/1, Gi0/2
        10   VLAN0010                         active    Fa0/11
        30   VLAN0030                         active    Fa0/6
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        …
        ```

        **Шаг 4.** Ответьте на вопрос 3 в форме ответов.

        **Примечание.** Маршрутизатор отправляет и принимает через интерфейс G0/0 кадры двух сетей VLAN с тегами 802.1Q. Порт доступа принадлежит одной сети VLAN и передает кадры без тега, поэтому порт коммутатора, к которому подключен маршрутизатор, должен работать как магистральный канал (trunk).

        **Шаг 5.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/1 командой **interface g0/1**. Переведите его в режим магистрального канала командой **switchport mode trunk** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#interface g0/1
        S1(config-if)#switchport mode trunk
        S1(config-if)#end
        *Mar  1 00:02:45.028: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 6.** Выведите список сетей VLAN командой **show vlan brief** и снова найдите в нем порт G0/1.

        ```
        S1#show vlan brief
        VLAN Name                             Status    Ports
        ---- -------------------------------- --------- -------------------------------
        1    default                          active    Fa0/1, Fa0/2, Fa0/3, Fa0/4
                                                        Fa0/5, Fa0/7, Fa0/8, Fa0/9
                                                        Fa0/10, Fa0/12, Fa0/13, Fa0/14
                                                        Fa0/15, Fa0/16, Fa0/17, Fa0/18
                                                        Fa0/19, Fa0/20, Fa0/21, Fa0/22
                                                        Fa0/23, Fa0/24, Gi0/2
        10   VLAN0010                         active    Fa0/11
        30   VLAN0030                         active    Fa0/6
        1002 fddi-default                     act/unsup
        1003 token-ring-default               act/unsup
        1004 fddinet-default                  act/unsup
        1005 trnet-default                    act/unsup
        ```

        **Шаг 7.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 8.** Убедитесь с помощью команды **show interfaces trunk**, что порт G0/1 работает как магистральный канал (в столбце «Status» — trunking) и передает сети VLAN 10 и 30 (строка «Vlans allowed and active in management domain»).

        ```
        S1#show interfaces trunk

        Port        Mode             Encapsulation  Status        Native vlan
        Gi0/1       on               802.1q         trunking      1

        Port        Vlans allowed on trunk
        Gi0/1       1-4094

        Port        Vlans allowed and active in management domain
        Gi0/1       1,10,30,1002-1005

        Port        Vlans in spanning tree forwarding state and not pruned
        Gi0/1       1,10,30,1002-1005
        ```
    - title: "Проверка маршрутизации между сетями VLAN"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с его шлюзом по умолчанию, подинтерфейсом G0/0.10 маршрутизатора R1, командой **ping 172.17.10.1**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 172.17.10.1

        Pinging 172.17.10.1 with 32 bytes of data:

        Reply from 172.17.10.1: bytes=32 time=1ms TTL=255
        Reply from 172.17.10.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.10.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.10.1: bytes=32 time<1ms TTL=255

        Ping statistics for 172.17.10.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 2.** Проверьте связь с компьютером PC3 командой **ping 172.17.30.10**. Теперь эхо-запросы выполняются успешно: пакет из сети VLAN 10 маршрутизатор R1 пересылает в сеть VLAN 30. Значение TTL=127 в ответах на единицу меньше начального значения 128: по пути пакет прошел через один маршрутизатор.

        ```
        C:\>ping 172.17.30.10

        Pinging 172.17.30.10 with 32 bytes of data:

        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.30.10: bytes=32 time=1ms TTL=127

        Ping statistics for 172.17.30.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Откройте окно компьютера PC3 и в приложении «Командная строка» выведите его IP-конфигурацию командой **ipconfig**. В строке «Default Gateway» указан шлюз по умолчанию компьютера PC3.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:49FF:FE97:6D01
           IPv6 Address....................: ::
           IPv4 Address....................: 172.17.30.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 172.17.30.1
        ```

        **Шаг 4.** Проверьте связь со шлюзом по умолчанию, подинтерфейсом G0/0.30 маршрутизатора R1, командой **ping 172.17.30.1**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 172.17.30.1

        Pinging 172.17.30.1 with 32 bytes of data:

        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255
        Reply from 172.17.30.1: bytes=32 time<1ms TTL=255

        Ping statistics for 172.17.30.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 5.** Проверьте связь с компьютером PC1 командой **ping 172.17.10.10**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 172.17.10.10

        Pinging 172.17.10.10 with 32 bytes of data:

        Reply from 172.17.10.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.10.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.10.10: bytes=32 time=1ms TTL=127
        Reply from 172.17.10.10: bytes=32 time=1ms TTL=127

        Ping statistics for 172.17.10.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 6.** Ответьте на вопрос 5 в форме ответов.
