    - title: "Начальное состояние"
      body: |
        - На коммутаторах S1, S2 и S3 задано только имя устройства. Протокол STP работает на них с настройками по умолчанию: у всех трех коммутаторов одинаковый приоритет, и все порты находятся в сети VLAN 1.
        - На компьютерах PC1 и PC2 заданы IP-адреса и маски подсети по таблице адресации. Компьютеры находятся в одной сети, поэтому шлюз по умолчанию не задан.

        **Шаг 1.** Дождитесь, когда индикаторы соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях под схемой). Один индикатор, у порта G0/2 коммутатора S3, останется оранжевым. Наведите на него указатель мыши: появится надпись «S3 G0/2 — порт заблокирован STP», как у пункта «Порт заблокирован STP» условных обозначений.

        **Шаг 2.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 3.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC2 командой **ping 192.168.1.101**. Эхо-запросы выполняются успешно: несмотря на заблокированный порт, между компьютерами есть путь.

        ```
        C:\>ping 192.168.1.101

        Pinging 192.168.1.101 with 32 bytes of data:

        Reply from 192.168.1.101: bytes=32 time=2ms TTL=128
        Reply from 192.168.1.101: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.101: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.101: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.1.101:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```
    - title: "Определение корневого моста и заблокированного порта"
      body: |
        **Шаг 1.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите состояние связующего дерева сети VLAN 1 командой **show spanning-tree vlan 1**.

        ```
        S1>enable
        S1#show spanning-tree vlan 1
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     0001.42AA.1101
                     Cost        4
                     Port        26 (GigabitEthernet0/2)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     0001.63BB.2201
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Fa0/1            Desg FWD 19        128.1    P2p
        Gi0/1            Desg FWD 4         128.25   P2p
        Gi0/2            Root FWD 4         128.26   P2p
        ```

        **Шаг 2.** Найдите в выводе корневой мост и корневой порт. В разделе «Root ID» указан MAC-адрес корневого моста, 0001.42AA.1101, а в разделе «Bridge ID» — адрес самого коммутатора S1, 0001.63BB.2201: S1 не корневой мост. Строка «Port 26 (GigabitEthernet0/2)» называет корневой порт S1, через который он связан с корневым мостом: в таблице портов у него роль Root (столбец «Role»). По таблице соединений порт G0/2 коммутатора S1 подключен к коммутатору S2. Столбец «Sts» показывает состояние портов: все порты S1 находятся в состоянии пересылки (FWD).

        **Шаг 3.** Откройте консоль коммутатора S2 и так же выполните команды **enable** и **show spanning-tree vlan 1**. В разделе «Root ID» указано «This bridge is the root»: корневой мост — коммутатор S2. Все его порты — назначенные (Desg в столбце «Role») и находятся в состоянии пересылки (FWD).

        ```
        S2>enable
        S2#show spanning-tree vlan 1
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     0001.42AA.1101
                     This bridge is the root
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     0001.42AA.1101
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Fa0/1            Desg FWD 19        128.1    P2p
        Gi0/1            Desg FWD 4         128.25   P2p
        Gi0/2            Desg FWD 4         128.26   P2p
        ```

        **Примечание.** Корневым мостом становится коммутатор с наименьшим идентификатором моста (Bridge ID): сначала сравнивается приоритет, а при равном приоритете — MAC-адрес. У всех трех коммутаторов приоритет 32769 (32768 по умолчанию плюс номер сети VLAN 1), а наименьший MAC-адрес — у коммутатора S2, 0001.42AA.1101.

        **Шаг 4.** Откройте консоль коммутатора S3 и выполните те же команды. Корневой порт S3 — G0/1 (Port 25), подключенный к коммутатору S2. Порт G0/2, подключенный к коммутатору S1, — альтернативный (Altn) и находится в состоянии блокировки (BLK): это его индикатор на схеме оранжевый. Оставьте консоль S3 открытой.

        ```
        S3>enable
        S3#show spanning-tree vlan 1
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     0001.42AA.1101
                     Cost        4
                     Port        25 (GigabitEthernet0/1)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     0002.17CC.3301
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Gi0/1            Root FWD 4         128.25   P2p
        Gi0/2            Altn BLK 4         128.26   P2p
        ```

        **Примечание.** На соединении S1–S3 оба коммутатора находятся на одинаковом расстоянии от корневого моста: стоимость пути (Cost) до него у обоих равна 4. Тогда назначенным портом этого соединения становится порт коммутатора с меньшим идентификатором моста, S1 (0001.63BB.2201 меньше 0002.17CC.3301), а порт G0/2 коммутатора S3 блокируется. Заблокированный порт не передает кадры узлов, но продолжает принимать сообщения протокола STP от соседнего коммутатора.

        **Шаг 5.** Сравните роли и состояния портов трех коммутаторов. Соединения S1–S2, S2–S3 и S3–S1 образуют кольцо, и только один порт этого кольца не передает кадры. Ответьте на вопросы 2–4 в форме ответов.
    - title: "Наблюдение за перестроением связующего дерева"
      body: |
        **Шаг 1.** Удалите соединение между коммутаторами S1 и S2: щелкните правой кнопкой мыши кабель между S1 и S2 на схеме и выберите «Удалить соединение».

        **Шаг 2.** Сразу вернитесь в консоль коммутатора S3 и снова выполните команду **show spanning-tree vlan 1**: клавиша со стрелкой вверх (↑) вызывает предыдущую команду. Порт G0/2 по-прежнему альтернативный (Altn) и находится в состоянии блокировки (BLK).

        ```
        S3#show spanning-tree vlan 1
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     0001.42AA.1101
                     Cost        4
                     Port        25 (GigabitEthernet0/1)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     0002.17CC.3301
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Gi0/1            Root FWD 4         128.25   P2p
        Gi0/2            Altn BLK 4         128.26   P2p
        ```

        **Шаг 3.** Повторяйте команду, пока в столбце «Sts» у порта G0/2 не появится FWD, и следите, как меняются роль и состояние порта. Через 25 секунд после удаления соединения порт G0/2 уже назначенный (Desg) и находится в состоянии прослушивания (LIS).

        ```
        S3#show spanning-tree vlan 1
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     0001.42AA.1101
                     Cost        4
                     Port        25 (GigabitEthernet0/1)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     0002.17CC.3301
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Gi0/1            Root FWD 4         128.25   P2p
        Gi0/2            Desg LIS 4         128.26   P2p
        ```

        **Шаг 4.** Через 40 секунд после удаления соединения порт G0/2 находится в состоянии обучения (LRN).

        ```
        S3#show spanning-tree vlan 1
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     0001.42AA.1101
                     Cost        4
                     Port        25 (GigabitEthernet0/1)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     0002.17CC.3301
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Gi0/1            Root FWD 4         128.25   P2p
        Gi0/2            Desg LRN 4         128.26   P2p
        ```

        **Шаг 5.** Через 55 секунд после удаления соединения порт G0/2 находится в состоянии пересылки (FWD).

        ```
        S3#show spanning-tree vlan 1
        VLAN0001
          Spanning tree enabled protocol ieee
          Root ID    Priority    32769
                     Address     0001.42AA.1101
                     Cost        4
                     Port        25 (GigabitEthernet0/1)
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec

          Bridge ID  Priority    32769  (priority 32768 sys-id-ext 1)
                     Address     0002.17CC.3301
                     Hello Time   2 sec  Max Age 20 sec  Forward Delay 15 sec
                     Aging Time  300 sec

        Interface        Role Sts Cost      Prio.Nbr Type
        ---------------- ---- --- --------- -------- --------------------------------
        Gi0/1            Root FWD 4         128.25   P2p
        Gi0/2            Desg FWD 4         128.26   P2p
        ```

        **Примечание.** Продолжительность этих этапов задают таймеры STP, указанные в выводе: «Max Age 20 sec» и «Forward Delay 15 sec». Около 20 секунд (Max Age) коммутатор S3 хранит сведения о корневом мосте, полученные через порт G0/2 от коммутатора S1, и порт остается заблокированным. Когда эти сведения устаревают, порт становится назначенным и по 15 секунд (Forward Delay) проводит в состоянии прослушивания, когда он обменивается сообщениями протокола STP, но не передает кадры, и в состоянии обучения, когда он запоминает MAC-адреса отправителей, но еще не передает кадры. Поэтому в состояние пересылки порт переходит примерно через 50 секунд после удаления соединения.

        **Шаг 6.** Ответьте на вопрос 5 в форме ответов.
    - title: "Проверка связи после перестроения"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC2 командой **ping 192.168.1.101**. Эхо-запросы выполняются успешно: кадры теперь проходят через коммутатор S3, по соединениям S1–S3 и S3–S2.

        ```
        C:\>ping 192.168.1.101

        Pinging 192.168.1.101 with 32 bytes of data:

        Reply from 192.168.1.101: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.101: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.101: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.101: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.1.101:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** Посмотрите на индикаторы соединений на схеме: все они зеленые («Соединение активно»), оранжевых индикаторов нет. После удаления соединения S1–S2 коммутаторы соединены цепочкой S1–S3–S2 без петли, и протоколу STP не нужно блокировать ни один порт.
