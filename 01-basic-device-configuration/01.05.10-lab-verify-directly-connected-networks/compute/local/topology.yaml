    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1 и R2 заданы имя устройства, пароль консоли и линий VTY cisco, пароль привилегированного режима EXEC class и описания интерфейсов.
        - На маршрутизаторе R1 настроены интерфейсы G0/0/0, G0/0/1 и S0/1/0 и маршрут по умолчанию через маршрутизатор Internet.
        - На маршрутизаторе R2 включена маршрутизация IPv6, на интерфейсах G0/0/0, G0/0/1 и S0/1/1 заданы глобальные адреса и локальный адрес канала fe80::2, настроен маршрут IPv6 по умолчанию через маршрутизатор Internet.
        - Маршрутизатор Internet и сервер Dual-Stack-Server настроены по таблице адресации, и маршрутизатор Internet знает маршруты к локальным сетям R1 и R2.
        - Компьютеры PC1–PC4 настроены по таблице адресации. На коммутаторах SW1–SW4 задано только имя устройства.
        - В конфигурации маршрутизаторов R1 и R2 есть неполадки: их предстоит найти по выводу команд show и устранить.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC2 командой **ping 172.16.20.138**. Эхо-запросы не выполняются: сообщение «Destination host unreachable» выдает сам PC1 (172.16.20.10), потому что не может связаться со своим шлюзом по умолчанию.

        ```
        C:\>ping 172.16.20.138

        Pinging 172.16.20.138 with 32 bytes of data:

        Reply from 172.16.20.10: Destination host unreachable.
        Reply from 172.16.20.10: Destination host unreachable.
        Reply from 172.16.20.10: Destination host unreachable.
        Reply from 172.16.20.10: Destination host unreachable.

        Ping statistics for 172.16.20.138:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 2.** Откройте окно компьютера PC4 и в приложении «Командная строка» проверьте связь с сервером Dual-Stack-Server по IPv6 командой **ping 2001:db8:100:1::a**. Эхо-запросы тоже не выполняются.

        ```
        C:\>ping 2001:db8:100:1::a

        Pinging 2001:DB8:100:1::A with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 2001:DB8:100:1::A:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Проверка интерфейсов маршрутизатора R1"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1 и нажмите Enter. На запрос Password: введите пароль консоли cisco: вводимый пароль не отображается.

        **Шаг 2.** Перейдите в привилегированный режим EXEC командой **enable** и на запрос Password: введите пароль class.

        **Шаг 3.** Выведите краткие сведения об интерфейсах, которым назначены адреса, командой **show ip interface brief | exclude unassigned**. Фильтр exclude убирает из вывода строки со словом unassigned, то есть интерфейсы без адреса. Сравните вывод с таблицей адресации: интерфейс G0/0/0 выключен (administratively down), а адрес интерфейса S0/1/0 — 209.165.200.229, а не 209.165.200.225.

        ```
        Password: 
        R1>enable
        Password: 
        R1#show ip interface brief | exclude unassigned
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       172.16.20.1     YES manual administratively down down
        GigabitEthernet0/0/1       172.16.20.129   YES manual up                    up
        Serial0/1/0                209.165.200.229 YES manual up                    up
        ```

        **Примечание.** Фильтр задается после символа | в конце команды show: include оставляет только строки, в которых есть указанный текст, exclude убирает такие строки, а begin выводит все начиная с первой такой строки. Фильтр учитывает регистр букв. Текст можно сократить, если он все равно найдет нужные строки: begin Gate находит строку, начинающуюся с Gateway.

        **Шаг 4.** Выведите таблицу маршрутизации, начиная со строки Gateway, командой **show ip route | begin Gate**. В таблице нет подключенной сети 172.16.20.0/25 интерфейса G0/0/0, а подключенная сеть интерфейса S0/1/0 — 209.165.200.224/29 вместо 209.165.200.224/30.

        ```
        R1#show ip route | begin Gate
        Gateway of last resort is 209.165.200.226 to network 0.0.0.0

        S*    0.0.0.0/0 [1/0] via 209.165.200.226
              172.16.0.0/16 is variably subnetted, 2 subnets, 2 masks
        C        172.16.20.128/25 is directly connected, GigabitEthernet0/0/1
        L        172.16.20.129/32 is directly connected, GigabitEthernet0/0/1
              209.165.200.0/24 is variably subnetted, 2 subnets, 2 masks
        C        209.165.200.224/29 is directly connected, Serial0/1/0
        L        209.165.200.229/32 is directly connected, Serial0/1/0
        ```

        **Шаг 5.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 6.** Выведите описания интерфейсов командой **show interfaces | include Desc|conn**. Символ | между двумя строками поиска означает «или»: фильтр оставляет строки, в которых есть хотя бы одна из них. Описания выводятся в порядке интерфейсов: G0/0/0, G0/0/1, S0/1/0.

        ```
        R1#show interfaces | include Desc|conn
          Description: Connection to SW1
          Description: Connection to SW2
          Description: Connection to the Internet
        ```

        **Шаг 7.** Ответьте на вопрос 2 в форме ответов.
    - title: "Устранение неполадок на маршрутизаторе R1"
      body: |
        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0/0 командой **interface g0/0/0**.

        **Шаг 2.** Включите интерфейс командой **no shutdown**. Маршрутизатор сообщает, что интерфейс и протокол канала перешли в состояние up.

        **Шаг 3.** Перейдите к настройке интерфейса S0/1/0 командой **interface s0/1/0** и назначьте ему адрес и маску из таблицы адресации командой **ip address 209.165.200.225 255.255.255.252**: новый адрес заменяет прежний. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/0/0
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:01:17.952: %LINK-3-UPDOWN: Interface GigabitEthernet0/0/0, changed state to up
        R1(config-if)#
        *Mar  1 00:01:18.952: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0/0, changed state to up
        R1(config-if)#interface s0/1/0
        R1(config-if)#ip address 209.165.200.225 255.255.255.252
        R1(config-if)#end
        *Mar  1 00:01:28.194: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Убедитесь с помощью команды **show ip interface brief | exclude unassigned**, что все три интерфейса работают (up/up) и их адреса совпадают с таблицей адресации.

        ```
        R1#show ip interface brief | exclude unassigned
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       172.16.20.1     YES manual up                    up
        GigabitEthernet0/0/1       172.16.20.129   YES manual up                    up
        Serial0/1/0                209.165.200.225 YES manual up                    up
        ```

        **Шаг 5.** Выведите строку о режиме дуплекса интерфейса G0/0/0 командой **show interfaces g0/0/0 | include Duplex**. Слово Duplex пишется с прописной буквы: фильтр учитывает регистр.

        ```
        R1#show interfaces g0/0/0 | include Duplex
          Full Duplex, 1Gbps, media type is RJ45
        ```

        **Шаг 6.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 7.** Снова выведите таблицу маршрутизации командой **show ip route | begin Gate**. Теперь в ней есть подключенная сеть 172.16.20.0/25 интерфейса G0/0/0, а сеть интерфейса S0/1/0 — 209.165.200.224/30.

        ```
        R1#show ip route | begin Gate
        Gateway of last resort is 209.165.200.226 to network 0.0.0.0

        S*    0.0.0.0/0 [1/0] via 209.165.200.226
              172.16.0.0/16 is variably subnetted, 4 subnets, 2 masks
        C        172.16.20.0/25 is directly connected, GigabitEthernet0/0/0
        L        172.16.20.1/32 is directly connected, GigabitEthernet0/0/0
        C        172.16.20.128/25 is directly connected, GigabitEthernet0/0/1
        L        172.16.20.129/32 is directly connected, GigabitEthernet0/0/1
              209.165.200.0/24 is variably subnetted, 2 subnets, 2 masks
        C        209.165.200.224/30 is directly connected, Serial0/1/0
        L        209.165.200.225/32 is directly connected, Serial0/1/0
        ```
    - title: "Проверка интерфейсов маршрутизатора R2"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R2 и нажмите Enter. Введите пароль консоли cisco и перейдите в привилегированный режим EXEC командой **enable** с паролем class.

        **Шаг 2.** Выведите краткие сведения об интерфейсах IPv6 командой **show ipv6 interface brief**. Под каждым интерфейсом указаны его IPv6-адреса: локальный адрес канала FE80::2 и глобальный адрес.

        ```
        Password: 
        R2>enable
        Password: 
        R2#show ipv6 interface brief
        GigabitEthernet0/0/0   [up/up]
            FE80::2
            2001:DB8:C0DE:12::1
        GigabitEthernet0/0/1   [up/up]
            FE80::2
            2001:DB8:C0DE:14::1
        Serial0/1/0            [administratively down/down]
            unassigned
        Serial0/1/1            [up/up]
            FE80::2
            2001:DB8:C0DE:11::1
        ```

        **Шаг 3.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 4.** Сравните адреса интерфейсов с таблицей адресации. У интерфейса G0/0/1 глобальный адрес 2001:DB8:C0DE:14::1 из сети 2001:db8:c0de:14::/64, а компьютер PC4 за этим интерфейсом находится в сети 2001:db8:c0de:13::/64.

        **Шаг 5.** Ответьте на вопрос 5 в форме ответов.
    - title: "Устранение неполадки на маршрутизаторе R2"
      body: |
        **Примечание.** Интерфейс может иметь несколько глобальных адресов IPv6 из разных сетей, поэтому новая команда ipv6 address не заменяет прежний адрес, а добавляет еще один. Неверный адрес нужно удалить командой no ipv6 address.

        **Шаг 1.** На маршрутизаторе R2 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0/1 командой **interface g0/0/1**.

        **Шаг 2.** Удалите неверный адрес командой **no ipv6 address 2001:db8:c0de:14::1/64**.

        **Шаг 3.** Назначьте интерфейсу адрес из таблицы адресации командой **ipv6 address 2001:db8:c0de:13::1/64** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#interface g0/0/1
        R2(config-if)#no ipv6 address 2001:db8:c0de:14::1/64
        R2(config-if)#ipv6 address 2001:db8:c0de:13::1/64
        R2(config-if)#end
        *Mar  1 00:01:53.685: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Выведите таблицу маршрутизации IPv6 командой **show ipv6 route**. Подключенная сеть интерфейса G0/0/1 теперь 2001:DB8:C0DE:13::/64 (код C), а сети 2001:DB8:C0DE:14::/64 в таблице больше нет.

        ```
        R2#show ipv6 route
        IPv6 Routing Table - default - 8 entries
        Codes: C - Connected, L - Local, S - Static, U - Per-user Static route
               B - BGP, R - RIP, I1 - ISIS L1, I2 - ISIS L2
               IA - ISIS interarea, IS - ISIS summary, D - EIGRP, EX - EIGRP external
               ND - Neighbor Discovery
               O - OSPF Intra, OI - OSPF Inter, OE1 - OSPF ext 1, OE2 - OSPF ext 2
               ON1 - OSPF NSSA ext 1, ON2 - OSPF NSSA ext 2
        S   ::/0 [1/0]
             via 2001:DB8:C0DE:11::2
        C   2001:DB8:C0DE:11::/64 [0/0]
             via Serial0/1/1, directly connected
        L   2001:DB8:C0DE:11::1/128 [0/0]
             via Serial0/1/1, receive
        C   2001:DB8:C0DE:12::/64 [0/0]
             via GigabitEthernet0/0/0, directly connected
        L   2001:DB8:C0DE:12::1/128 [0/0]
             via GigabitEthernet0/0/0, receive
        C   2001:DB8:C0DE:13::/64 [0/0]
             via GigabitEthernet0/0/1, directly connected
        L   2001:DB8:C0DE:13::1/128 [0/0]
             via GigabitEthernet0/0/1, receive
        L   FF00::/8 [0/0]
             via Null0, receive
        ```

        **Шаг 5.** Выведите из текущей конфигурации строки с интерфейсами и их IPv6-адресами командой **show running-config | include ipv6|interface**.

        ```
        R2#show running-config | include ipv6|interface
        ipv6 unicast-routing
        interface GigabitEthernet0/0/0
         ipv6 address FE80::2 link-local
         ipv6 address 2001:DB8:C0DE:12::1/64
        interface GigabitEthernet0/0/1
         ipv6 address FE80::2 link-local
         ipv6 address 2001:DB8:C0DE:13::1/64
        interface Serial0/1/0
        interface Serial0/1/1
         ipv6 address FE80::2 link-local
         ipv6 address 2001:DB8:C0DE:11::1/64
        ipv6 route ::/0 2001:DB8:C0DE:11::2
        ```

        **Шаг 6.** Ответьте на вопрос 6 в форме ответов.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC2 командой **ping 172.16.20.138**. Если интерфейс G0/0/0 маршрутизатора R1 включен только что, подождите около 30 секунд: коммутатор SW1 начинает пересылать кадры через порт не сразу. Эхо-запросы выполняются успешно. Первый эхо-запрос может остаться без ответа, пока маршрутизатор определяет MAC-адрес получателя по протоколу ARP.

