    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1 и R2 заданы имя устройства, пароль консоли и линий VTY cisco и пароль привилегированного режима EXEC class.
        - На маршрутизаторе R1 настроены интерфейс S0/0/0 и маршрут по умолчанию через маршрутизатор Internet. Интерфейсы G0/0 и G0/1 не настроены и выключены.
        - На маршрутизаторе R2 включена маршрутизация IPv6, настроены интерфейс S0/0/1 (глобальный адрес и локальный адрес канала fe80::2) и маршрут IPv6 по умолчанию через маршрутизатор Internet. Интерфейсы G0/0 и G0/1 не настроены и выключены.
        - Маршрутизатор Internet и сервер Dual-Stack-Server настроены по таблице адресации, и маршрутизатор Internet знает маршруты к локальным сетям R1 и R2.
        - Компьютеры PC1–PC4 не настроены. На коммутаторах SW1–SW4 задано только имя устройства.

        **Шаг 1.** Откройте консоль маршрутизатора R1 и нажмите Enter. На запрос Password: введите пароль консоли cisco: вводимый пароль не отображается.

        **Шаг 2.** Перейдите в привилегированный режим EXEC командой **enable** и на запрос Password: введите пароль class.

        **Шаг 3.** Выведите краткие сведения об интерфейсах командой **show ip interface brief**. Интерфейс S0/0/0 работает (up/up), а интерфейсам G0/0 и G0/1 адреса не назначены (unassigned), и они выключены (administratively down).

        ```
        Password: 
        R1>enable
        Password: 
        R1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                209.165.200.225 YES manual up                    up
        Serial0/0/1                unassigned      YES unset  administratively down down
        ```

        **Шаг 4.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите параметры сетевого адаптера командой **ipconfig**. IPv4-адрес, маска и шлюз по умолчанию равны 0.0.0.0: компьютер не настроен. Локальный адрес канала IPv6 (Link-local IPv6 Address) компьютер создал сам.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```
    - title: "Настройка IPv4-адресации"
      body: |
        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**.

        **Шаг 2.** Назначьте интерфейсу адрес и маску командой **ip address 172.16.20.1 255.255.255.128** и включите его командой **no shutdown**. Маршрутизатор сообщает, что интерфейс и протокол канала перешли в состояние up.

        **Шаг 3.** Аналогично настройте интерфейс G0/1 (**interface g0/1**) с адресом 172.16.20.129 и маской 255.255.255.128 и включите его. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/0
        R1(config-if)#ip address 172.16.20.1 255.255.255.128
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:00:43.295: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        R1(config-if)#
        *Mar  1 00:00:44.295: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        R1(config-if)#interface g0/1
        R1(config-if)#ip address 172.16.20.129 255.255.255.128
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:00:54.535: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        R1(config-if)#
        *Mar  1 00:00:55.535: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        R1(config-if)#end
        *Mar  1 00:00:58.554: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Интерфейсы маршрутизатора по умолчанию выключены, поэтому, кроме адреса, каждому интерфейсу нужна команда **no shutdown**. Без нее интерфейс остается в состоянии administratively down, и сеть за ним недоступна.

        **Шаг 4.** Убедитесь с помощью команды **show ip interface brief**, что интерфейсы G0/0 и G0/1 получили адреса и работают (up/up).

        ```
        R1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.16.20.1     YES manual up                    up
        GigabitEthernet0/1         172.16.20.129   YES manual up                    up
        Serial0/0/0                209.165.200.225 YES manual up                    up
        Serial0/0/1                unassigned      YES unset  administratively down down
        ```

        **Шаг 5.** В приложении «Командная строка» компьютера PC1 задайте адрес, маску и шлюз по умолчанию командой **ipconfig 172.16.20.10 255.255.255.128 172.16.20.1**. Шлюз по умолчанию — адрес интерфейса G0/0 маршрутизатора R1.

        **Шаг 6.** Убедитесь с помощью команды **ipconfig**, что параметры заданы.

        ```
        C:\>ipconfig 172.16.20.10 255.255.255.128 172.16.20.1
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 172.16.20.10
           Subnet Mask.....................: 255.255.255.128
           Default Gateway.................: 172.16.20.1
        ```

        **Примечание.** Те же параметры можно задать в приложении «IP-конфигурация» на вкладке «Рабочий стол»: оно вводит в командной строке компьютера ту же команду.

        **Шаг 7.** Откройте окно компьютера PC2 и аналогично задайте его параметры командой **ipconfig 172.16.20.138 255.255.255.128 172.16.20.129**. Если параметры приняты, команда ничего не выводит.

        ```
        C:\>ipconfig 172.16.20.138 255.255.255.128 172.16.20.129
        ```
    - title: "Настройка IPv6-адресации"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R2 и нажмите Enter. Введите пароль консоли cisco, перейдите в привилегированный режим EXEC командой **enable** и введите пароль class.

        **Шаг 2.** Выведите краткие сведения об интерфейсах IPv6 командой **show ipv6 interface brief**. На интерфейсе S0/0/1 заданы локальный адрес канала FE80::2 и глобальный адрес, а интерфейсы G0/0 и G0/1 не настроены.

        ```
        Password: 
        R2>enable
        Password: 
        R2#show ipv6 interface brief
        GigabitEthernet0/0     [administratively down/down]
            unassigned
        GigabitEthernet0/1     [administratively down/down]
            unassigned
        Serial0/0/0            [administratively down/down]
            unassigned
        Serial0/0/1            [up/up]
            FE80::2
            2001:DB8:C0DE:11::1
        ```

        **Шаг 3.** Перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**.

        **Шаг 4.** Назначьте интерфейсу глобальный адрес командой **ipv6 address 2001:db8:c0de:12::1/64**, локальный адрес канала командой **ipv6 address fe80::2 link-local** и включите интерфейс командой **no shutdown**.

        **Шаг 5.** Аналогично настройте интерфейс G0/1 (**interface g0/1**) с глобальным адресом 2001:db8:c0de:13::1/64 и локальным адресом канала fe80::2 и включите его. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#interface g0/0
        R2(config-if)#ipv6 address 2001:db8:c0de:12::1/64
        R2(config-if)#ipv6 address fe80::2 link-local
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:01:27.166: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        R2(config-if)#
        *Mar  1 00:01:28.166: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        R2(config-if)#interface g0/1
        R2(config-if)#ipv6 address 2001:db8:c0de:13::1/64
        R2(config-if)#ipv6 address fe80::2 link-local
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:01:41.527: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        R2(config-if)#
        *Mar  1 00:01:42.527: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        R2(config-if)#end
        *Mar  1 00:01:45.547: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Локальный адрес канала (link-local) интерфейс создает сам, но такой адрес длинный и неудобен как шлюз по умолчанию. Команда **ipv6 address fe80::2 link-local** задает короткий адрес, который компьютеры укажут шлюзом. Один и тот же локальный адрес канала можно назначить нескольким интерфейсам маршрутизатора: он действует только в пределах своего канала.

        **Шаг 6.** Убедитесь с помощью команды **show ipv6 interface brief**, что интерфейсы G0/0 и G0/1 работают (up/up) и у каждого есть локальный адрес канала FE80::2 и глобальный адрес.

        ```
        R2#show ipv6 interface brief
        GigabitEthernet0/0     [up/up]
            FE80::2
            2001:DB8:C0DE:12::1
        GigabitEthernet0/1     [up/up]
            FE80::2
            2001:DB8:C0DE:13::1
        Serial0/0/0            [administratively down/down]
            unassigned
        Serial0/0/1            [up/up]
            FE80::2
            2001:DB8:C0DE:11::1
        ```

        **Шаг 7.** Откройте окно компьютера PC3 и в приложении «Командная строка» задайте IPv6-адрес с длиной префикса и шлюз IPv6 командой **ipv6config 2001:db8:c0de:12::a/64 fe80::2**. Убедитесь с помощью команды **ipconfig**, что адрес задан, а шлюзом по умолчанию стал FE80::2.

        ```
        C:\>ipv6config 2001:db8:c0de:12::a/64 fe80::2
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:49FF:FE97:6D01
           IPv6 Address....................: 2001:DB8:C0DE:12::A
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: FE80::2
                                             0.0.0.0
        ```

        **Шаг 8.** Откройте окно компьютера PC4 и аналогично задайте его параметры командой **ipv6config 2001:db8:c0de:13::a/64 fe80::2**.

        ```
        C:\>ipv6config 2001:db8:c0de:13::a/64 fe80::2
        ```
    - title: "Проверка связи"
      body: |
        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым: после включения интерфейсов маршрутизаторов на это уходит около 30 секунд. В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC2 командой **ping 172.16.20.138**. Эхо-запросы выполняются успешно. Первый эхо-запрос может остаться без ответа, пока маршрутизатор определяет MAC-адрес получателя по протоколу ARP. Значение TTL=127 показывает, что пакет прошел через один маршрутизатор.

        ```
        C:\>ping 172.16.20.138

        Pinging 172.16.20.138 with 32 bytes of data:

        Request timed out.
        Reply from 172.16.20.138: bytes=32 time=1ms TTL=127
        Reply from 172.16.20.138: bytes=32 time=1ms TTL=127
        Reply from 172.16.20.138: bytes=32 time=1ms TTL=127

        Ping statistics for 172.16.20.138:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** Проверьте связь компьютера PC1 с сервером Dual-Stack-Server командой **ping 64.100.1.10**. Эхо-запросы выполняются успешно: пакеты проходят через маршрутизаторы R1 и Internet (TTL=126).

        ```
        C:\>ping 64.100.1.10

        Pinging 64.100.1.10 with 32 bytes of data:

        Request timed out.
        Reply from 64.100.1.10: bytes=32 time=1ms TTL=126
        Reply from 64.100.1.10: bytes=32 time=1ms TTL=126
        Reply from 64.100.1.10: bytes=32 time=1ms TTL=126

        Ping statistics for 64.100.1.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Аналогично проверьте связь компьютера PC2 с сервером командой **ping 64.100.1.10**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 64.100.1.10

        Pinging 64.100.1.10 with 32 bytes of data:

        Reply from 64.100.1.10: bytes=32 time=1ms TTL=126
