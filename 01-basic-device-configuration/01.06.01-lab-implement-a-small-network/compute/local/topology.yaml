        | SW2 | VLAN 1 | 10.10.20.2 | 255.255.255.0 | ? |
        | PC-1 | NIC | ? | 255.255.255.0 | ? |
        | PC-2 | NIC | ? | 255.255.255.0 | ? |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор RTA, коммутаторы SW1 и SW2 и компьютеры PC-1 и PC-2 размещены на схеме под этими именами, но не соединены кабелями.
        - Маршрутизатор и коммутаторы не настроены: все их параметры имеют значения по умолчанию, в том числе имя устройства (приглашения Router> и Switch>), а интерфейсы маршрутизатора выключены.
        - На компьютерах IP-адреса не заданы.

        В начальном состоянии у компьютера PC-1 нет IPv4-адреса (команда **ipconfig** в приложении «Командная строка»):

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:90FF:FECD:B501
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Значения, отмеченные в таблице адресации знаком «?», вы определяете сами по требованиям.
    - title: "Подключение устройств"
      body: |
        **Требование 1.** Устройства соединены по таблице соединений: порт G0/0 маршрутизатора RTA — с портом G0/1 коммутатора SW1, порт G0/1 маршрутизатора RTA — с портом G0/1 коммутатора SW2, компьютер PC-1 — с портом F0/1 коммутатора SW1, компьютер PC-2 — с портом F0/1 коммутатора SW2.

        **Требование 2.** Все четыре соединения выполнены медным прямым кабелем.

        **Примечание.** Прямой медный кабель соединяет устройства разного типа: компьютер или маршрутизатор с коммутатором. Перекрестный кабель нужен, когда соединяются устройства одного типа, например два коммутатора.
    - title: "Базовая настройка маршрутизатора"
      body: |
        **Требование 3.** Имя устройства маршрутизатора — RTA.

        **Требование 4.** Пароль привилегированного режима EXEC — Netenpa55. Он хранится в конфигурации в зашифрованном виде.

        **Требование 5.** Вход с консоли и по линиям виртуальных терминалов (VTY) защищен паролем Netlinepa55.

        **Требование 6.** При подключении к маршрутизатору выводится баннер дня (MOTD) с предупреждением о том, что доступ разрешен только авторизованным пользователям. Текст баннера выбираете вы.

        **Требование 7.** Интерфейсы G0/0 и G0/1 маршрутизатора включены, имеют IP-адреса и маски подсети из таблицы адресации и описание: например, к какому устройству подключен интерфейс.

        **Требование 8.** Текущая конфигурация маршрутизатора сохранена в загрузочную конфигурацию (startup-config).
    - title: "Настройка коммутаторов"
      body: |
        **Требование 9.** Интерфейс управления каждого коммутатора — интерфейс VLAN 1 — включен и имеет IP-адрес и маску подсети из таблицы адресации: у SW1 — 10.10.10.2, у SW2 — 10.10.20.2.

        **Требование 10.** Каждый коммутатор может обмениваться данными с узлами других сетей: его шлюз по умолчанию — интерфейс маршрутизатора RTA в той же сети, что и интерфейс управления коммутатора.

        **Требование 11.** Пароль привилегированного режима EXEC на обоих коммутаторах — Netenpa55 в зашифрованном виде, как на маршрутизаторе.

        **Требование 12.** Вход с консоли и по линиям виртуальных терминалов (VTY) каждого коммутатора защищен паролем Netlinepa55.

        **Требование 13.** Текущая конфигурация каждого коммутатора сохранена в загрузочную конфигурацию.

        **Примечание.** Коммутатор пересылает кадры и без IP-адреса. Адрес интерфейса управления нужен самому коммутатору, чтобы к нему можно было подключиться по сети, а шлюз по умолчанию — чтобы коммутатор мог ответить узлу из другой сети.
    - title: "Настройка компьютеров"
      body: |
        **Требование 14.** Компьютеру PC-1 назначен свободный адрес узла сети 10.10.10.0/24, а компьютеру PC-2 — свободный адрес узла сети 10.10.20.0/24, оба с маской 255.255.255.0. Адреса .1 и .2 в каждой сети уже заняты маршрутизатором и коммутатором.

        **Требование 15.** Шлюз по умолчанию каждого компьютера — интерфейс маршрутизатора RTA в сети этого компьютера.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC-1 проверьте связь с компьютером PC-2 командой **ping** с адресом, который вы назначили PC-2. Компьютер PC-1 получает ответы от PC-2: маршрутизатор RTA пересылает пакеты между сетями 10.10.10.0/24 и 10.10.20.0/24.

        **Шаг 2.** С компьютера PC-1 проверьте связь с коммутатором SW2 командой **ping 10.10.20.2**. Коммутатор SW2 отвечает: его интерфейс управления включен, а шлюз по умолчанию позволяет ему ответить узлу из другой сети. Первый эхо-запрос может остаться без ответа: в это время устройства определяют MAC-адреса друг друга по протоколу ARP.

        ```
        C:\>ping 10.10.20.2

        Pinging 10.10.20.2 with 32 bytes of data:

        Request timed out.
        Reply from 10.10.20.2: bytes=32 time=1ms TTL=254
        Reply from 10.10.20.2: bytes=32 time=1ms TTL=254
        Reply from 10.10.20.2: bytes=32 time=1ms TTL=254

        Ping statistics for 10.10.20.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Аналогично в приложении «Командная строка» компьютера PC-2 проверьте связь с коммутатором SW1 командой **ping 10.10.10.2**. Коммутатор SW1 отвечает.

        ```
        C:\>ping 10.10.10.2

        Pinging 10.10.10.2 with 32 bytes of data:

        Request timed out.
        Reply from 10.10.10.2: bytes=32 time=1ms TTL=254
        Reply from 10.10.10.2: bytes=32 time=1ms TTL=254
        Reply from 10.10.10.2: bytes=32 time=1ms TTL=254

        Ping statistics for 10.10.10.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 4.** С компьютера PC-2 проверьте связь с интерфейсом G0/0 маршрутизатора RTA командой **ping 10.10.10.1**. Маршрутизатор отвечает.

        ```
        C:\>ping 10.10.10.1

        Pinging 10.10.10.1 with 32 bytes of data:

        Reply from 10.10.10.1: bytes=32 time<1ms TTL=255
        Reply from 10.10.10.1: bytes=32 time<1ms TTL=255
        Reply from 10.10.10.1: bytes=32 time<1ms TTL=255
        Reply from 10.10.10.1: bytes=32 time<1ms TTL=255

        Ping statistics for 10.10.10.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```
