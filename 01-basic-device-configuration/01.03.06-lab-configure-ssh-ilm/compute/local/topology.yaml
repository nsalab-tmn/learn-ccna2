scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | PC1 | F0 | S1 | F0/1 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети |
        |---|---|---|---|
        | S1 | VLAN 1 | 10.10.10.2 | 255.255.255.0 |
        | PC1 | NIC | 10.10.10.10 | 255.255.255.0 |
    - title: "Начальное состояние"
      body: |
        - На коммутаторе S1 заданы имя устройства и IP-адрес интерфейса VLAN 1 по таблице адресации. Пароль привилегированного режима EXEC, пароль линии консоли и пароль линий VTY — cisco, и все они записаны в конфигурации открытым текстом.
        - Линии VTY принимают подключения по протоколу Telnet и проверяют только пароль линии. Протокол SSH не настроен: на коммутаторе нет доменного имени, ключей RSA и учетных записей пользователей.
        - На компьютере PC1 заданы IP-адрес и маска подсети по таблице адресации.

        **Примечание.** Загрузочная конфигурация коммутатора совпадает с начальной. Если, настраивая линии VTY, вы потеряете удаленный доступ к S1, выключите и снова включите коммутатор кнопками «Выключить S1» и «Включить S1» над ним на схеме: он загрузится с начальной конфигурацией, и работу можно будет начать заново.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Подключитесь к коммутатору S1 по протоколу Telnet командой **telnet 10.10.10.2**. На запрос «Password:» введите пароль линий VTY **cisco**: вводимые символы не отображаются.

        **Шаг 2.** Перейдите в привилегированный режим EXEC командой **enable** и введите пароль **cisco**.

        ```
        C:\>telnet 10.10.10.2
        Trying 10.10.10.2 ... Open

        User Access Verification

        Password: 
        S1>enable
        Password: 
        ```

        **Шаг 3.** Выведите строки текущей конфигурации, в которых есть слово password, командой **show running-config | include password**. Все пароли записаны открытым текстом: пароль привилегированного режима EXEC (enable password), пароль линии консоли и пароли двух групп линий VTY (0–4 и 5–15).

        ```
        S1#show running-config | include password
        enable password cisco
         password cisco
         password cisco
         password cisco
        ```

        Дальнейшие команды вводите в этом сеансе Telnet: приглашение S1# в окне компьютера PC1 означает, что команды выполняет коммутатор S1.
    - title: "Шифрование паролей"
      body: |
        **Шаг 1.** В сеансе Telnet перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Включите шифрование паролей командой **service password-encryption** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#service password-encryption
        S1(config)#end
        ```

        **Шаг 3.** Снова выведите строки с паролями командой **show running-config | include password**. Теперь вместо каждого пароля в конфигурации записано его зашифрованное значение с номером типа 7, например enable password 7 00071A150754, а в начале конфигурации появилась строка service password-encryption.

        ```
        S1#show running-config | include password
        service password-encryption
        enable password 7 00071A150754
         password 7 00071A150754
         password 7 00071A150754
         password 7 00071A150754
        ```

        **Примечание.** Команда **service password-encryption** шифрует пароли, записанные в конфигурации открытым текстом, простым обратимым алгоритмом (тип 7). Так пароль нельзя прочитать с экрана, но зашифрованное значение можно расшифровать. Пароль учетной записи, заданный командой **username … secret**, хранится в виде хеша (тип 5), который не расшифровывается.
    - title: "Настройка протокола SSH"
      body: |
        **Примечание.** Для работы SSH коммутатору нужны доменное имя и пара ключей RSA: ключи шифруют сеанс, а их имя составляется из имени устройства и доменного имени. Вход по SSH выполняется под учетной записью пользователя, поэтому линии VTY должны проверять имя пользователя и пароль по локальной базе учетных записей коммутатора.

        **Шаг 1.** Перейдите в режим глобальной конфигурации командой **configure terminal** и задайте доменное имя командой **ip domain-name netacad.pka**.

        **Шаг 2.** Создайте ключи RSA командой **crypto key generate rsa**. На вопрос «How many bits in the modulus [512]:» введите длину ключа **1024**. Имя ключей — S1.netacad.pka: имя устройства и доменное имя.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#ip domain-name netacad.pka
        S1(config)#crypto key generate rsa
        The name for the keys will be: S1.netacad.pka
        Choose the size of the key modulus in the range of 360 to 4096 for your
          General Purpose Keys. Choosing a key modulus greater than 512 may take
          a few minutes.

        How many bits in the modulus [512]: 1024
        % Generating 1024 bit RSA keys, keys will be non-exportable...
        [OK]
        ```

        **Шаг 3.** Создайте учетную запись пользователя administrator с паролем cisco командой **username administrator secret cisco**.

        **Шаг 4.** Перейдите к настройке всех линий VTY командой **line vty 0 15**. Включите проверку учетных записей по локальной базе командой **login local** и разрешите на линиях только протокол SSH командой **transport input ssh**.

        **Шаг 5.** Удалите пароль линий VTY командой **no password**: при входе по учетной записи он больше не нужен. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1(config)#username administrator secret cisco
        S1(config)#line vty 0 15
        S1(config-line)#login local
        S1(config-line)#transport input ssh
        S1(config-line)#no password
        S1(config-line)#end
        ```

        **Примечание.** Текущий сеанс Telnet продолжает работать: новые настройки линий VTY действуют для новых подключений.

        **Шаг 6.** Убедитесь с помощью команды **show running-config | section line vty**, что на обеих группах линий VTY (0–4 и 5–15) настроены login local и transport input ssh, а строк password больше нет.

        ```
        S1#show running-config | section line vty
        line vty 0 4
         login local
         transport input ssh
        line vty 5 15
         login local
         transport input ssh
        ```

        **Шаг 7.** Убедитесь с помощью команды **show ip ssh**, что протокол SSH включен (строка «SSH Enabled»).

        ```
        S1#show ip ssh
        SSH Enabled - version 1.99
        Authentication timeout: 120 secs; Authentication retries: 3
        Minimum expected Diffie Hellman key size : 1024 bits
        ```
    - title: "Проверка удаленного доступа"
      body: |
        **Шаг 1.** Завершите сеанс Telnet командой **exit**. Коммутатор закрывает соединение, и в окне компьютера PC1 снова появляется приглашение C:\>.

        ```
        S1#exit


        [Connection to 10.10.10.2 closed by foreign host]
        ```

        **Шаг 2.** Снова подключитесь к коммутатору по протоколу Telnet командой **telnet 10.10.10.2**. Подключение не устанавливается: линии VTY принимают только подключения по SSH.

        ```
        C:\>telnet 10.10.10.2
        Trying 10.10.10.2 ... 
        % Connection refused by remote host
        ```

        **Шаг 3.** Подключитесь к коммутатору по SSH под учетной записью administrator командой **ssh -l administrator 10.10.10.2**: параметр -l (латинская буква L) задает имя пользователя. На запрос «Password:» введите пароль учетной записи **cisco**.

        **Шаг 4.** Перейдите в привилегированный режим EXEC командой **enable** и введите пароль **cisco**.

        ```
        C:\>ssh -l administrator 10.10.10.2
        Password: 
        S1>enable
        Password: 
        ```

        **Шаг 5.** Сохраните конфигурацию командой **copy running-config startup-config** и подтвердите имя файла клавишей Enter.

        ```
        S1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```
