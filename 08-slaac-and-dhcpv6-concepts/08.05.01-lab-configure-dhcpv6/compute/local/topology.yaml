        | PC-B | NIC | автоматически | автоматически | автоматически |

        Маршрут по умолчанию (::/0) на R1 указывает на адрес 2001:db8:acad:2::2 маршрутизатора R2, а на R2 — на адрес 2001:db8:acad:2::1 маршрутизатора R1.
    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы R1 и R2 не настроены: у них имя Router, интерфейсы G0/0/0 и G0/0/1 выключены, адресов и маршрутов нет, маршрутизация IPv6 не включена.
        - На коммутаторах S1 и S2 задано только имя устройства, остальные параметры имеют значения по умолчанию.
        - Адаптеры компьютеров PC-A и PC-B работают в режиме «Автоматически» (приложение «IP-конфигурация», раздел IPv6): переключать ничего не нужно.

        **Шаг 1.** Откройте окно компьютера PC-A и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выполните команду **ipv6config**. У PC-A есть только локальный адрес канала, а глобального адреса IPv6 и шлюза по умолчанию нет: маршрутизаторы еще не настроены, и объявлений маршрутизатора (RA) в сети никто не отправляет.

        ```
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: ::
           Default Gateway.................: ::
        ```
    - title: "Настройка маршрутизаторов"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**, а затем в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Присвойте маршрутизатору имя командой **hostname R1** и отключите поиск DNS командой **no ip domain-lookup**, чтобы маршрутизатор не пытался преобразовывать неверно введенные команды в имена узлов.

        **Шаг 3.** Задайте зашифрованный пароль привилегированного режима командой **enable secret Dhcp6enpa55**. Пароли чувствительны к регистру, поэтому вводите их точно так, как они написаны.

        ```
        Router>enable
        Router#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Router(config)#hostname R1
        R1(config)#no ip domain-lookup
        R1(config)#enable secret Dhcp6enpa55
        ```

        **Шаг 4.** Задайте пароль консоли и включите проверку пароля при входе командами **line console 0**, **password Dhcp6linepa55** и **login**.

        **Шаг 5.** Аналогично задайте тот же пароль на линиях VTY 0–4 командами **line vty 0 4**, **password Dhcp6linepa55** и **login**. Вернитесь в режим глобальной конфигурации командой **exit**.

        **Шаг 6.** Зашифруйте открытые пароли командой **service password-encryption** и создайте баннер с предупреждением о запрете несанкционированного доступа командой **banner motd #Unauthorized access is prohibited#**.

        ```
        R1(config)#line console 0
        R1(config-line)#password Dhcp6linepa55
        R1(config-line)#login
        R1(config-line)#line vty 0 4
        R1(config-line)#password Dhcp6linepa55
        R1(config-line)#login
        R1(config-line)#exit
        R1(config)#service password-encryption
        R1(config)#banner motd #Unauthorized access is prohibited#
        ```

        **Шаг 7.** Включите маршрутизацию IPv6 командой **ipv6 unicast-routing**.

        **Шаг 8.** Перейдите к настройке интерфейса G0/0/0 командой **interface g0/0/0**. Задайте локальный адрес канала командой **ipv6 address fe80::1 link-local**, адрес по таблице адресации командой **ipv6 address 2001:db8:acad:2::1/64** и включите интерфейс командой **no shutdown**. Интерфейс остается в состоянии down, пока не настроен R2.

        **Шаг 9.** Аналогично настройте интерфейс G0/0/1 (**interface g0/0/1**): локальный адрес канала fe80::1 и адрес 2001:db8:acad:1::1/64. Вернитесь в режим глобальной конфигурации командой **exit**.

        **Шаг 10.** Задайте маршрут по умолчанию через R2 командой **ipv6 route ::/0 2001:db8:acad:2::2** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1(config)#ipv6 unicast-routing
        R1(config)#interface g0/0/0
        R1(config-if)#ipv6 address fe80::1 link-local
        R1(config-if)#ipv6 address 2001:db8:acad:2::1/64
        R1(config-if)#no shutdown
        *Mar  1 00:03:06.000: %LINK-3-UPDOWN: Interface GigabitEthernet0/0/0, changed state to down
        R1(config-if)#interface g0/0/1
        R1(config-if)#ipv6 address fe80::1 link-local
        R1(config-if)#ipv6 address 2001:db8:acad:1::1/64
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:03:24.000: %LINK-3-UPDOWN: Interface GigabitEthernet0/0/1, changed state to up
        R1(config-if)#
        *Mar  1 00:03:25.000: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0/1, changed state to up
        R1(config-if)#exit
        R1(config)#ipv6 route ::/0 2001:db8:acad:2::2
        R1(config)#end
        *Mar  1 00:03:35.750: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Пока маршрутизация IPv6 не включена, маршрутизатор не пересылает пакеты IPv6 и не отправляет объявления маршрутизатора (RA), по которым компьютеры настраивают адреса. Локальный адрес канала fe80::1 задан вручную, чтобы шлюзом по умолчанию для компьютеров был понятный адрес. Он действует только в пределах своего канала, поэтому одинаковые значения на разных интерфейсах не конфликтуют.

        **Шаг 11.** Сохраните конфигурацию командой **copy running-config startup-config** и подтвердите имя файла нажатием Enter.

        ```
        R1#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        ```

        **Шаг 12.** Откройте консоль маршрутизатора R2, нажмите Enter и аналогично выполните на нем шаги 1–11. Имя устройства — R2 (**hostname R2**), пароли и баннер те же. На интерфейсе G0/0/0 задайте локальный адрес канала fe80::2 и адрес 2001:db8:acad:2::2/64, на интерфейсе G0/0/1 — локальный адрес канала fe80::1 и адрес 2001:db8:acad:3::1/64. Маршрут по умолчанию ведет на R1: **ipv6 route ::/0 2001:db8:acad:2::1**.

        ```
        Router>enable
        Router#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Router(config)#hostname R2
        R2(config)#no ip domain-lookup
        R2(config)#enable secret Dhcp6enpa55
        R2(config)#line console 0
        R2(config-line)#password Dhcp6linepa55
        R2(config-line)#login
        R2(config-line)#line vty 0 4
        R2(config-line)#password Dhcp6linepa55
        R2(config-line)#login
        R2(config-line)#exit
        R2(config)#service password-encryption
        R2(config)#banner motd #Unauthorized access is prohibited#
        R2(config)#ipv6 unicast-routing
        R2(config)#interface g0/0/0
        R2(config-if)#ipv6 address fe80::2 link-local
        R2(config-if)#ipv6 address 2001:db8:acad:2::2/64
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:05:20.250: %LINK-3-UPDOWN: Interface GigabitEthernet0/0/0, changed state to up
        R2(config-if)#
        *Mar  1 00:05:21.250: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0/0, changed state to up
        R2(config-if)#interface g0/0/1
        R2(config-if)#ipv6 address fe80::1 link-local
        R2(config-if)#ipv6 address 2001:db8:acad:3::1/64
        R2(config-if)#no shutdown
        R2(config-if)#
        *Mar  1 00:05:37.250: %LINK-3-UPDOWN: Interface GigabitEthernet0/0/1, changed state to up
        R2(config-if)#
        *Mar  1 00:05:38.250: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0/1, changed state to up
        R2(config-if)#exit
        R2(config)#ipv6 route ::/0 2001:db8:acad:2::1
        R2(config)#end
        *Mar  1 00:05:49.000: %SYS-5-CONFIG_I: Configured from console by console
        R2#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        ```

        **Шаг 13.** На R1 проверьте связь с интерфейсом G0/0/1 маршрутизатора R2 командой **ping 2001:db8:acad:3::1**. Пять восклицательных знаков в строке результата означают, что все пять эхо-запросов выполнены успешно. Затем убедитесь с помощью команды **show ipv6 interface brief**, что оба интерфейса R1 находятся в состоянии up/up и имеют адреса из таблицы адресации.

        ```
        R1#ping 2001:db8:acad:3::1
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 2001:DB8:ACAD:3::1, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms
        R1#show ipv6 interface brief
        GigabitEthernet0/0/0   [up/up]
            FE80::1
            2001:DB8:ACAD:2::1
        GigabitEthernet0/0/1   [up/up]
            FE80::1
            2001:DB8:ACAD:1::1
        ```

        **Шаг 14.** Необязательно. Откройте консоль коммутатора S1, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable**, а затем в режим глобальной конфигурации командой **configure terminal**. Выполните настройки, как на маршрутизаторах: отключите поиск DNS (**no ip domain-lookup**), задайте тот же пароль привилегированного режима (**enable secret Dhcp6enpa55**) и те же пароли консоли и линий VTY 0–15 (**line vty 0 15**), зашифруйте пароли, создайте баннер, отключите неиспользуемые порты командой **interface range f0/1-5, f0/7-24, g0/2** и **shutdown**, вернитесь в привилегированный режим EXEC командой **end** и сохраните конфигурацию. Эти настройки не влияют на работу остальных частей лабораторной работы. Вывод команды **shutdown** содержит по строке на каждый порт, в блоке показаны не все строки.

        ```
        S1>enable
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#no ip domain-lookup
        S1(config)#enable secret Dhcp6enpa55
        S1(config)#line console 0
        S1(config-line)#password Dhcp6linepa55
        S1(config-line)#login
        S1(config-line)#line vty 0 15
        S1(config-line)#password Dhcp6linepa55
        S1(config-line)#login
        S1(config-line)#exit
        S1(config)#service password-encryption
        S1(config)#banner motd #Unauthorized access is prohibited#
        S1(config)#interface range f0/1-5, f0/7-24, g0/2
        S1(config-if-range)#shutdown
        *Mar  1 00:07:24.000: %LINK-5-CHANGED: Interface FastEthernet0/1, changed state to administratively down
        …
        *Mar  1 00:07:24.000: %LINK-5-CHANGED: Interface GigabitEthernet0/2, changed state to administratively down
        S1(config-if-range)#end
        *Mar  1 00:07:28.250: %SYS-5-CONFIG_I: Configured from console by console
        S1#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        ```

        **Шаг 15.** Необязательно. Аналогично настройте коммутатор S2. Неиспользуемые порты S2: **interface range f0/1-17, f0/19-24, g0/2**.

        ```
        S2>enable
        S2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S2(config)#no ip domain-lookup
        S2(config)#enable secret Dhcp6enpa55
        S2(config)#line console 0
        S2(config-line)#password Dhcp6linepa55
        S2(config-line)#login
        S2(config-line)#line vty 0 15
        S2(config-line)#password Dhcp6linepa55
        S2(config-line)#login
        S2(config-line)#exit
        S2(config)#service password-encryption
        S2(config)#banner motd #Unauthorized access is prohibited#
        S2(config)#interface range f0/1-17, f0/19-24, g0/2
        S2(config-if-range)#shutdown
        *Mar  1 00:08:49.750: %LINK-5-CHANGED: Interface FastEthernet0/1, changed state to administratively down
        …
        *Mar  1 00:08:49.750: %LINK-5-CHANGED: Interface GigabitEthernet0/2, changed state to administratively down
        S2(config-if-range)#end
        *Mar  1 00:08:54.000: %SYS-5-CONFIG_I: Configured from console by console
        S2#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        ```
    - title: "Проверка адреса SLAAC"
      body: |
        **Шаг 1.** На компьютере PC-A выполните команду **ipv6config**. Появились глобальный адрес из сети 2001:db8:acad:1::/64 и шлюз по умолчанию FE80::1. Если глобального адреса еще нет, подождите около минуты и повторите команду.

        **Шаг 2.** Выполните команду **ipconfig /all** и сравните строки Physical Address и IPv6 Address. DNS-суффикса и DNS-сервера нет: при SLAAC компьютер узнает только префикс и шлюз.

        ```
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: 2001:DB8:ACAD:1:2D0:D1FF:FE20:9701/64
           Default Gateway.................: FE80::1

        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Physical Address................: 00-D0-D1-20-97-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: 2001:DB8:ACAD:1:2D0:D1FF:FE20:9701
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: FE80::1
                                             0.0.0.0
           DHCP Servers....................: 0.0.0.0
           DHCPv6 IAID.....................: 3508573953
           DHCPv6 Client DUID..............: 00-03-00-01-00-D0-D1-20-97-01
           DNS Servers.....................: 0.0.0.0
        ```

        **Примечание.** После включения интерфейса маршрутизатор отправляет объявление маршрутизатора (RA) несколько раз с интервалом 16 секунд, а коммутатор около 30 секунд не передает кадры через порт, пока он проходит состояния протокола STP. Поэтому адрес появляется не сразу.

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.
    - title: "Настройка DHCPv6 без сохранения состояния"
      body: |
        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal** и создайте пул адресов и параметров DHCPv6 командой **ipv6 dhcp pool R1-STATELESS**.

        **Шаг 2.** В пуле задайте адрес DNS-сервера командой **dns-server 2001:db8:acad::254** и имя домена командой **domain-name STATELESS.com**. Имена вводите точно так, как они написаны.

        **Шаг 3.** Перейдите к настройке интерфейса G0/0/1 командой **interface g0/0/1**. Установите флаг O в объявлениях маршрутизатора командой **ipv6 nd other-config-flag** и назначьте интерфейсу пул командой **ipv6 dhcp server R1-STATELESS**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ipv6 dhcp pool R1-STATELESS
        R1(config-dhcpv6)#dns-server 2001:db8:acad::254
        R1(config-dhcpv6)#domain-name STATELESS.com
        R1(config-dhcpv6)#interface g0/0/1
        R1(config-if)#ipv6 nd other-config-flag
        R1(config-if)#ipv6 dhcp server R1-STATELESS
        R1(config-if)#end
        *Mar  1 00:09:55.000: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Флаг O в объявлении маршрутизатора сообщает компьютерам: адрес образуйте сами, а остальные параметры, такие как DNS-сервер и имя домена, запросите у сервера DHCPv6. Сервер без сохранения состояния не выдает адреса и не хранит сведений о клиентах.

        **Шаг 4.** Сохраните конфигурацию командой **copy running-config startup-config** и подтвердите имя файла нажатием Enter.

        ```
        R1#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        ```

        **Шаг 5.** Убедитесь с помощью команды **show ipv6 dhcp pool**, что пул R1-STATELESS создан и содержит DNS-сервер и имя домена, а с помощью команды **show ipv6 interface g0/0/1 | include Hosts** — что на G0/0/1 установлен флаг O (строка `Hosts use DHCP to obtain other configuration`).

        ```
        R1#show ipv6 dhcp pool
        DHCPv6 pool: R1-STATELESS
          DNS server: 2001:DB8:ACAD::254
          Domain name: STATELESS.com
          Active clients: 0
        R1#show ipv6 interface g0/0/1 | include Hosts
          Hosts use stateless autoconfig for addresses.
          Hosts use DHCP to obtain other configuration.
        ```

        **Шаг 6.** Чтобы PC-A повторил запрос параметров, выполните на нем команду **ipv6config /renew**: она ничего не выводит. Затем выполните **ipconfig /all** и сравните вывод с предыдущим: появились DNS-суффикс STATELESS.com и DNS-сервер 2001:DB8:ACAD::254, а IPv6-адрес остался прежним.

        ```
        C:\>ipv6config /renew
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: STATELESS.com
           Physical Address................: 00-D0-D1-20-97-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: 2001:DB8:ACAD:1:2D0:D1FF:FE20:9701
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: FE80::1
                                             0.0.0.0
           DHCP Servers....................: 0.0.0.0
           DHCPv6 IAID.....................: 3508573953
           DHCPv6 Client DUID..............: 00-03-00-01-00-D0-D1-20-97-01
           DNS Servers.....................: 2001:DB8:ACAD::254
                                             0.0.0.0
        ```

        **Шаг 7.** Ответьте на вопрос 2 в форме ответов.
    - title: "Настройка DHCPv6 с сохранением состояния"
      body: |
        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**, создайте пул командой **ipv6 dhcp pool R2-STATEFUL** и задайте префикс выдаваемых адресов командой **address prefix 2001:db8:acad:3:aaa::/80**.

        **Шаг 2.** В пуле задайте адрес DNS-сервера командой **dns-server 2001:db8:acad::254** и имя домена командой **domain-name STATEFUL.com**.

        **Шаг 3.** Перейдите к настройке интерфейса G0/0/0 командой **interface g0/0/0**, назначьте ему пул командой **ipv6 dhcp server R2-STATEFUL** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ipv6 dhcp pool R2-STATEFUL
        R1(config-dhcpv6)#address prefix 2001:db8:acad:3:aaa::/80
        R1(config-dhcpv6)#dns-server 2001:db8:acad::254
        R1(config-dhcpv6)#domain-name STATEFUL.com
        R1(config-dhcpv6)#interface g0/0/0
        R1(config-if)#ipv6 dhcp server R2-STATEFUL
        R1(config-if)#end
        *Mar  1 00:11:14.500: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Запросы клиентов из сети R2 приходят на R1 через интерфейс G0/0/0, поэтому пул назначается ему, а не интерфейсу G0/0/1. Сервер с сохранением состояния выдает адрес из префикса пула в аренду и запоминает, какому клиенту он выдан.

        **Шаг 4.** Сохраните конфигурацию командой **copy running-config startup-config** и подтвердите имя файла нажатием Enter.

        ```
        R1#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        ```

        **Шаг 5.** Убедитесь с помощью команды **show ipv6 dhcp pool**, что теперь на R1 два пула и что у пула R2-STATEFUL задан префикс адресов, а выданных адресов пока нет (0 in use).

        ```
        R1#show ipv6 dhcp pool
        DHCPv6 pool: R1-STATELESS
          DNS server: 2001:DB8:ACAD::254
          Domain name: STATELESS.com
          Active clients: 0
        DHCPv6 pool: R2-STATEFUL
          Address allocation prefix: 2001:DB8:ACAD:3:AAA::/80 valid 172800 preferred 86400 (0 in use, 0 conflicts)
          DNS server: 2001:DB8:ACAD::254
          Domain name: STATEFUL.com
          Active clients: 0
        ```
    - title: "Настройка ретрансляции DHCPv6"
      body: |
        **Шаг 1.** На компьютере PC-B выполните команду **ipconfig /all**. Адрес в сети 2001:db8:acad:3::/64 компьютер образовал сам по SLAAC: R2 уже отправляет объявления маршрутизатора, а DNS-сервера и DNS-суффикса пока нет.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Physical Address................: 00-D0-BA-1C-19-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:BAFF:FE1C:1901
           IPv6 Address....................: 2001:DB8:ACAD:3:2D0:BAFF:FE1C:1901
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: FE80::1
                                             0.0.0.0
           DHCP Servers....................: 0.0.0.0
           DHCPv6 IAID.....................: 3122403585
           DHCPv6 Client DUID..............: 00-03-00-01-00-D0-BA-1C-19-01
           DNS Servers.....................: 0.0.0.0
        ```

        **Шаг 2.** Откройте консоль маршрутизатора R2 и перейдите в режим глобальной конфигурации командой **configure terminal**. Консоль закрывает сеанс после 10 минут без ввода: если вместо приглашения на ней появился запрос пароля или надпись `Press RETURN to get started.`, нажмите Enter, введите пароль консоли Dhcp6linepa55, перейдите в привилегированный режим EXEC командой **enable** и введите пароль Dhcp6enpa55.

        **Шаг 3.** Перейдите к настройке интерфейса G0/0/1 командой **interface g0/0/1**. Установите флаг M в объявлениях маршрутизатора командой **ipv6 nd managed-config-flag** и включите ретрансляцию запросов DHCPv6 на интерфейс G0/0/0 маршрутизатора R1 командой **ipv6 dhcp relay destination 2001:db8:acad:2::1 g0/0/0**. Вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 4.** Сохраните конфигурацию командой **copy running-config startup-config** и подтвердите имя файла нажатием Enter.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#interface g0/0/1
        R2(config-if)#ipv6 nd managed-config-flag
        R2(config-if)#ipv6 dhcp relay destination 2001:db8:acad:2::1 g0/0/0
        R2(config-if)#end
        *Mar  1 00:12:12.750: %SYS-5-CONFIG_I: Configured from console by console
        R2#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        ```

        **Примечание.** Клиент DHCPv6 отправляет запросы на групповой адрес, и они не выходят за пределы его сети. Агент ретрансляции на R2 пересылает запросы серверу на R1 одноадресными сообщениями, а ответы возвращает клиенту. Флаг M в объявлении маршрутизатора сообщает компьютерам, что адрес нужно получить у сервера DHCPv6.

        **Шаг 5.** На компьютере PC-B выполните команду **ipv6config /renew**, а затем **ipconfig /all**. Теперь у PC-B адрес из сети 2001:db8:acad:3:aaa::/80, DNS-сервер 2001:DB8:ACAD::254 и DNS-суффикс STATEFUL.com.

        ```
        C:\>ipv6config /renew
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: STATEFUL.com
           Physical Address................: 00-D0-BA-1C-19-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:BAFF:FE1C:1901
           IPv6 Address....................: 2001:DB8:ACAD:3:AAA:FAAB:E5CE:8345
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: FE80::1
                                             0.0.0.0
           DHCP Servers....................: 0.0.0.0
           DHCPv6 IAID.....................: 3122403585
           DHCPv6 Client DUID..............: 00-03-00-01-00-D0-BA-1C-19-01
           DNS Servers.....................: 2001:DB8:ACAD::254
                                             0.0.0.0
        ```

        **Шаг 6.** На маршрутизаторе R1 выведите список выданных адресов командой **show ipv6 dhcp binding**.

        ```
        R1#show ipv6 dhcp binding
        Client: FE80::2D0:BAFF:FE1C:1901
          DUID: 0003000100D0BA1C1901
          Username : unassigned
          VRF : default
          IA NA: IA ID 0xBA1C1901, T1 43200, T2 69120
            Address: 2001:DB8:ACAD:3:AAA:FAAB:E5CE:8345
                    preferred lifetime 86400, valid lifetime 172800
                    expires at Mar 03 1993 12:12 AM (172786 seconds)
        ```

        **Шаг 7.** Ответьте на вопрос 3 в форме ответов.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** На компьютере PC-A проверьте связь с интерфейсом G0/0/1 маршрутизатора R2 командой **ping 2001:db8:acad:3::1**. Все четыре эхо-запроса получают ответы: пакеты проходят из сети R1 через R1 и R2 в сеть R2.

        ```
        C:\>ping 2001:db8:acad:3::1

        Pinging 2001:DB8:ACAD:3::1 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:3::1: bytes=32 time=2ms TTL=63
        Reply from 2001:DB8:ACAD:3::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:ACAD:3::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:ACAD:3::1: bytes=32 time=1ms TTL=63

        Ping statistics for 2001:DB8:ACAD:3::1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 2.** На компьютере PC-B проверьте связь с интерфейсом G0/0/1 маршрутизатора R1 командой **ping 2001:db8:acad:1::1**. Ответы получены и на этот раз: у PC-B есть адрес, выданный по DHCPv6, и шлюз по умолчанию.

        ```
        C:\>ping 2001:db8:acad:1::1

        Pinging 2001:DB8:ACAD:1::1 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:1::1: bytes=32 time=2ms TTL=63
        Reply from 2001:DB8:ACAD:1::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:ACAD:1::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:ACAD:1::1: bytes=32 time=1ms TTL=63

        Ping statistics for 2001:DB8:ACAD:1::1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```
